[package]
name = "dd-tests"
version = "0.4.0"
edition = "2021"
description = "dd product-neutral test harness helper — engine/process test model, provisioning, result normalization and JIT diagnostics, consumed as a dev-dependency by product crates."

# The engine × case matrix product (case registry, C guest corpus, aggregate runner and its cargo-test
# entry) moved to its owner `dd-jit-darwin` (ownership-matrix Step 2). What remains here is the reusable
# harness library plus the `bench` micro-benchmark bin.

[lib]
name = "dd_tests"
path = "src/lib.rs"

[dependencies]
ddjit = { path = "../dd-jit", package = "dd-jit" }
