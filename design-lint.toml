[documentation]
allowed = ["AGENTS.md", "README.md", "tests/PIPELINE.md", "lint/examples/positive.md", "lint/examples/negative.md"]
examples = ["lint/examples/positive.md", "lint/examples/negative.md"]

[dependency]
ignored_packages = ["hl-design-lint"]
require_reviewed_edges = true

[[dependency.layers]]
name = "package"
directory = "packages"
may_depend_on = ["package"]

[[dependency.layers]]
name = "runtime"
directory = "runtime"
may_depend_on = ["package", "runtime"]

[[dependency.layers]]
name = "container"
directory = "containers"
may_depend_on = ["package", "runtime", "container"]

[[dependency.layers]]
name = "workspace"
directory = "workspaces"
may_depend_on = ["package", "runtime", "workspace"]

[[dependency.layers]]
name = "application"
directory = "apps"
may_depend_on = ["package", "runtime", "container", "workspace", "application"]

[[dependency.edges]]
sources = ["dockerd"]
targets = ["hl-client"]
kinds = ["development"]
[[dependency.edges]]
sources = ["dockerd"]
targets = ["hl-container", "hl-daemon", "hl-images", "hl-log"]
[[dependency.edges]]
sources = ["engine"]
targets = ["hl-engine", "hl-log"]
[[dependency.edges]]
sources = ["hl-checkpoint"]
targets = ["hl-log"]
[[dependency.edges]]
sources = ["hl-client"]
targets = ["hl-container", "hl-daemon", "hl-images"]
kinds = ["development"]
[[dependency.edges]]
sources = ["hl-client"]
targets = ["hl-daemon", "hl-log"]
[[dependency.edges]]
sources = ["hl-container"]
targets = ["hl-engine", "hl-fs", "hl-images", "hl-log"]
[[dependency.edges]]
sources = ["hl-daemon"]
targets = ["hl-client", "hl-container", "hl-images"]
kinds = ["development"]
[[dependency.edges]]
sources = ["hl-daemon"]
targets = ["hl-container", "hl-design", "hl-images", "hl-log"]
[[dependency.edges]]
sources = ["hl-descriptor"]
targets = ["hl-log"]
[[dependency.edges]]
