targets = ["hl-descriptor", "hl-event", "hl-fs", "hl-isa", "hl-linux", "hl-loader", "hl-log", "hl-native", "hl-network", "hl-provider", "hl-runtime"]
[[dependency.edges]]
sources = ["hl-event"]
targets = ["hl-descriptor", "hl-log", "hl-time"]
[[dependency.edges]]
sources = ["hl-images"]
targets = ["hl-fs", "hl-log"]
[[dependency.edges]]
sources = ["hl-ipc"]
targets = ["hl-descriptor", "hl-log", "hl-memory", "hl-sync", "hl-time"]
[[dependency.edges]]
sources = ["hl-linux"]
targets = ["hl-descriptor", "hl-event", "hl-isa", "hl-log", "hl-memory", "hl-network", "hl-sync", "hl-task", "hl-time", "hl-vfs"]
[[dependency.edges]]
sources = ["hl-loader"]
targets = ["hl-isa"]
[[dependency.edges]]
sources = ["hl-memory"]
targets = ["hl-isa", "hl-log"]
[[dependency.edges]]
sources = ["hl-network"]
targets = ["hl-descriptor", "hl-log", "hl-sync"]
[[dependency.edges]]
sources = ["hl-provider"]
targets = ["hl-descriptor"]
[[dependency.edges]]
sources = ["hl-runtime"]
targets = ["hl-memory"]
kinds = ["development"]
[[dependency.edges]]
sources = ["hl-runtime"]
targets = ["hl-checkpoint", "hl-descriptor", "hl-event", "hl-ipc", "hl-isa", "hl-linux", "hl-loader", "hl-log", "hl-memory", "hl-network", "hl-provider", "hl-sync", "hl-task", "hl-terminal", "hl-time", "hl-vfs"]
[[dependency.edges]]
