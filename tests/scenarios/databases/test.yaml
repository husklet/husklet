  timeout: 90
  resources:
  - host_port
  actions:
  - shell:
      script: 'redis-server --save '''' --appendonly no --daemonize yes >/dev/null 2>&1

        for i in $(seq 1 50); do redis-cli ping 2>/dev/null | grep -q PONG && break; sleep 0.2; done

        for i in $(seq 1 1000); do redis-cli rpush L $i >/dev/null; done

        redis-cli eval "local s=0 for _,v in ipairs(redis.call(''lrange'',''L'',0,-1)) do s=s+v end return s" 0'
