cases:
- id: databases/couchdb-create-db
  image: couchdb:3
  timeout: 240
  class: long
  resources:
  - host_port
  actions:
  - shell:
      script: "export COUCHDB_USER=admin COUCHDB_PASSWORD=pw\n/docker-entrypoint.sh /opt/couchdb/bin/couchdb >/tmp/couch.log 2>&1 &\nready=false\nfor i in $(seq 1 150); do\n  if curl --max-time 2 -fsS http://admin:pw@127.0.0.1:5984/ | grep -q Welcome; then\n    ready=true\n    break\n  fi\n  sleep 1\ndone\nif [ \"$ready\" != true ]; then\n  cat /tmp/couch.log >&2\n  exit 1\nfi\ncurl --max-time 5 -fsS -X PUT http://admin:pw@127.0.0.1:5984/hlb\n"
  expect:
    stdout_contains: golden/couchdb_create_db.txt
- id: databases/couchdb-welcome
  image: couchdb:3
  timeout: 240
  class: long
  resources:
  - host_port
  actions:
  - shell:
      script: "export COUCHDB_USER=admin COUCHDB_PASSWORD=pw\n/docker-entrypoint.sh /opt/couchdb/bin/couchdb >/tmp/couch.log 2>&1 &\nready=false\nfor i in $(seq 1 150); do\n  if curl --max-time 2 -fsS http://admin:pw@127.0.0.1:5984/ | grep -q Welcome; then\n    ready=true\n    break\n  fi\n  sleep 1\ndone\nif [ \"$ready\" != true ]; then\n  cat /tmp/couch.log >&2\n  exit 1\nfi\ncurl --max-time 5 -fsS http://admin:pw@127.0.0.1:5984/\n"
  expect:
    stdout_contains: golden/couchdb_welcome.txt
