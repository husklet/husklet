        test -S /tmp/mongodb-27017.sock || { cat /tmp/mongo.log >&2; exit 1; }
        rm -f /tmp/mongo-ping.* /tmp/mongo-ready
        for client in 1 2 3; do
          (mongosh 'mongodb://%2Ftmp%2Fmongodb-27017.sock' --quiet --eval 'print(db.runCommand({ping:1}).ok)' >"/tmp/mongo-ping.$client" 2>&1 && echo ready >> /tmp/mongo-ready) &
        done
        wait
        test "$(wc -l < /tmp/mongo-ready)" -eq 3
        grep -Fx 1 /tmp/mongo-ping.1
        grep -Fx 1 /tmp/mongo-ping.2
        grep -Fx 1 /tmp/mongo-ping.3
        echo MONGO_PARALLEL_READY
  expect:
    stdout_contains: golden/mongo_parallel_readiness_7.txt
