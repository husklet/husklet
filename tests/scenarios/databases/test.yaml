- id: databases/postgres-agg-15
  image: postgres:15
  timeout: 120
  class: long
  resources:
  - host_port
  actions:
  - shell:
      script: 'export POSTGRES_PASSWORD=pw POSTGRES_HOST_AUTH_METHOD=trust

        docker-entrypoint.sh postgres >/tmp/pg.log 2>&1 &

        for i in $(seq 1 90); do grep -q ''init process complete'' /tmp/pg.log 2>/dev/null && grep -q ''ready to accept connections'' /tmp/pg.log 2>/dev/null && break; sleep 1; done

        sleep 1

        psql -U postgres -tAc "CREATE TABLE t(n int); INSERT INTO t SELECT generate_series(1,1000); SELECT sum(n) FROM t;" || { status=$?; cat /tmp/pg.log >&2; exit $status; }'
  expect:
