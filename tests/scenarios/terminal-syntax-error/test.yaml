cases:
- id: terminal-syntax-error/diagnostic-status-recovery
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "stty -echo; PS1=$(printf '\\105\\122\\122\\117\\122\\055\\120\\122\\117\\115\\120\\124\\043\\040'); printf 'SYNTAX-%s\\n' READY\r" }
      - await_output: { contains: SYNTAX-READY, timeout_ms: 5000 }
      - await_output: { contains: "ERROR-PROMPT# ", timeout_ms: 5000 }
      - write: { text: "for; do\r" }
      - await_output: { contains: "syntax error near unexpected token", timeout_ms: 5000 }
      - await_output: { contains: "ERROR-PROMPT# ", timeout_ms: 5000 }
      - write: { text: "status=$?; printf 'SYNTAX-STATUS-%s\\n' \"$status\"\r" }
      - await_output: { contains: SYNTAX-STATUS-2, timeout_ms: 5000 }
      - write: { text: "printf 'SYNTAX-SHELL-%s\\n' RECOVERED; stty echo; exit\r" }
      - await_output: { contains: SYNTAX-SHELL-RECOVERED, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/diagnostic.txt
    - golden/status.txt
    - golden/recovered.txt
