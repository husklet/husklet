cases:
- id: terminal-top/fullscreen-exit
  image: alpine
  resources: [pty]
  timeout: 20
  actions:
  - terminal:
      argv: [/bin/sh]
      steps:
      - write: { text: "stty -echo; printf '\\122\\104\\131\\n'\r" }
      - await_output: { contains: RDY, timeout_ms: 5000 }
      - write: { text: "top -b -d 1 -n 1; printf '\\124\\117\\120\\055\\105\\130\\111\\124\\n'\r" }
      - await_output: { contains: "Mem:", timeout_ms: 5000 }
      - await_output: { contains: TOP-EXIT, timeout_ms: 5000 }
      - write: { text: "printf '\\123\\110\\105\\114\\114\\055\\117\\113\\n'; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains: [golden/memory.txt, golden/top_exit.txt, golden/shell_ok.txt]
