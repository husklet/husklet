cases:
- id: terminal-quoted-multiline/preserve-newline
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "stty -echo -onlcr; PS2=$(printf '\\121\\125\\117\\124\\105\\076\\040'); printf 'QUOTE-%s\\n' READY\r" }
      - await_output: { contains: QUOTE-READY, timeout_ms: 5000 }
      - write: { text: "printf '<%s>\\n' \"QUOTED-LINE-ONE\r" }
      - await_output: { contains: "QUOTE> ", timeout_ms: 5000 }
      - write: { text: "QUOTED-LINE-TWO\"\r" }
      - await_output: { contains: "<QUOTED-LINE-ONE", timeout_ms: 5000 }
      - await_output: { contains: "QUOTED-LINE-TWO>", timeout_ms: 5000 }
      - write: { text: "printf 'QUOTE-SHELL-%s\\n' RECOVERED; stty onlcr echo; exit\r" }
      - await_output: { contains: QUOTE-SHELL-RECOVERED, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/multiline.txt
    - golden/recovered.txt
