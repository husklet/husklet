cases:
- id: terminal-foreground-eof/cat-and-shell-recovery
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "stty -echo; cat; stty echo; echo CAT-${x}DONE\r" }
      - write: { text: "CAT-PAYLOAD\r" }
      - await_output: { contains: CAT-PAYLOAD, timeout_ms: 5000 }
      - write: { text: "\u0004" }
      - await_output: { contains: CAT-DONE, timeout_ms: 5000 }
      - write: { text: "printf \"SHELL-${x}OK\\n\"; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/payload.txt
    - golden/cat_done.txt
    - golden/shell_ok.txt
