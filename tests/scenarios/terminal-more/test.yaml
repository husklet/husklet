cases:
- id: terminal-more/page-and-quit
  image: alpine
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/bin/sh]
      steps:
      - write: { text: "stty -echo; printf '\\122\\104\\131\\n'\r" }
      - await_output: { contains: RDY, timeout_ms: 5000 }
      - write: { text: "seq 1 80 | more; printf '\\115\\117\\122\\105\\055\\105\\130\\111\\124\\n'\r" }
      - await_output: { contains: "--More--", timeout_ms: 5000 }
      - write: { text: " " }
      - await_output: { contains: "\r\n46\r\n", timeout_ms: 5000 }
      - await_output: { contains: "--More--", timeout_ms: 5000 }
      - write: { text: q }
      - await_output: { contains: MORE-EXIT, timeout_ms: 5000 }
      - write: { text: "printf '\\123\\110\\105\\114\\114\\055\\117\\113\\n'; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains: [golden/prompt.txt, golden/more_exit.txt, golden/shell_ok.txt]
