cases:
- id: terminal-external-editor/edit-and-execute
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "printf '%s\\n' '#!/bin/sh' 'printf \"echo EDITOR-\\${x}OK\\n\" > \"$1\"' > /tmp/husklet-editor; chmod +x /tmp/husklet-editor; export EDITOR=/tmp/husklet-editor; stty -echo; printf \"EDITOR-${x}READY\\n\"\r" }
      - await_output: { contains: EDITOR-READY, timeout_ms: 5000 }
      - write: { text: "false" }
      - write: { text: "\u0018\u0005" }
      - await_output: { contains: EDITOR-OK, timeout_ms: 5000 }
      - write: { text: "stty echo; printf \"SHELL-${x}OK\\n\"; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/editor_ok.txt
    - golden/shell_ok.txt
