cases:
- id: terminal-process-substitution/foreground-consumer
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "stty -echo; printf \"SUB-${x}READY\\n\"\r" }
      - await_output: { contains: SUB-READY, timeout_ms: 5000 }
      - write: { text: "cat <(printf \"SUB-${x}OK\\n\"); printf \"SUB-${x}DONE\\n\"\r" }
      - await_output: { contains: SUB-OK, timeout_ms: 5000 }
      - await_output: { contains: SUB-DONE, timeout_ms: 5000 }
      - write: { text: "stty echo; printf \"SHELL-${x}OK\\n\"; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/substitution.txt
    - golden/done.txt
    - golden/shell_ok.txt
