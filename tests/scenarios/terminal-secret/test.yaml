cases:
- id: terminal-secret/read-s-noecho
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      steps:
      - write: { text: "stty -echo; printf '\\122\\104\\131\\n'; stty echo\r" }
      - await_output: { contains: RDY, timeout_ms: 5000 }
      - write: { text: "read -rsp 'Password: ' pw; printf '\\n<L=%s>\\n' \"${#pw}\"; stty -a\r" }
      - await_output: { contains: "Password: ", timeout_ms: 5000 }
      - write: { text: "s3cr3t\r" }
      - await_output: { contains: "<L=6>", timeout_ms: 5000 }
      - await_output: { contains: " echo echoe ", timeout_ms: 5000 }
      - reject_output: { text: s3cr3t }
      - write: { text: "printf '\\123\\110\\105\\114\\114\\055\\117\\113\\n'; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains: [golden/password_length.txt, golden/echo_restored.txt, golden/shell_ok.txt]
