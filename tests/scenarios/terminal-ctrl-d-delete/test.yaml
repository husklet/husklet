cases:
- id: terminal-ctrl-d-delete/nonempty-line-delete
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "stty -echo; printf \"CTRL-D-${x}READY\\n\"\r" }
      - await_output: { contains: CTRL-D-READY, timeout_ms: 5000 }
      - write: { text: "echo CTRL-D-OKX" }
      - write: { text: "\u0002" }
      - write: { text: "\u0004" }
      - write: { text: "\r" }
      - await_output: { contains: CTRL-D-OK, timeout_ms: 5000 }
      - reject_output: { text: CTRL-D-OKX }
      - write: { text: "stty echo; printf \"SHELL-${x}OK\\n\"; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/deleted.txt
    - golden/shell_ok.txt
