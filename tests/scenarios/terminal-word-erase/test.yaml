cases:
- id: terminal-word-erase/readline-token-replace
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      steps:
      - write: { text: "printf '<%s>\\n' wrong" }
      - write: { text: "\u0017" }
      - write: { text: "right\r" }
      - await_output: { contains: "<right>", timeout_ms: 5000 }
      - reject_output: { text: "<wrongright>" }
      - write: { text: "printf '\\123\\110\\105\\114\\114\\055\\117\\113\\n'; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains: [golden/replaced.txt, golden/shell_ok.txt]
