cases:
- id: languages/dotnet-version-sdk8
  image: mcr.microsoft.com/dotnet/sdk:8.0
  class: long
  timeout: 120
  execution:
    native: true
    diagnostics: true
  run:
    program: /bin/sh
    arguments:
    - -c
    - printf "SDK %s\n" "$(dotnet --version | cut -d. -f1)"
  expect:
    stdout_contains: golden/dotnet/version.txt
- id: languages/dotnet-sum-sdk8
  image: mcr.microsoft.com/dotnet/sdk:8.0
  class: long
  timeout: 120
  execution:
    native: true
    diagnostics: true
  fixtures:
  - source: source/sum/Program.cs
    destination: /tests/sum/Program.cs
  - source: source/sum/sum.csproj
    destination: /tests/sum/sum.csproj
  run:
    program: /usr/bin/dotnet
    arguments:
    - run
    - --project
    - /tests/sum/sum.csproj
    - -c
    - Release
  expect:
    stdout_contains: golden/dotnet/sum.txt
