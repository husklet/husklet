cases:
  - id: permissions/mode-0644
    image: alpine:3.24.1
    timeout: 120
    actions: [{ shell: { script: "touch /f && chmod 0644 /f && ls -l /f | cut -c1-10" } }]
    expect: { stdout_contains: golden/mode-0644.txt }
