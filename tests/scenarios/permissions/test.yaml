    image: alpine:3.24.1
    timeout: 120
    actions: [{ shell: { script: "ln -s /etc/hostname /l && ls -l /l" } }]
    expect: { stdout_contains: [golden/type-symlink-mode.txt, golden/type-symlink-target.txt] }
