    actions: [{ shell: { script: "chmod 600 /etc/hostname && stat -c '%a' /etc/hostname" } }]
    expect: { stdout_contains: golden/copyup-chmod-lower.txt }
  - id: permissions/copyup-binary-perms
    image: alpine:3.24.1
    timeout: 120
    actions: [{ shell: { script: "cp /bin/busybox /b2 && ls -l /b2 | cut -c1-10" } }]
    expect: { stdout_contains: golden/mode-0755.txt }
