  - id: permissions/root-reads-0000
    image: alpine:3.24.1
    timeout: 120
    actions: [{ shell: { script: "touch /f && chmod 000 /f && cat /f >/dev/null 2>&1 && echo ROOT_READ_OK" } }]
    expect: { stdout_contains: golden/root-reads-0000.txt }
  - id: permissions/nonexec-test-x
    image: alpine:3.24.1
    timeout: 120
    actions: [{ shell: { script: "touch /f && chmod 644 /f && { test -x /f && echo X || echo NOX; }" } }]
    expect: { stdout_contains: golden/nonexec-test-x.txt }
  - id: permissions/copyup-chmod-lower
    image: alpine:3.24.1
