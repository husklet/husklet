cases:
- id: terminal-compound-command/multiline-for-loop
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "stty -echo; PS2=$(printf '\\114\\117\\117\\120\\076\\040'); printf 'LOOP-%s\\n' READY\r" }
      - await_output: { contains: LOOP-READY, timeout_ms: 5000 }
      - write: { text: "for item in ONE TWO; do\r" }
      - await_output: { contains: "LOOP> ", timeout_ms: 5000 }
      - write: { text: "printf 'LOOP-%s\\n' \"$item\"\r" }
      - await_output: { contains: "LOOP> ", timeout_ms: 5000 }
      - write: { text: "done\r" }
      - await_output: { contains: LOOP-ONE, timeout_ms: 5000 }
      - await_output: { contains: LOOP-TWO, timeout_ms: 5000 }
      - write: { text: "printf 'LOOP-SHELL-%s\\n' RECOVERED; stty echo; exit\r" }
      - await_output: { contains: LOOP-SHELL-RECOVERED, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/one.txt
    - golden/two.txt
    - golden/recovered.txt
