cases:
- id: terminal-reverse-search/recall-by-query
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      steps:
      - write: { text: "n=0\r" }
      - write: { text: "n=$((n+1)); printf '<HIT-%s>\\n' \"$n\"\r" }
      - await_output: { contains: "<HIT-1>", timeout_ms: 5000 }
      - write: { text: "\u0012" }
      - write: { text: "n=$((n+1))" }
      - write: { text: "\r" }
      - await_output: { contains: "<HIT-2>", timeout_ms: 5000 }
      - write: { text: "printf '\\123\\110\\105\\114\\114\\055\\117\\113\\n'; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains: [golden/recalled.txt, golden/shell_ok.txt]
