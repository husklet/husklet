- id: distros/debian-apt-update
  image: debian:bookworm-slim
  timeout: 120
  class: long
  resources:
  - disk_heavy
  - network
  - registry
  actions:
  - shell:
      script: |-
        apt-get -o Acquire::Retries=3 update
        find /var/lib/apt/lists -maxdepth 1 -type f -name '*Release' -print -quit | grep -q .
        echo APT_UPDATE_OK
  expect:
    stdout_contains: golden/apt_update.txt
- id: distros/debian-awk-squares
  image: debian:bookworm
  timeout: 120
  resources:
  - registry
  actions:
  - shell:
      script: awk 'BEGIN{for(i=1;i<=100;i++)s+=i*i; print s}'
  expect:
    stdout_contains: golden/338350.txt
