cases:
- id: distros/alma-8-version
  image: almalinux:8
  timeout: 120
  resources:
  - registry
  actions:
  - shell:
      script: . /etc/os-release; echo "VER=$VERSION_ID"
  expect:
    stdout_contains: golden/ver_8.txt
- id: distros/alma-9-osrelease
  image: almalinux:9
  timeout: 120
  resources:
  - registry
  actions:
  - shell:
      script: . /etc/os-release; echo "OS=$ID-$VERSION_ID"
  expect:
    stdout_contains: golden/os_almalinux.txt
- id: distros/alma-rpm-rhel
  image: almalinux:9
  timeout: 120
  resources:
  - registry
  actions:
  - shell:
      script: rpm -E %rhel
  expect:
    stdout_contains: golden/9.txt
