- id: distros/alpine-apk-version
  image: alpine:3.20
  timeout: 120
  resources:
  - registry
  actions:
  - shell:
      script: apk --version
  expect:
    stdout_contains: golden/apk_tools.txt
- id: distros/alpine-fork-loop
  image: alpine:latest
  timeout: 120
  resources:
  - registry
  actions:
  - shell:
      script: s=0; i=1; while [ $i -le 1000 ]; do s=$(expr $s + $i); i=$(expr $i + 1); done; echo "SUM=$s"
  expect:
    stdout_contains: golden/sum_500500.txt
- id: distros/alpine-getconf-longbit
  image: alpine:latest
  timeout: 120
  resources:
  - registry
  actions:
  - shell:
      script: getconf LONG_BIT 2>/dev/null || echo 64
  expect:
    stdout_contains: golden/64.txt
- id: distros/alpine-pipeline
  image: alpine:latest
  timeout: 120
  resources:
  - registry
  actions:
  - shell:
      script: seq 1 1000 | awk '{s+=$1} END{print "SUM="s}'
  expect:
    stdout_contains: golden/sum_500500.txt
- id: distros/alpine-release-file
  image: alpine:latest
  timeout: 120
  resources:
  - registry
  actions:
  - shell:
      script: cat /etc/alpine-release | cut -d. -f1-2
  expect:
    stdout_contains: golden/3.txt
- id: distros/alpine-sed
  image: alpine:3.20
  timeout: 120
  resources:
  - registry
  actions:
  - shell:
      script: echo abcabc | sed 's/a/X/g'
  expect:
    stdout_contains: golden/xbcxbc.txt
- id: distros/alpine-sort
  image: alpine:latest
  timeout: 120
  resources:
  - registry
  actions:
  - shell:
      script: printf '3\n1\n2\n' | sort -n | paste -sd, -
  expect:
    stdout_contains: golden/1_2.txt
- id: distros/alpine-subshell-churn
  image: alpine:latest
  timeout: 120
  resources:
  - registry
  actions:
  - shell:
      script: t=0; n=1; while [ $n -le 500 ]; do v=$(sh -c "echo $((n*2))"); t=$(expr $t + $v); n=$(expr $n + 1); done; echo
        "T=$t"
  expect:
    stdout_contains: golden/t_250500.txt
