cases:
- id: terminal-background-notify/completion-and-recovery
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "stty -echo; printf \"JOB-${x}READY\\n\"\r" }
      - await_output: { contains: JOB-READY, timeout_ms: 5000 }
      - write: { text: "sleep 0.2 & sleep 0.5; printf \"FOREGROUND-${x}DONE\\n\"\r" }
      - await_output: { contains: Done, timeout_ms: 5000 }
      - await_output: { contains: FOREGROUND-DONE, timeout_ms: 5000 }
      - write: { text: "jobs -p; stty echo; printf \"SHELL-${x}OK\\n\"; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/job_done.txt
    - golden/foreground_done.txt
    - golden/shell_ok.txt
