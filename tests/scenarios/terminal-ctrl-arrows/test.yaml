cases:
- id: terminal-ctrl-arrows/readline-word-navigation
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "echo LEFT-${x}ALPHA OMEGA" }
      - write: { text: "\u001b[1;5D" }
      - write: { text: "BETA " }
      - write: { text: "\u001b[1;5C" }
      - write: { text: "; echo RIGHT-${x}END\r" }
      - await_output: { contains: LEFT-ALPHA, timeout_ms: 5000 }
      - await_output: { contains: RIGHT-END, timeout_ms: 5000 }
      - write: { text: "printf \"SHELL-${x}OK\\n\"; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/left.txt
    - golden/right.txt
    - golden/shell_ok.txt
