cases:
- id: terminal-word-transpose/swap-previous-words
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "stty -echo; printf \"WORD-${x}READY\\n\"\r" }
      - await_output: { contains: WORD-READY, timeout_ms: 5000 }
      - write: { text: "echo META-WORD BETA ALPHA" }
      - write: { text: "\u001bt" }
      - write: { text: "\r" }
      - await_output: { contains: "META-WORD ALPHA BETA", timeout_ms: 5000 }
      - reject_output: { text: "META-WORD BETA ALPHA" }
      - write: { text: "stty echo; printf \"SHELL-${x}OK\\n\"; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/transposed.txt
    - golden/shell_ok.txt
