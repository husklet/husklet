  expect:
    stdout_contains: golden/served.txt
- id: web/nginx-stable-version
  image: nginx:stable-alpine
  timeout: 45
  resources: [host_port]
  actions:
  - shell:
      script: nginx -v 2>&1
  expect:
    stdout_contains: golden/nginx_1.txt
- id: web/nginx-glibc-version
  image: nginx:1.26
  timeout: 45
  resources: [host_port]
  actions:
  - shell:
      script: nginx -v 2>&1
  expect:
    stdout_contains: golden/nginx_126.txt
- id: web/nginx-glibc-config
  image: nginx:1.26
