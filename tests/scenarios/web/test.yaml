cases:
- id: web/nginx-serve
  image: nginx:alpine
  timeout: 60
  resources: [host_port]
  actions:
  - shell:
      script: nginx; sleep 1; wget -qO- http://127.0.0.1/ | head -1
  expect:
    stdout_contains: golden/doctype.txt
- id: web/nginx-welcome
  image: nginx:alpine
  timeout: 60
  resources: [host_port]
  actions:
  - shell:
      script: nginx; sleep 1; wget -qO- http://127.0.0.1/
  expect:
    stdout_contains: golden/welcome.txt
- id: web/nginx-custom-file
  image: nginx:alpine
  timeout: 60
  resources: [host_port]
  actions:
  - shell:
      script: echo hl-served-ok > /usr/share/nginx/html/hl.txt; nginx; sleep 1; wget -qO- http://127.0.0.1/hl.txt
  expect:
    stdout_contains: golden/served.txt
- id: web/nginx-index-replace
  image: nginx:alpine
  timeout: 60
  resources: [host_port]
  actions:
  - shell:
      script: echo hl-index-ok > /usr/share/nginx/html/index.html; nginx; sleep 1; wget -qO- http://127.0.0.1/
  expect:
    stdout_contains: golden/index.txt
- id: web/nginx-404
  image: nginx:alpine
  timeout: 60
  resources: [host_port]
  actions:
  - shell:
      script: nginx; sleep 1; wget -qO- http://127.0.0.1/nope-does-not-exist 2>&1; wget -S -qO /dev/null http://127.0.0.1/nope 2>&1 | grep -i 'HTTP/'
  expect:
    stdout_contains: golden/status_404.txt
- id: web/nginx-headers
  image: nginx:alpine
  timeout: 60
  resources: [host_port]
  actions:
  - shell:
      script: nginx; sleep 1; wget -S -qO /dev/null http://127.0.0.1/ 2>&1 | grep -i 'Server:'
  expect:
    stdout_contains: golden/nginx.txt
- id: web/nginx-config-test
  image: nginx:alpine
  timeout: 45
  resources: [host_port]
  actions:
  - shell:
      script: nginx -t 2>&1
  expect:
    stdout_contains: [golden/syntax_ok.txt, golden/test_ok.txt]
- id: web/nginx-version
  image: nginx:alpine
  timeout: 45
  resources: [host_port]
  actions:
  - shell:
      script: nginx -v 2>&1
  expect:
    stdout_contains: golden/nginx_1.txt
- id: web/nginx-version-127
  image: nginx:1.27-alpine
  timeout: 45
  resources: [host_port]
  actions:
  - shell:
      script: nginx -v 2>&1
  expect:
    stdout_contains: golden/nginx_127.txt
