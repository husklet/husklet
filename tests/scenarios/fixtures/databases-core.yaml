- id: databases/mongo-agg-7
  image: mongo:7
  timeout: 240
  class: long
  resources:
  - host_port
  service:
    startup: mongod --bind_ip 127.0.0.1 --fork --logpath /tmp/mongo.log
    probe: mongosh 'mongodb://%2Ftmp%2Fmongodb-27017.sock' --quiet --eval 'db.runCommand({ping:1}).ok'
    attempts: 3
    delay_ms: 1000
    logs:
    - /tmp/mongo.log
  run:
    shell: mongosh 'mongodb://%2Ftmp%2Fmongodb-27017.sock' --quiet --eval 'for(let i=1;i<=1000;i++) db.t.insertOne({n:i}); print(db.t.aggregate([{$group:{_id:null,s:{$sum:"$n"}}}]).toArray()[0].s)'
  expect:
    stdout_contains:
    - '500500'
