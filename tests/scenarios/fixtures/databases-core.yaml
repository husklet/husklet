- id: databases/mariadb-agg-1011
  image: mariadb:10.11
  timeout: 120
  class: long
  resources:
  - host_port
  run:
    shell: 'export MARIADB_ROOT_PASSWORD=pw

      docker-entrypoint.sh mariadbd >/tmp/maria.log 2>&1 &

      for i in $(seq 1 150); do grep -q ''port: 3306'' /tmp/maria.log 2>/dev/null && break; sleep 1; done

      for i in $(seq 1 30); do mariadb -uroot -ppw -N -e ''SELECT 1'' >/dev/null 2>&1 && break; sleep 1; done

      mariadb -uroot -ppw -N -e "CREATE DATABASE d; USE d; CREATE TABLE t(n INT); INSERT INTO t (n) WITH RECURSIVE s(x) AS (SELECT 1 UNION ALL SELECT x+1 FROM s WHERE x<1000) SELECT x FROM s; SELECT SUM(n) FROM t;"'
  expect:
    stdout_contains:
    - '500500'
