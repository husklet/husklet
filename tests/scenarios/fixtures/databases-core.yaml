cases:
- id: databases/couchdb-create-db
  image: couchdb:3
  timeout: 240
  class: long
  resources:
  - host_port
  run:
    shell: |
      export COUCHDB_USER=admin COUCHDB_PASSWORD=pw
      /docker-entrypoint.sh /opt/couchdb/bin/couchdb >/tmp/couch.log 2>&1 &
      ready=false
      for i in $(seq 1 150); do
        if curl --max-time 2 -fsS http://admin:pw@127.0.0.1:5984/ | grep -q Welcome; then
          ready=true
          break
        fi
        sleep 1
      done
      if [ "$ready" != true ]; then
        cat /tmp/couch.log >&2
        exit 1
      fi
      curl --max-time 5 -fsS -X PUT http://admin:pw@127.0.0.1:5984/hlb
  expect:
    stdout_contains:
    - '"ok":true'
- id: databases/couchdb-welcome
