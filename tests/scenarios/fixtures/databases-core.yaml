- id: databases/mysql-agg-80
  image: mysql:8.0
  timeout: 120
  class: long
  resources:
  - host_port
  run:
    shell: 'export MYSQL_ROOT_PASSWORD=pw

      /usr/bin/env bash -c true

      probe=$?

      if [ $probe -ne 0 ]; then echo mysql-bash-probe=$probe; exit $probe; fi

      docker-entrypoint.sh mysqld >/tmp/my.log 2>&1 & server=$!

      for i in $(seq 1 150); do if ! kill -0 $server 2>/dev/null; then wait $server; status=$?; echo mysql-entrypoint-exited=$status; cat /tmp/my.log; exit $status; fi; grep -q ''port: 3306'' /tmp/my.log 2>/dev/null && break; sleep 1; done

      for i in $(seq 1 30); do mysql -uroot -ppw -N -e ''SELECT 1'' >/dev/null 2>&1 && break; sleep 1; done

      mysql -uroot -ppw -N -e "CREATE DATABASE d; USE d; CREATE TABLE t(n INT); INSERT INTO t (n) WITH RECURSIVE s(x) AS (SELECT 1 UNION ALL SELECT x+1 FROM s WHERE x<1000) SELECT x FROM s; SELECT SUM(n) FROM t;" || { status=$?; cat /tmp/my.log; ps -o pid,ppid,stat,comm,args; exit $status; }'
  expect:
    stdout_contains:
    - '500500'
