- id: databases/mongo-parallel-readiness-7
  image: mongo:7
  timeout: 240
  class: long
  resources:
  - host_port
  service:
    startup: mongod --bind_ip 127.0.0.1 --fork --logpath /tmp/mongo.log
    probe: test -S /tmp/mongodb-27017.sock
    attempts: 1
    delay_ms: 0
    logs:
    - /tmp/mongo.log
  run:
    shell: |-
      rm -f /tmp/mongo-ping.* /tmp/mongo-ready
      for client in 1 2 3; do
        (
          mongosh 'mongodb://%2Ftmp%2Fmongodb-27017.sock' --quiet \
            --eval 'print(db.runCommand({ping:1}).ok)' \
            >"/tmp/mongo-ping.$client" 2>&1 &&
          echo ready >> /tmp/mongo-ready
        ) &
      done
      wait
      test "$(wc -l < /tmp/mongo-ready)" -eq 3
      grep -Fx 1 /tmp/mongo-ping.1
      grep -Fx 1 /tmp/mongo-ping.2
      grep -Fx 1 /tmp/mongo-ping.3
      echo MONGO_PARALLEL_READY
  expect:
    stdout_contains:
    - MONGO_PARALLEL_READY
