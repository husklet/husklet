cases:
  - id: languages/perl-sum-538
    image: perl:5.38
    run:
      argv: ["perl", "-e", "$s+=$_ for 1..1000;print $s"]
    expect:
      stdout_contains: ["500500"]

  - id: languages/perl-sort-538-slim
    image: perl:5.38-slim
    run:
      argv: ["perl", "-e", "print join(',',sort{$a<=>$b}(3,1,2))"]
    expect:
      stdout_contains: ["1,2,3"]

  - id: languages/perl-primes-538
    image: perl:5.38
    run:
      argv: ["perl", "-e", "$c=0;for $n (2..9999){$p=1;for $d (2..int(sqrt($n))){if($n%$d==0){$p=0;last}}$c+=$p}print $c"]
    expect:
      stdout_contains: ["1229"]

  - id: languages/perl-mult-repl-540
    image: perl:5.40
    run:
      shell: echo 'print 6*7' | perl
    expect:
      stdout_contains: ["42"]
