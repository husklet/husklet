cases:
- id: terminal-permission-denied/status-and-recovery
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "printf '#!/bin/sh\\ntouch /tmp/husklet-noexec-ran\\n' > /tmp/husklet-noexec; chmod 0644 /tmp/husklet-noexec; stty -echo; PS1='PERMISSION# '; printf 'PERMISSION-READY\\n'\r" }
      - await_output: { contains: PERMISSION-READY, timeout_ms: 5000 }
      - write: { text: "/tmp/husklet-noexec\r" }
      - await_output: { contains: "Permission denied", timeout_ms: 5000 }
      - write: { text: "status=$?; test \"$status\" = 126 && test ! -e /tmp/husklet-noexec-ran && printf 'PERMISSION-STATUS-126\\n'\r" }
      - await_output: { contains: PERMISSION-STATUS-126, timeout_ms: 5000 }
      - write: { text: "printf 'PERMISSION-SHELL-USABLE\\n'; stty echo; exit\r" }
      - await_output: { contains: PERMISSION-SHELL-USABLE, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/status_126.txt
    - golden/shell_usable.txt
