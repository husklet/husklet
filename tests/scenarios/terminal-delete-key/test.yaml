cases:
- id: terminal-delete-key/readline-forward-delete
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "printf '<%s>\\n' ALPHA-XBETA" }
      - write: { text: "\u001b[D\u001b[D\u001b[D\u001b[D\u001b[D" }
      - write: { text: "\u001b[3~" }
      - write: { text: "\r" }
      - await_output: { contains: "<ALPHA-BETA>", timeout_ms: 5000 }
      - write: { text: "printf 'SHELL-OK\\n'; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/deleted.txt
    - golden/shell_ok.txt
