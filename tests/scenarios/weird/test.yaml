      script: set -eu; apt-get update >/dev/null; apt-get install -y xz-utils >/dev/null; seq 1 1000 > /tmp/input; xz -9 -c /tmp/input > /tmp/input.xz; xz -d -c /tmp/input.xz > /tmp/output; cmp /tmp/input /tmp/output; awk '{s+=$1}END{print "XZ="s}'
        /tmp/output
  expect:
