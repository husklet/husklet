cases:
- id: weird/auxval-hwcap
  image: gcc:latest
  class: long
  fixtures:
  - source: source/auxval.c
    destination: /m.c
  actions:
  - shell:
      script: cc /m.c -O2 -o /m && /m
  expect:
    stdout_contains: golden/auxval_hwcap.txt
  resources:
  - process_heavy
- id: weird/awk-compute
  image: alpine:latest
  actions:
  - shell:
      script: awk 'BEGIN{for(i=1;i<=1000;i++)s+=i;print "AWK="s}'
  expect:
    stdout_contains: golden/awk_compute.txt
- id: weird/beam-jit
  image: erlang:27
  class: long
  resources:
  - process_heavy
  actions:
  - shell:
      script: erl -noshell -eval 'io:format("ERL=~w~n",[lists:sum(lists:seq(1,1000))]), halt().'
  expect:
    stdout_contains: golden/beam_jit.txt
