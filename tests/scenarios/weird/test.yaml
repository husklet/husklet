- id: weird/node-primes
  image: node:alpine
  resources:
  - process_heavy
  actions:
  - shell:
      script: node -e 'let p=0;for(let n=2;n<100000;n++){let q=1;for(let d=2;d*d<=n;d++)if(n%d===0){q=0;break}p+=q}console.log("PRIMES="+p)'
  expect:
    stdout_contains: golden/node_primes.txt
- id: weird/nproc
  image: alpine:latest
  actions:
  - shell:
      script: '[ "$(nproc)" -ge 1 ] && echo NPROC-OK || echo NPROC-BAD'
  expect:
    stdout_contains: golden/nproc.txt
- id: weird/openssl-sha256
  image: alpine/openssl:latest
  class: long
  actions:
  - shell:
      script: set -eu; printf abc > /tmp/input; openssl dgst -sha256 /tmp/input | awk '{print $NF}'
  expect:
    stdout_contains: golden/openssl_sha256.txt
