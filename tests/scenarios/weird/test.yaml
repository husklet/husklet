      script: set -eu; apt-get update >/dev/null; apt-get install -y zstd >/dev/null; seq 1 1000 > /tmp/input; zstd -q -19 -o /tmp/input.zst /tmp/input; zstd -q -d -o /tmp/output /tmp/input.zst; cmp /tmp/input /tmp/output; awk '{s+=$1}END{print
