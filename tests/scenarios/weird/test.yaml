  image: alpine/openssl:latest
  class: long
  resources:
  - process_heavy
  actions:
  - shell:
      script: 'set -eu; output=$(openssl speed -seconds 1 -evp aes-128-cbc 2>&1); printf ''%s

        '' "$output" | grep -q Doing; echo SPEED-OK'
  expect:
    stdout_contains: golden/openssl_speed.txt
