- id: weird/dotnet-ryujit
  image: mcr.microsoft.com/dotnet/sdk:8.0
  class: long
  xfail:
  - amd64
  resources:
  - process_heavy
  timeout: 300
  fixtures:
  - source: source/ryujit.cs
    destination: /tmp/weird_program.cs
  actions:
  - shell:
      script: 'mkdir -p /app && cd /app && dotnet new console -o . >/dev/null 2>&1 && cp /tmp/weird_program.cs Program.cs

        dotnet run -c Release 2>/dev/null'
  expect:
    stdout_contains: golden/dotnet_ryujit.txt
