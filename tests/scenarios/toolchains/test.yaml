cases:
- id: toolchains/alpine-cc-fib
  image: gcc:14
  timeout: 180
  resources: [process_heavy]
  fixtures: [{ source: source/c_fib.c, destination: /m.c }]
  actions: [{ shell: { script: "cc -O2 /m.c -o /m && /m" } }]
  expect: { stdout_contains: golden/r_fib.txt }
- id: toolchains/alpine-cc-sum
  image: gcc:14
  timeout: 180
  resources: [process_heavy]
  fixtures: [{ source: source/c_sum.c, destination: /m.c }]
  actions: [{ shell: { script: "cc -O2 /m.c -o /m && /m" } }]
  expect: { stdout_contains: golden/r_sum.txt }
- id: toolchains/alpine-gxx-stl
  image: gcc:14
  timeout: 180
  resources: [process_heavy]
  fixtures: [{ source: source/cpp_sum.cpp, destination: /m.cpp }]
  actions: [{ shell: { script: "g++ -O2 /m.cpp -o /m && /m" } }]
  expect: { stdout_contains: golden/r_sum.txt }
- id: toolchains/alpine-no-cc
  image: alpine:latest
  timeout: 120
  actions: [{ shell: { script: "command -v gcc || echo NO-CC" } }]
  expect: { stdout_contains: golden/no_cc.txt }
