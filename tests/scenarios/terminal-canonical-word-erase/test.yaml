cases:
- id: terminal-canonical-word-erase/foreground-vwerase
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "stty -echo; echo WORD-${x}READY; cat; stty echo; echo WORD-${x}DONE\r" }
      - await_output: { contains: WORD-READY, timeout_ms: 5000 }
      - write: { text: "CANON-WORD-KEEP DISCARDWORD" }
      - write: { text: "\u0017" }
      - write: { text: "\r" }
      - await_output: { contains: CANON-WORD-KEEP, timeout_ms: 5000 }
      - reject_output: { text: "DISCARDWORD" }
      - write: { text: "\u0004" }
      - await_output: { contains: WORD-DONE, timeout_ms: 5000 }
      - write: { text: "printf \"SHELL-${x}OK\\n\"; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/kept.txt
    - golden/word_done.txt
    - golden/shell_ok.txt
