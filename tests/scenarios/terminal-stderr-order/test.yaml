cases:
- id: terminal-stderr-order/merged-pty-order
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "stty -echo; printf 'STREAM-OUT-%s\\n' ONE; printf 'STREAM-ERR-%s\\n' TWO >&2; printf 'STREAM-OUT-%s\\n' THREE\r" }
      - await_output: { contains: STREAM-OUT-ONE, timeout_ms: 5000 }
      - await_output: { contains: STREAM-ERR-TWO, timeout_ms: 5000 }
      - await_output: { contains: STREAM-OUT-THREE, timeout_ms: 5000 }
      - write: { text: "printf 'STREAM-SHELL-%s\\n' RECOVERED; stty echo; exit\r" }
      - await_output: { contains: STREAM-SHELL-RECOVERED, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/out_one.txt
    - golden/err_two.txt
    - golden/out_three.txt
    - golden/recovered.txt
