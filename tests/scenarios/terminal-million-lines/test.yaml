cases:
- id: terminal-million-lines/tail-and-responsive-shell
  image: bash:5.2
  resources: [pty]
  timeout: 120
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "stty -echo -onlcr; awk 'BEGIN { for (i=0; i<1000000; i++) print \"\"; printf \"<MILLION-COUNT-%d>\\n\", i }'\r" }
      - await_output: { contains: "<MILLION-COUNT-1000000>", timeout_ms: 60000 }
      - write: { text: "printf '<AFTER-FLOOD>\\n'; exit\r" }
      - await_output: { contains: "<AFTER-FLOOD>", timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/done.txt
    - golden/responsive.txt
