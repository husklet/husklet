cases:
- id: terminal-secondary-cancel/ctrl-c-aborts-parser
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "stty -echo; PS1=\"CANCEL-${x}PROMPT# \"; PS2='CANCEL> '; printf 'CANCEL-%s\\n' READY\r" }
      - await_output: { contains: CANCEL-READY, timeout_ms: 5000 }
      - await_output: { contains: "CANCEL-PROMPT# ", timeout_ms: 5000 }
      - write: { text: "for item in ONE; do\r" }
      - await_output: { contains: "CANCEL> ", timeout_ms: 5000 }
      - write: { text: "touch /tmp/husklet-cancel-ran\r" }
      - await_output: { contains: "CANCEL> ", timeout_ms: 5000 }
      - write: { text: "\u0003" }
      - await_output: { contains: "CANCEL-PROMPT# ", timeout_ms: 5000 }
      - write: { text: "status=$?; if test -e /tmp/husklet-cancel-ran; then ran=yes; else ran=no; fi; printf 'CANCEL-STATUS-%s-RAN-%s\\n' \"$status\" \"$ran\"\r" }
      - await_output: { contains: CANCEL-STATUS-130-RAN-no, timeout_ms: 5000 }
      - write: { text: "printf 'CANCEL-SHELL-%s\\n' RECOVERED; stty echo; exit\r" }
      - await_output: { contains: CANCEL-SHELL-RECOVERED, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/status.txt
    - golden/recovered.txt
