cases:
- id: terminal-clear-screen/redraw-preserves-line
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      steps:
      - write: { text: "printf '<CLEAR-KEPT>\\n'" }
      - write: { text: "\u000c" }
      - await_output: { contains: "\u001b[H\u001b[2J", timeout_ms: 5000 }
      - write: { text: "\r" }
      - await_output: { contains: "<CLEAR-KEPT>", timeout_ms: 5000 }
      - write: { text: "printf '\\123\\110\\105\\114\\114\\055\\117\\113\\n'; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains: [golden/command_preserved.txt, golden/shell_ok.txt]
