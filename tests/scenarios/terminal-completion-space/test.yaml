cases:
- id: terminal-completion-space/readline-escaped-path
  image: bash:5.2
  resources: [pty]
  timeout: 15
  actions:
  - terminal:
      argv: [/usr/local/bin/bash, --noprofile, --norc]
      rows: 24
      columns: 80
      steps:
      - await_output: { contains: "bash-5.2#", timeout_ms: 5000 }
      - write: { text: "stty -echo; touch '/tmp/husklet completion target'; printf '\\106\\111\\114\\105\\055\\122\\105\\101\\104\\131\\n'\r" }
      - await_output: { contains: FILE-READY, timeout_ms: 5000 }
      - write: { text: "printf '<%s>\\n' /tmp/husklet\\ com" }
      - write: { text: "\u0009" }
      - write: { text: "\r" }
      - await_output: { contains: "</tmp/husklet completion target>", timeout_ms: 5000 }
      - write: { text: "printf '\\123\\110\\105\\114\\114\\055\\117\\113\\n'; exit\r" }
      - await_output: { contains: SHELL-OK, timeout_ms: 5000 }
      - close: {}
  expect:
    stdout_contains:
    - golden/completed.txt
    - golden/shell_ok.txt
