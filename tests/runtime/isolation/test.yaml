targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
oracle:
  provider: qemu
  commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 }
build:
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: [-static-pie, -O2, -std=gnu11, -pthread]
cases:
  - { id: runtime/isolation/cgroup-cpu-cap2, status: active, compat: { class: compatibility }, build: { source: cgroup_view.c, output: cgroup_cpu, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/cgroup_cpu }, environment: { HL_CPUS: "2" }, run: [], expect: { exit: 0, stdout: golden/cgroup_cpu.out } }
  - { id: runtime/isolation/cgroup-mem-cap512m, status: active, compat: { class: compatibility }, build: { source: cgroup_view.c, output: cgroup_mem, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/cgroup_mem }, environment: { HL_MEM_MAX: "536870912" }, run: [], expect: { exit: 0, stdout: golden/cgroup_mem.out } }
  - { id: runtime/isolation/cgroup-pids-cap64, status: active, compat: { class: compatibility }, build: { source: cgroup_view.c, output: cgroup_pids, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/cgroup_pids }, environment: { HL_PIDS_MAX: "64" }, run: [], expect: { exit: 0, stdout: golden/cgroup_pids.out } }
  - { id: runtime/isolation/cgroup-self, status: active, compat: { class: compatibility }, build: { source: cgroup_self.c, output: cgroup_self, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/cgroup_self }, run: [], expect: { exit: 0, stdout: golden/cgroup_self.out } }
  - { id: runtime/isolation/cgroup-v2-default, status: active, compat: { class: compatibility }, build: { source: cgroup_view.c, output: cgroup_v2, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/cgroup_v2 }, run: [], expect: { exit: 0, stdout: golden/cgroup_v2.out } }
  - { id: runtime/isolation/cpu-default, status: active, compat: { class: compatibility }, build: { source: cpu_default.c, output: cpu_default, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/cpu_default }, run: [], expect: { exit: 0, stdout: golden/cpu_default.out } }
  - { id: runtime/isolation/cpu-default-cap2, status: active, compat: { class: compatibility }, build: { source: cpu_probe.c, output: cpu_cap2, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/cpu_cap2 }, environment: { HL_CPUS: "2" }, run: [], expect: { exit: 0, stdout: golden/cpu_cap2.out } }
  - { id: runtime/isolation/cpu-sysfs-dirs, status: active, compat: { class: compatibility }, build: { source: cpu_dirs.c, output: cpu_dirs, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/cpu_dirs }, run: [], expect: { exit: 0, stdout: golden/cpu_dirs.out } }
  - { id: runtime/isolation/cpu-sysfs-dirs-cap2, status: active, compat: { class: compatibility }, build: { source: sysfs_cpu.c, output: dirs_cap2, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/dirs_cap2 }, environment: { HL_CPUS: "2" }, run: [], expect: { exit: 0, stdout: golden/dirs_cap2.out } }
  - { id: runtime/isolation/cpu-topology, status: active, compat: { class: compatibility }, build: { source: cpu_topology.c, output: cpu_topology, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/cpu_topology }, run: [], expect: { exit: 0, stdout: golden/cpu_topology.out } }
  - { id: runtime/isolation/cpucap-1, status: active, compat: { class: compatibility }, build: { source: cpu_count.c, output: cpu_cap1, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/cpu_cap1 }, environment: { HL_CPUS: "1" }, run: [], expect: { exit: 0, stdout: golden/cpu_cap1.out } }
  - { id: runtime/isolation/cpucap-2, status: active, compat: { class: compatibility }, build: { source: cpu_count.c, output: cpu_count2, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/cpu_count2 }, environment: { HL_CPUS: "2" }, run: [], expect: { exit: 0, stdout: golden/cpu_count2.out } }
  - { id: runtime/isolation/cred-identity, status: active, compat: { class: compatibility }, build: { source: credentials.c, output: credentials, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/credentials }, run: [], expect: { exit: 0, stdout: golden/credentials.out } }
