  - { id: runtime/isolation/mount-view, status: active, compat: { class: compatibility }, build: { source: mounts.c, output: mounts, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/mounts }, run: [], expect: { exit: 0, stdout: golden/mounts.out } }
  - { id: runtime/isolation/pid-identity, status: active, compat: { class: compatibility }, build: { source: pid_identity.c, output: pid_identity, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/pid_identity }, run: [], expect: { exit: 0, stdout: golden/pid_identity.out } }
  - { id: runtime/isolation/proc-addr-confined, status: active, compat: { class: compatibility }, build: { source: proc_address.c, output: proc_address, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/proc_address }, run: [], expect: { exit: 0, stdout: golden/proc_address.out } }
  - { id: runtime/isolation/proc-confined, status: active, compat: { class: compatibility }, build: { source: proc_root.c, output: proc_root, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/proc_root }, run: [], expect: { exit: 0, stdout: golden/proc_root.out } }
  - { id: runtime/isolation/procstat-percpu, status: active, compat: { class: compatibility }, build: { source: proc_cpu.c, output: proc_cpu, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/proc_cpu }, run: [], expect: { exit: 0, stdout: golden/proc_cpu.out } }
  - { id: runtime/isolation/rlimit-view, status: active, compat: { class: compatibility }, build: { source: rlimit_view.c, output: rlimit_view, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/rlimit_view }, run: [], expect: { exit: 0, stdout: golden/rlimit_view.out } }
  - { id: runtime/isolation/sched-view, status: active, compat: { class: compatibility }, build: { source: sched_view.c, output: sched_view, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/sched_view }, run: [], expect: { exit: 0, stdout: golden/sched_view.out } }
  - { id: runtime/isolation/ulimit-nofile, status: !broken { reason: "integrated isolation run aborts before durable row attribution", evidence: "tests/runtime/isolation/EVIDENCE.md" }, compat: { class: compatibility }, build: { source: ulimit_view.c, output: ulimit_view, flags: [-static-pie, -O2, -std=gnu11, -pthread] }, artifact: { destination: /opt/husklet/isolation/ulimit_view }, environment: { HL_ULIMITS: "nofile=1024:2048" }, run: [], expect: { exit: 0, stdout: golden/ulimit_view.out } }
