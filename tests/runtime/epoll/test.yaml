targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
diagnostics-floor: [{ counter: crossings, greater-than: 0 }]
artifact:
  destination: /opt/husklet/runtime-epoll
oracle:
  provider: qemu
  commands:
    arm64: qemu-aarch64
    amd64: qemu-x86_64
build:
  source: main.c
  output: runtime-epoll
  compiler:
    arm64: aarch64-linux-gnu-gcc
    amd64: x86_64-linux-gnu-gcc
  flags:
    - -nostdlib
    - -static
    - -fno-stack-protector
    - -fno-asynchronous-unwind-tables
    - -Wl,--build-id=none
cases:
  - id: runtime/epoll/lifecycle
    status: active
    compat: { class: compatibility }
    run: [lifecycle]
    expect: { exit: 0, stdout: golden/lifecycle.txt }
