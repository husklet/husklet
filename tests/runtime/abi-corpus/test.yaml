  - id: runtime/abi-corpus-alloca
    targets: [arm64, amd64]
    build: { source: alloca.c, output: alloca, flags: [-static, -O2, -std=gnu11, -pthread, -lm] }
    artifact: { destination: /opt/husklet/abi-corpus/alloca }
    run: []
    status: active
    compat: { class: compatibility }
    expect: { exit: 0, stdout: golden/alloca.out }
