targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
build:
  compiler:
    arm64: aarch64-linux-gnu-gcc
    amd64: x86_64-linux-gnu-gcc
  flags: []
oracle:
  provider: qemu
  commands:
    arm64: qemu-aarch64
    amd64: qemu-x86_64
