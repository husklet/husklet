# No diagnostics-floor: 45 of 190 passing rows never reach the native tier in three sweeps,
# at builds=0. These exercise libc behaviour, and most bodies end below the solo budget.
targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
oracle: { provider: qemu, commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 } }
build:
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: []
cases:
  - id: runtime/libc/absdiv
    status: active
    compat: { class: compatibility }
    build: { source: absdiv.c, output: absdiv, flags: [-static, -O2, -std=gnu11, -lm] }
    artifact: { destination: /opt/husklet/libc-absdiv }
    run: []
    expect: { exit: 0, stdout: golden/absdiv.out }
