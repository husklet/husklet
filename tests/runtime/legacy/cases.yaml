version: 1
cases:
  - id: exit
    source: source/exit.c
    isa: [aarch64, x86_64]
    recipe: freestanding-v1
    expect: { exit: 42, stdout: golden/empty.out }
  - id: write
    source: source/write.c
    isa: [aarch64, x86_64]
    recipe: freestanding-v1
    expect: { exit: 0, stdout: golden/write.out }
  - id: syscall
    source: source/syscall.c
    isa: [aarch64, x86_64]
    recipe: freestanding-v1
    expect: { exit: 0, stdout: golden/syscall.out }
