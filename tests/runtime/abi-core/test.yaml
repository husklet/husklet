# No diagnostics-floor: 29 of 62 passing rows never reach the native tier in three sweeps,
# at builds=0. Semantic-equivalence probes, not native-entry coverage.
targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
build:
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: []
oracle: { provider: qemu, commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 } }
cases:
  - id: runtime/abi-core/atexit
    targets: [arm64, amd64]
    status: active
    compat: { class: compatibility }
    build: { source: atexit.c, output: atexit, flags: [-static-pie, -O2, -pthread, -lm] }
    artifact: { destination: /opt/husklet/abi-core-atexit }
    run: []
    timeout: 120
    expect: { exit: 0, stdout: golden/atexit.out }
