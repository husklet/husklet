      reason: "retained registration excludes the macOS engine because it did not enforce guest PROT_NONE"
      evidence: "tests/runtime/syscall-core/EVIDENCE.md"
    compat: { class: compatibility }
    build: { source: mprotect.c, output: mprotect, flags: [-static-pie, -O2, -pthread, -lm] }
