targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
diagnostics-floor: [{ counter: crossings, greater-than: 0 }]
oracle: { provider: qemu, commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 } }
build:
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: []
cases:
  - { id: runtime/syscall-core/abstract, status: active, compat: { class: compatibility }, build: { source: abstract.c, output: abstract, flags: [-static-pie, -O2, -pthread, -lm] }, artifact: { destination: /opt/husklet/syscall-core/abstract }, run: [], timeout: 120, expect: { exit: 0, stdout: golden/abstract.out } }
  - { id: runtime/syscall-core/clock, status: active, compat: { class: compatibility }, build: { source: clock.c, output: clock, flags: [-static-pie, -O2, -pthread, -lm] }, artifact: { destination: /opt/husklet/syscall-core/clock }, run: [], timeout: 120, expect: { exit: 0, stdout: golden/clock.out } }
