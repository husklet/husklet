targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
artifact:
  destination: /opt/husklet/status
oracle:
  provider: qemu
  commands:
    arm64: qemu-aarch64
    amd64: qemu-x86_64
build:
  source: main.c
  output: status
  compiler:
    arm64: aarch64-linux-gnu-gcc
    amd64: x86_64-linux-gnu-gcc
  flags:
    - -nostdlib
    - -static
    - -fno-stack-protector
    - -fno-asynchronous-unwind-tables
    - -Wl,--build-id=none
cases:
  - id: runtime/status
    status: active
    compat: { class: smoke }
    run: [status]
    expect: { exit: 17, stdout: golden/stdout.txt }
