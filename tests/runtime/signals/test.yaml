targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
artifact:
  destination: /opt/husklet/runtime-signals
oracle:
  provider: qemu
  commands:
    arm64: qemu-aarch64
    amd64: qemu-x86_64
