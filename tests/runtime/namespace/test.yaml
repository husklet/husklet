targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
diagnostics-floor: [{ counter: crossings, greater-than: 0 }]
artifact:
  destination: /opt/husklet/runtime-namespace
build:
  source: main.c
  output: runtime-namespace
  compiler:
    arm64: aarch64-linux-gnu-gcc
    amd64: x86_64-linux-gnu-gcc
  flags:
    - -nostdlib
    - -static
    - -fno-stack-protector
    - -fno-asynchronous-unwind-tables
    - -Wl,--build-id=none
cases:
  - id: runtime/namespace/probes
    status: active
    compat: { class: compatibility }
    run: [probes]
    expect: { exit: 0, stdout: golden/probes.txt }
