    status: !oracle-excluded
      reason: "Direct QEMU oracle output diverges from the preserved Linux contract on at least one production guest ISA"
      evidence: "tests/runtime/syscall-edges/QEMU_EVIDENCE.md"
    compat: { class: compatibility }
    build: { source: source/flag_einval.c, output: flag-einval, flags: [-static, -O2, -std=gnu11, -pthread, -lrt] }
