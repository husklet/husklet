version: 1
chains:
  - id: nested/arm64-amd64-arm64
    layers:
      - artifact:
          path: target/nested/arm64-amd64-arm64/layer-0
          build:
            kind: engine
            package: engine
            target: aarch64-unknown-linux-gnu
            isa: arm64
            binary: hl-engine
            rustflags: [-Ctarget-feature=+crt-static]
        guest_isa: amd64
      - artifact:
          path: target/nested/arm64-amd64-arm64/layer-1
          source: foreign-build
          build:
            kind: engine
            package: engine
            target: x86_64-unknown-linux-gnu
            isa: amd64
            binary: hl-engine
            rustflags: [-Ctarget-feature=+crt-static]
        guest_isa: arm64
      - artifact:
          path: target/nested/arm64-amd64-arm64/layer-2
          source: foreign-build
          build:
            kind: engine
            package: engine
            target: aarch64-unknown-linux-gnu
            isa: arm64
            binary: hl-engine
            rustflags: [-Ctarget-feature=+crt-static]
        guest_isa: arm64
    guest:
      path: target/nested/arm64-amd64-arm64/guest
      build:
        kind: c
        source: tests/runtime/abi-core/hello.c
        output: hello
        isa: arm64
        flags: [-static-pie, -O2]
    timeout_seconds: 120
    capture_limit_bytes: 1048576
    expect:
      exit: 42
      stdout: golden/hello.txt
