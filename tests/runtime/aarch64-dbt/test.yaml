targets: [arm64]
image: alpine:3.20
execution: { translated: true, translated_diagnostics: true }
oracle: { provider: qemu, commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 } }
build:
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: [-nostdlib, -static, -fno-pie, -no-pie, "-Wl,--build-id=none", "-Wl,-z,noexecstack", "-Wl,-e,_start"]
cases:
  - id: runtime/aarch64-dbt/address-branch
    status: active
    compat: { class: smoke }
    build: { source: source/movwide.c, output: address-branch, flags: [-nostdlib, -static, -fno-pie, -no-pie, "-Wl,--build-id=none", "-Wl,-z,noexecstack", "-Wl,-e,_start", "-Wl,-Ttext=0x400000"] }
    artifact: { destination: /opt/husklet/address-branch }
    run: []
    expect:
      exit: 42
      stdout_empty: true
      diagnostics:
        - { record: "[diag] backend-tree", count: 1, fields: { translated_steps: "76", interpreted_steps: "0", translated_entries: "29" } }
  - id: runtime/aarch64-dbt/alu-bench
    status: active
    compat: { class: smoke }
    build: { source: source/alu_bench.c, output: alu-bench, flags: [-nostdlib, -static, -fno-pie, -no-pie, "-Wl,--build-id=none", "-Wl,-z,noexecstack", "-Wl,-e,_start"] }
    artifact: { destination: /opt/husklet/alu-bench }
    run: []
    expect:
      exit: 42
      stdout_empty: true
      diagnostics:
        - { record: "[diag] backend-tree", count: 1, fields: { translated_steps: "51000010", interpreted_steps: "0", translated_entries: "125001" } }
  - id: runtime/aarch64-dbt/scalar-memory
    status: active
    compat: { class: smoke }
    build: { source: source/memory.c, output: scalar-memory, flags: [-nostdlib, -static, -fno-pie, -no-pie, "-Wl,--build-id=none", "-Wl,-z,noexecstack", "-Wl,-e,_start"] }
    artifact: { destination: /opt/husklet/scalar-memory }
    run: []
    expect:
      exit: 42
      stdout_empty: true
      diagnostics:
        - { record: "[diag] backend-tree", count: 1, fields: { translated_steps: "62", interpreted_steps: "4", translated_entries: "14" } }
  - id: runtime/aarch64-dbt/three-source-multiply
    status: active
    compat: { class: smoke }
    build: { source: source/multiply.c, output: three-source-multiply, flags: [-nostdlib, -static, -fno-pie, -no-pie, "-Wl,--build-id=none", "-Wl,-z,noexecstack", "-Wl,-e,_start"] }
    artifact: { destination: /opt/husklet/three-source-multiply }
    run: []
    expect:
      exit: 42
      stdout_empty: true
      diagnostics:
        - { record: "[diag] backend-tree", count: 1, fields: { translated_steps: "67", interpreted_steps: "0", translated_entries: "13" } }
  - id: runtime/aarch64-dbt/cross-block-loop
    status: active
    compat: { class: smoke }
    build: { source: source/cross_block.c, output: cross-block-loop, flags: [-nostdlib, -static, -fno-pie, -no-pie, "-Wl,--build-id=none", "-Wl,-z,noexecstack", "-Wl,-e,_start"] }
    artifact: { destination: /opt/husklet/cross-block-loop }
    run: []
    expect:
      exit: 42
      stdout_empty: true
      diagnostics:
        - { record: "[diag] backend-tree", count: 1, fields: { crossings: "125002", translated_steps: "4000011", interpreted_steps: "0", translated_entries: "125002", translations: "4" } }
        - { record: "[diag] backend-shape-detail", count: 1, fields: { translated_entries: "125002", t_cond_taken: "124999", t_cond_not_taken: "2", t_syscall: "1", stitch_jmp: "0", stitch_cond_fall: "0", e_jmp_chained: "0", e_jt_chained: "0" } }
