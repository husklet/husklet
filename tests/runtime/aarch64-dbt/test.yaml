targets: [arm64]
image: alpine:3.20
execution: { translated: true, translated_diagnostics: true }
oracle: { provider: qemu, commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 } }
build:
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: [-nostdlib, -static, -fno-pie, -no-pie, "-Wl,--build-id=none", "-Wl,-z,noexecstack", "-Wl,-e,_start"]
cases:
  - id: runtime/aarch64-dbt/movwide
    status: active
    compat: { class: smoke }
    build: { source: source/movwide.c, output: movwide, flags: [-nostdlib, -static, -fno-pie, -no-pie, "-Wl,--build-id=none", "-Wl,-z,noexecstack", "-Wl,-e,_start"] }
    artifact: { destination: /opt/husklet/movwide }
    run: []
    expect:
      exit: 42
      stdout_empty: true
      stderr: [" r0=*", " fall_total=*"]
      diagnostics:
        - { counter: translated_entries, equals: 1 }
        - { counter: interpreted_entries, equals: 0 }
        - { counter: translated_steps, equals: 6 }
        - { counter: t_syscall, equals: 1 }
        - { counter: dispatch_translated_return_mismatch, equals: 0 }
