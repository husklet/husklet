    status: !broken
      reason: "QEMU host mlock policy diverges from the engine lock-scope contract on both guest ISAs"
      evidence: "tests/runtime/memory/QEMU_EVIDENCE.md"
    compat: { class: compatibility }
    build: { source: source/mlockallscope.c, output: mlockall-scope, flags: [-static, -O2, -std=gnu11, -pthread] }
    artifact: { destination: /opt/husklet/mlockall-scope }
    run: []
    expect: { exit: 0, stdout: golden/mlockallscope.txt }
