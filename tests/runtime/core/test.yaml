image: alpine:3.20
artifact:
  destination: /opt/husklet/runtime-core
oracle:
  arm64: qemu-aarch64
  amd64: qemu-x86_64
build:
  source: main.c
  output: runtime-core
  compiler:
    arm64: aarch64-linux-gnu-gcc
    amd64: x86_64-linux-gnu-gcc
  flags:
    - -nostdlib
    - -static
    - -fno-stack-protector
    - -fno-asynchronous-unwind-tables
    - -Wl,--build-id=none
cases:
  - id: runtime/core/exit
    run: [exit]
    expect: { exit: 42, stdout: golden/exit.bin }
  - id: runtime/core/status
    run: [status]
    expect: { exit: 17, stdout: golden/status.txt }
  - id: runtime/core/write
    run: [write]
    expect: { exit: 0, stdout: golden/write.txt }
  - id: runtime/core/getpid
    run: [getpid]
    expect: { exit: 0, stdout: golden/getpid.txt }
