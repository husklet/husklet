targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
artifact:
  destination: /opt/husklet/runtime-core
oracle:
  provider: qemu
  commands:
    arm64: qemu-aarch64
    amd64: qemu-x86_64
build:
  source: main.c
  output: runtime-core
  compiler:
    arm64: aarch64-linux-gnu-gcc
    amd64: x86_64-linux-gnu-gcc
  flags:
    - -nostdlib
    - -static
    - -fno-stack-protector
    - -fno-asynchronous-unwind-tables
    - -Wl,--build-id=none
cases:
  - id: runtime/core/exit
    status: active
    compat: { class: smoke }
    run: [exit]
    expect: { exit: 42, stdout: golden/exit.bin }
  - id: runtime/core/write
    status: active
    compat: { class: smoke }
    run: [write]
    expect: { exit: 0, stdout: golden/write.txt }
  - id: runtime/core/getpid
    status: active
    compat: { class: smoke }
    run: [getpid]
    expect: { exit: 0, stdout: golden/getpid.txt }
