targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
diagnostics-floor: [{ counter: crossings, greater-than: 0 }]
oracle:
  provider: qemu
  commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 }
build:
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: [-static-pie, -O2, -pthread, -lm]
cases:
  - id: runtime/workload/busyloop
    status: active
    compat: { class: compatibility }
    timeout: 120
    build: { source: busyloop.c, output: busyloop, flags: [-static-pie, -O2, -pthread, -lm] }
    artifact: { destination: /opt/husklet/workload/busyloop }
    run: []
    expect: { exit: 0, stdout: golden/busyloop.out }
