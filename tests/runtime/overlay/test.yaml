targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
diagnostics-floor: [{ counter: crossings, greater-than: 0 }]
oracle: { provider: qemu, commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 } }
build:
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: []
cases:
  - id: runtime/overlay/coherence
    status: active
    compat: { class: compatibility }
    build: { source: coherence.c, output: coherence, flags: [-static, -O2, -std=c11] }
    artifact: { destination: /opt/husklet/overlay/coherence }
    run: []
    expect: { exit: 0, stdout: golden/coherence.out }
  - id: runtime/overlay/lower-read
    status: active
    compat: { class: compatibility }
    build: { source: lower.c, output: lower, flags: [-static, -O2, -std=c11] }
    artifact: { destination: /opt/husklet/overlay/lower-read }
    run: [read]
    expect: { exit: 0, stdout: golden/lower-read.out }
  - id: runtime/overlay/lower-negative
    status: active
    compat: { class: compatibility }
    build: { source: lower.c, output: lower-negative, flags: [-static, -O2, -std=c11] }
    artifact: { destination: /opt/husklet/overlay/lower-negative }
    run: [negative]
    expect: { exit: 0, stdout: golden/lower-negative.out }
  - id: runtime/overlay/lower-copy-up
    status: active
    compat: { class: compatibility }
    build: { source: lower.c, output: lower-copy-up, flags: [-static, -O2, -std=c11] }
    artifact: { destination: /opt/husklet/overlay/lower-copy-up }
    run: [copy-up]
    expect: { exit: 0, stdout: golden/lower-copy-up.out }
  - id: runtime/overlay/lower-directory-mode-copy-up
    status: active
    compat: { class: compatibility }
    build: { source: lower.c, output: lower-directory-mode-copy-up, flags: [-static, -O2, -std=c11] }
    artifact: { destination: /opt/husklet/overlay/lower-directory-mode-copy-up }
    run: [directory-mode-copy-up]
    expect: { exit: 0, stdout: golden/lower-directory-mode-copy-up.out }
  - id: runtime/overlay/lower-whiteout
    status: active
    compat: { class: compatibility }
    build: { source: lower.c, output: lower-whiteout, flags: [-static, -O2, -std=c11] }
    artifact: { destination: /opt/husklet/overlay/lower-whiteout }
    run: [whiteout]
    expect: { exit: 0, stdout: golden/lower-whiteout.out }
  - id: runtime/overlay/lower-merge
    status: active
    compat: { class: compatibility }
    build: { source: lower.c, output: lower-merge, flags: [-static, -O2, -std=c11] }
    artifact: { destination: /opt/husklet/overlay/lower-merge }
    run: [merge]
    expect: { exit: 0, stdout: golden/lower-merge.out }
  - id: runtime/overlay/lower-lock-copy-up
    status: active
    compat: { class: compatibility }
    build: { source: lower.c, output: lower-lock-copy-up, flags: [-static, -O2, -std=c11] }
    artifact: { destination: /opt/husklet/overlay/lower-lock-copy-up }
    run: [lock-copy-up]
    expect: { exit: 0, stdout: golden/lower-lock-copy-up.out }
  - id: runtime/overlay/lower-whiteout-dir
    status: active
    compat: { class: compatibility }
    build: { source: lower.c, output: lower-whiteout-dir, flags: [-static, -O2, -std=c11] }
    artifact: { destination: /opt/husklet/overlay/lower-whiteout-dir }
    run: [whiteout-dir]
    expect: { exit: 0, stdout: golden/lower-whiteout-dir.out }
