targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
diagnostics-floor: [{ counter: crossings, greater-than: 0 }]
oracle: { provider: qemu, commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 } }
build:
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: []
cases:
  - id: runtime/filesystem/directory-lifecycle
    status: active
    compat: { class: compatibility }
    build: { source: source/directory.c, output: directory, flags: [-nostdlib, -static, -fno-stack-protector, -fno-asynchronous-unwind-tables, "-Wl,--build-id=none"] }
    artifact: { destination: /opt/husklet/runtime-directory }
    run: [lifecycle]
    expect: { exit: 0, stdout_empty: true }
  - id: runtime/filesystem/positional-arm64
    status: active
    targets: [arm64]
    compat: { class: compatibility }
    build: { source: source/positional.c, output: positional, flags: [-std=c11, -Os, -nostdlib, -static, -fno-pie, -no-pie, -fno-ident, -fno-stack-protector, -ffreestanding, "-Wl,--build-id=none", "-Wl,-z,noexecstack", "-Wl,-e,_start"] }
    artifact: { destination: /opt/husklet/runtime-positional }
    run: [io]
    # Straight-line syscall code with no hot loop, so the native tier never builds a region.
    expect: { exit: 0, stdout_empty: true, diagnostics: [] }
  - id: runtime/filesystem/positional-amd64
    status: active
    targets: [amd64]
    compat: { class: compatibility }
    build: { source: source/positional.c, output: positional-amd64, flags: [-std=c11, -Os, -nostdlib, -static, -fno-pie, -no-pie, -fno-ident, -fno-stack-protector, -ffreestanding, "-Wl,--build-id=none", "-Wl,-z,noexecstack", "-Wl,-e,_start"] }
    artifact: { destination: /opt/husklet/runtime-positional-amd64 }
