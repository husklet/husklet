targets: [arm64]
image: alpine:3.20
execution: { translated: true, translated_diagnostics: true }
build:
  source: backedge_signal.c
  output: backedge-signal
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: [-static, -O2, -std=gnu11]
artifact: { destination: /opt/husklet/backedge-signal }
cases:
  - id: runtime/aarch64-dbt-signal/backedge-signal-bound
    status: active
    compat: { class: compatibility }
    run: []
    timeout: 3
    expect: { exit: 42, stdout_empty: true, stderr: [" r0=*", " fall_total=*"] }
