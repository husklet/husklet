    status: active
    compat: { class: compatibility }
    build: { source: clockres.c, output: clockres, flags: [-static, -O2, -std=gnu11, -pthread, -lrt] }
    artifact: { destination: /opt/husklet/time-clockres }
    run: []
    expect: { exit: 0, stdout: golden/clockres.out }
