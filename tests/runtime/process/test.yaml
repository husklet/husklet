  - id: runtime/process/clone-settid
    targets: [arm64, amd64]
    status: !broken
      reason: "raw clone(CLONE_VM|CLONE_PARENT_SETTID|CLONE_CHILD_SETTID|CLONE_CHILD_CLEARTID|SIGCHLD) returns EINVAL, so the guest prints 'clone fail' and exits 1. The gate is Runtime::valid in src/containers/hl-engine/src/ffi/linux/execution/fork.rs: the process-fork path accepts only CHILD_SETTID|CHILD_CLEARTID|PIDFD, plus VM|VFORK when BOTH are set. This case sets CLONE_VM without CLONE_VFORK (a distinct waitable process sharing the address space with a concurrently running parent, which the engine only aliases for the parked-parent vfork case) and CLONE_PARENT_SETTID (never accepted by the fork path, though process/fork.rs::probe_parent_outputs already faults-checks its pointer). CHILD_SETTID/CHILD_CLEARTID themselves are implemented and exercised. The refusal is loud (EINVAL), not silent. Contrast clone-vm-vfork and clone-stack, which are active and pass."
