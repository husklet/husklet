targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
diagnostics-floor: [{ counter: crossings, greater-than: 0 }]
oracle: { provider: qemu, commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 } }
build:
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: []
cases:
  - id: runtime/process/job-control
    status: active
    compat: { class: compatibility }
    build: { source: source/job_control.c, output: job-control, flags: [-static, -O2, -std=gnu11] }
    artifact: { destination: /opt/husklet/job-control }
    run: []
    expect: { exit: 0, stdout: golden/job_control.txt }
  - id: runtime/process/namespace-boundary
    status: active
    compat: { class: compatibility }
    build: { source: source/namespace_boundary.c, output: namespace-boundary, flags: [-std=c11, -Os, -nostdlib, -static, -fno-pie, -no-pie, -fno-ident, -fno-stack-protector, -ffreestanding, "-Wl,--build-id=none", "-Wl,-z,noexecstack", "-Wl,-e,_start"] }
    artifact: { destination: /opt/husklet/namespace-boundary }
    run: []
    # A -nostdlib freestanding _start that issues eight syscalls straight-line and exits, so it
    # reaches neither the admission warm-up nor the solo budget; measured runs=0 builds=0 services=8.
    expect: { exit: 0, stdout: golden/namespace_boundary.txt, diagnostics: [] }
  - id: runtime/process/uname-boundary
    status: !oracle-excluded
      reason: "QEMU exposes host uname identity instead of the configured engine guest identity"
      evidence: "tests/runtime/process/QEMU_EVIDENCE.md"
    compat: { class: compatibility }
    build: { source: source/uname_boundary.c, output: uname-boundary, flags: [-std=c11, -Os, -nostdlib, -static, -fno-pie, -no-pie, -fno-ident, -fno-stack-protector, -ffreestanding, "-Wl,--build-id=none", "-Wl,-z,noexecstack", "-Wl,-e,_start"] }
    artifact: { destination: /opt/husklet/uname-boundary }
    # The runner otherwise defaults the guest hostname to the container id, so the configured
    # identity this case asserts has to be requested explicitly.
    environment: { HL_HOSTNAME: "jit" }
    run: []
    # A -nostdlib freestanding _start issuing nine straight-line syscalls, so like its
    # namespace-boundary sibling it never reaches native translation.
    expect: { exit: 0, stdout: golden/uname_boundary.txt, diagnostics: [] }
  - id: runtime/process/inet-loopback
    status: active
    compat: { class: compatibility }
    build: { source: source/inet_loopback.c, output: inet-loopback, flags: [-static, -O2, -std=gnu11] }
    artifact: { destination: /opt/husklet/inet-loopback }
    environment: { HL_NET_HOST: "1" }
    run: []
    expect: { exit: 0, stdout: golden/inet_loopback.txt }
  - id: runtime/process/inet-isolated
    status: !oracle-excluded
      reason: "QEMU user mode shares the host network namespace, so it cannot referee an isolated-netns routing contract"
      evidence: "tests/runtime/process/QEMU_EVIDENCE.md"
    compat: { class: compatibility }
    build: { source: source/inet_isolated.c, output: inet-isolated, flags: [-static, -O2, -std=gnu11] }
    artifact: { destination: /opt/husklet/inet-isolated }
    environment: { HL_NET_ISOLATE: "1" }
    run: []
    expect: { exit: 0, stdout: golden/inet_isolated.txt }
  - id: runtime/process/credential-mutation
