    targets: [arm64]
    build: { source: aarch64/crypto_aes.c, output: arm64-crypto-aes, flags: [-static, -O2, -std=gnu11, -Itests/runtime/completeness] }
    artifact: { destination: /opt/husklet/completeness/arm64-crypto-aes }
