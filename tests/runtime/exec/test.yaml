targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
diagnostics-floor: [{ counter: crossings, greater-than: 0 }]
oracle: { provider: qemu, commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 } }
build:
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: []
cases:
  - id: runtime/exec/exec-edges
    status: active
    compat: { class: compatibility }
    build: { source: source/exec_edges.c, output: exec-edges, flags: [-static, -O2, -std=gnu11, -pthread] }
    artifact: { destination: /opt/husklet/exec-edges }
    run: []
    expect: { exit: 0, stdout: golden/exec_edges.txt }
  - id: runtime/exec/execveat-edges
    status: active
    compat: { class: compatibility }
    build: { source: source/execveat_edges.c, output: execveat-edges, flags: [-static, -O2, -std=gnu11, -pthread] }
    artifact: { destination: /opt/husklet/execveat-edges }
    run: []
    expect: { exit: 0, stdout: golden/execveat_edges.txt }
  - id: runtime/exec/exec-pinned-authority
    targets: [arm64, amd64]
    status: !oracle-excluded
      reason: "The deterministic pathname-swap rendezvous is a Husklet native-test-hook boundary, not a Linux ABI"
      evidence: "tests/runtime/exec/source/exec_pinned_authority.c"
    compat: { class: compatibility }
    build: { source: source/exec_pinned_authority.c, output: exec-pinned-authority, flags: [-static, -O2, -std=gnu11, -pthread] }
    artifact: { destination: /opt/husklet/exec-pinned-authority }
    run: []
    timeout: 120
    expect: { exit: 0, stdout: golden/exec_pinned_authority.txt }
  - id: runtime/exec/exec-interpreter-busy
    targets: [arm64, amd64]
    status: active
    compat: { class: compatibility }
    build:
      source: source/exec_interpreter_busy.c
      output: exec-interpreter-busy
      flags: [-static, -O2, -std=gnu11]
    artifact: { destination: /opt/husklet/exec-interpreter-busy }
    run: []
    timeout: 120
    expect: { exit: 0, stdout: golden/exec_interpreter_busy.txt }
