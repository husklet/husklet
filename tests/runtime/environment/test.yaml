# No diagnostics-floor: both passing rows sit at runs=0 in three sweeps. The case reads its
# initial stack and exits, so it is interpreter-only by construction.
targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
artifact:
  destination: /opt/husklet/runtime-environment
oracle:
  provider: qemu
  commands:
    arm64: qemu-aarch64
    amd64: qemu-x86_64
build:
  source: main.c
  output: runtime-environment
  compiler:
    arm64: aarch64-linux-gnu-gcc
    amd64: x86_64-linux-gnu-gcc
  flags:
    - -nostdlib
    - -static
    - -fno-stack-protector
    - -fno-asynchronous-unwind-tables
    - -Wl,--build-id=none
cases:
  - id: runtime/environment/initial-stack
    status: active
    compat: { class: compatibility }
    run: [initial-stack]
    environment:
      - name: TZ
        value: { bytes: [85, 84, 67, 255] }
      - name: EMPTY
        value: ""
      - name: PATH
        value: /usr/bin:/bin
      - name: HOME
        value: /root
      - name: TERM
        value: dumb
      - name: LANG
        value: C
    expect: { exit: 0, stdout: golden/initial-stack.txt }
