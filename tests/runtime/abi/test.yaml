# No diagnostics-floor: 42 of 147 passing rows (all arm64) never reach the native tier in
# three sweeps, at builds=0 -- single-shot ABI probes finish inside the solo budget.
targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
build:
  compiler:
    arm64: aarch64-linux-gnu-gcc
    amd64: x86_64-linux-gnu-gcc
  flags: []
oracle:
  provider: qemu
  commands:
    arm64: qemu-aarch64
    amd64: qemu-x86_64
cases:
  - id: runtime/abi-alloca
    targets: [arm64, amd64]
    build: { source: alloca.c, output: alloca, flags: [-static, -O2, -lm] }
    artifact: { destination: /opt/husklet/abi/alloca }
    run: []
    status: active
    compat: { class: compatibility }
    expect: { exit: 0, stdout: golden/alloca.out }
