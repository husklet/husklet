targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
artifact: { destination: /opt/husklet/runtime-socket-stop }
oracle: { provider: qemu, commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 } }
build:
  source: main.c
  output: runtime-socket-stop
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: [-static, -O2, -std=gnu11]
cases:
  - id: runtime/socket-stop/blocking-read
    status: !oracle-excluded
      reason: "the compatibility contract requires the container lifecycle stop API, which a direct QEMU process cannot referee"
      evidence: "tests/runtime/socket-stop/EVIDENCE.md"
    targets: [arm64, amd64]
    compat: { class: compatibility }
    run: [blocking-read]
    orchestration: { stop-after-ms: 100 }
    expect: { exit: 0, signal: 15, stdout_empty: true }
