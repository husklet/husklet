targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
artifact: { destination: /opt/husklet/runtime-job-control }
oracle: { provider: qemu, commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 } }
build:
  source: main.c
  output: runtime-job-control
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: [-static, -O2, -std=gnu11]
cases:
  - id: runtime/job-control/lifecycle
    status: active
    targets: [arm64, amd64]
    compat: { class: compatibility }
    run: [lifecycle]
    expect: { exit: 0, stdout: golden/stdout.txt }
