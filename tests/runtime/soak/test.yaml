targets: [arm64, amd64]
image: alpine:3.20
execution: { native: true, diagnostics: true }
diagnostics-floor: [{ counter: crossings, greater-than: 0 }]
artifact: { destination: /opt/husklet/soak/atomic_churn }
oracle:
  provider: qemu
  commands: { arm64: qemu-aarch64, amd64: qemu-x86_64 }
build:
  source: atomic_churn.c
  output: atomic_churn
  compiler: { arm64: aarch64-linux-gnu-gcc, amd64: x86_64-linux-gnu-gcc }
  flags: [-static-pie, -O2, -std=gnu11, -pthread, -lm]
cases:
  - id: runtime/atomicchurn
    status: active
    compat: { class: soak }
    soak: &bounded { duration_seconds: 240, repetitions: 1, resources: { cpu: 1, memory_mib: 1024, processes: 64 } }
    run: []
    expect: { exit: 0, stdout: golden/atomic_churn.out }
  - id: runtime/bitchurn
    status: active
    compat: { class: soak }
    build: { source: bit_churn.c, output: bit_churn, flags: [-static-pie, -O2, -std=gnu11, -pthread, -lm] }
    artifact: { destination: /opt/husklet/soak/bit_churn }
    soak: *bounded
    run: []
    expect: { exit: 0, stdout: golden/bit_churn.out }
  - id: runtime/callgraph
    status: active
