[package]
name = "dd-jit"
version = "0.4.0"
edition = "2021"
description = "dd — VM-less container runtime: a clean, platform-agnostic Rust API for configuring and running containers. Selects a host backend (dd-jit-darwin today; dd-jit-linux / dd-jit-win in future)."
license = "MIT"

[lib]
name = "dd_jit"
path = "src/lib.rs"

[dependencies]
dd-jit-darwin = { path = "../dd-jit-darwin" }
# async launch + supervision (the `container` module): spawn the engine, pump stdio into a log
# broadcast, wait/signal/pause. The daemon builds its Docker semantics on top of these primitives.
tokio = { version = "1", features = ["rt", "process", "io-util", "net", "sync", "time", "macros"] }
libc = "0.2"
