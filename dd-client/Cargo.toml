[package]
name = "dd-client"
version = "0.4.0"
edition = "2021"
description = "Docker-Engine-API client library for dd-daemon — a thin bollard façade with dd-specific view models, shared by the dd CLI and GUI."
license = "MIT"

[lib]
name = "dd_client"
path = "src/lib.rs"

[dependencies]
# Docker-Engine-API client over a unix socket (mature wire transport) + the stream/log plumbing.
bollard = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
