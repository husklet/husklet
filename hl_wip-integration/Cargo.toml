# hl_wip-integration — the Linux-phase CAPSTONE integration test crate.
#
# It proves the two core goals compose with the REAL driver implementations:
#   1. `engine.add(Cuda::new()) / Vulkan::new() / Gl::new()` plugs all three drivers into the hl-jit
#      `Drivers` registry and each injects its mounts + env correctly (`tests/plug.rs`).
#   2. All three drivers lower onto the ONE neutral runtime + reference CPU executor, through a single
#      shared `InProcessCommandSink<CpuExecutor>` (`tests/lower.rs`).
#
# It is a pure TEST crate: the driver + runtime crates are DEV-dependencies (nothing links them at
# `build` time), and every driver is pulled with its `jit` feature so its `hl_jit::Driver` plug is built.
#
# It carries an EMPTY `[workspace]` table so it is its OWN workspace root, EXCLUDED from the shared
# repo-root workspace: the concurrent codex agent's `cargo build` at the repo root never sees it. Build
# and run it with:
#   cargo test --offline --manifest-path hl_wip-integration/Cargo.toml
[package]
name = "hl_wip_integration"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "hl_wip_integration"
path = "src/lib.rs"

# Everything is test-only: the integration tests in `tests/` see both dependencies and dev-dependencies,
# so all the real crates live here and nothing is a normal (build-time) dependency.
[dev-dependencies]
# The container-runtime driver-plugin seam: `Drivers`, `Driver`, `DeviceRequest`, `DeviceMount`.
hl-jit = { path = "../hl-jit" }
# The neutral GPU protocol + runtime + reference CPU executor (package `hl_wip_gpu`, lib `hl_gpu`).
hl_gpu = { package = "hl_wip_gpu", path = "../hl_wip-gpu" }
# The three real guest drivers, each with its host-side `hl_jit::Driver` plug (`jit` feature).
hl_cuda = { package = "hl_wip_cuda", path = "../hl_wip-cuda", features = ["jit"] }
hl_vulkan = { package = "hl_wip_vulkan", path = "../hl_wip-vulkan", features = ["jit"] }
hl_gl = { package = "hl_wip_gl", path = "../hl_wip-gl", features = ["jit"] }

# Empty table => this file is its own workspace root, so the crate is EXCLUDED from the repo-root
# workspace and keeps the shared tree green.
[workspace]
