[package]
name = "hl-term"
version = "0.1.0"
edition = "2021"
description = "TRANSITIONAL: the workspace model (was hl-term core), pending its move into hl-ws. The terminal primitive now lives in hl-ws-term; this crate re-exports it during the composition-root split and is removed once hl-ws exists."
license = "MIT"

[lib]
name = "hl_term"
path = "src/lib.rs"

# The terminal primitive moved to hl-ws-term; the workspace model here depends on it for the PtyBackend
# launch seam. libc stays for the headless launch test's poll loop.
[dependencies]
hl-ws-term = { path = "../hl-ws-term" }
libc = "0.2"
