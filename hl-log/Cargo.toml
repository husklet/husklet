# hl-log — foundational tag-based logging + counters + timing for the whole app.
#
# STANDALONE workspace: the empty `[workspace]` table below makes this its OWN workspace root,
# EXCLUDED from the shared repo-root workspace so a concurrent agent's repo-root build never sees
# it. The crate has ZERO external dependencies (std-only) by design — full perf control, no bloat.

[package]
name = "hl-log"
version = "0.1.0"
edition = "2021"
description = "Tag-based logging + counters + timing with a zero-cost-when-disabled gate. std-only, no deps."
license = "MIT OR Apache-2.0"

[lib]
name = "hl_log"
path = "src/lib.rs"

[features]
# Default leaves the runtime gate in (one atomic load + branch when disabled). In a `--release`
# build the verbose levels (warn/info/debug/trace) + counters + spans compile to NOTHING; only
# hl_error! and hl_log! (runtime level) survive. Debug builds keep everything behind the gate.
default = []
# Keep the verbose macros + counters + spans compiled IN even in `--release`, so a release build
# can be profiled / verbosely traced on demand (still runtime-gated by HL_LOG / HL_LOG_COUNTERS).
release-verbose = []
# Compile-time HARD-OFF: every macro expands to `{}` and spans become no-ops. For release builds
# that want the branches gone entirely (even hl_error!).
disabled = []

# Empty workspace table => this crate is its OWN isolated workspace root.
[workspace]
