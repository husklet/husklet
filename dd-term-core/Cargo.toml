[package]
name = "dd-term-core"
version = "0.1.0"
edition = "2021"
description = "dd-term core: a self-contained VT grid, input encoding, pane layout, and a CPU renderer (embedded bitmap font + PNG) — zero GPU/window/network deps so it is fully headless-testable."
license = "MIT"

[lib]
name = "dd_term_core"
path = "src/lib.rs"

# Deliberately depends ONLY on crates already vendored in this workspace's cargo cache (libc, bitflags):
# this Linux dev/test host cannot fetch new crates.io tarballs (TLS MITM blocks cargo downloads), and
# keeping the core dependency-free makes it buildable + testable + screenshottable here with no network.
# The GPU shell crate (`dd-term`, winit + wgpu) pulls its heavier deps on the macOS build host, like
# `dd-gui` does; it uploads this crate's same embedded font atlas so ship == what the CPU renderer verifies.
[dependencies]
libc = "0.2"
bitflags = "2"
