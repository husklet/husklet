[package]
name = "husklet"
version = "0.4.0"
edition = "2021"
autobins = false
description = "Husklet workspace application and command-line interface."
license = "MIT"

# The library defaults to lightweight workspace configuration. The signed application enables the
# engine-linked runtime explicitly through its `gui` feature.
[lib]
name = "hl"
path = "src/lib.rs"

[[bin]]
name = "husklet"
path = "src/bin/husklet.rs"
required-features = ["gui"]

[dependencies]
hl-design = { path = "../../packages/hl-design" }
hl-fs = { path = "../../packages/hl-fs", default-features = false }
# The bare workspace primitive the `config` module wraps — the ONLY non-optional dep, so a `default-
# features = false` consumer (e.g. hl-gui) gets just the light config and none of the engine stack.
hl-ws = { path = "../../workspaces/hl-ws" }
hl-log = { path = "../../packages/hl-log" }

hl-ws-term = { path = "../../workspaces/hl-ws-term", optional = true }
hl-extension = { path = "../../workspaces/hl-extension", optional = true }
hl-container = { path = "../../containers/hl-container", default-features = false, optional = true }
hl-daemon = { path = "../../containers/hl-daemon", optional = true }
hl-client = { path = "../../containers/hl-client", optional = true }
hl-images = { path = "../../containers/hl-images", optional = true }
hl-gui = { path = "../../workspaces/hl-gui", optional = true }
hl-gui-gtk = { path = "../../workspaces/hl-gui-gtk", optional = true }
libc = { version = "0.2", optional = true }
fs2 = { workspace = true, optional = true }
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "signal"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
gtk = { version = "0.9", package = "gtk4", features = ["v4_10"], optional = true }
vte4 = { version = "0.8", features = ["v0_72"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.2", features = ["NSThread"], optional = true }
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSWindow", "NSResponder", "NSView", "NSAppearance", "NSColor"], optional = true }

[dev-dependencies]
flate2.workspace = true
tempfile.workspace = true

[build-dependencies]
sha2.workspace = true

[features]
# The default library is portable workspace configuration. The signed app enables its private runtime.
default = []
# Compile optimized rich logs and timing spans for live product profiling. Runtime emission remains
# controlled by HL_LOG / HL_LOG_LEVEL / HL_LOG_COUNTERS.
profile = ["hl-log/release-verbose"]
runtime = [
    "dep:hl-ws-term",
    # The extension protocol describes interfaces in `hl-gui` types, so hosting a
    # conversation needs the toolkit-neutral model even with no window open.
    "dep:hl-gui",
    "dep:hl-extension",
    "dep:hl-container",
    "dep:hl-daemon",
    "dep:hl-client",
    "dep:hl-images",
    "dep:fs2",
    "dep:libc",
    "dep:tokio",
    "dep:serde_json",
    "dep:sha2",
    "dep:tar",
]
gui = [
    "runtime",
    "dep:hl-gui",
    "dep:hl-gui-gtk",
    "dep:gtk",
    "dep:vte4",
    "dep:serde",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
]
# Explicit cross-language integration proof. CI installs the locked MCP package
# graph before enabling it; ordinary Rust gates never acquire npm dependencies.
mcp-e2e = []

[lints]
workspace = true
