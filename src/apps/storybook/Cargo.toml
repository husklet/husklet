[package]
name = "storybook"
version = "0.1.0"
edition = "2021"
description = "Renders every hl-gui component so the library can be reviewed visually."
license = "MIT"

[[bin]]
name = "storybook"
path = "src/main.rs"

[lib]
name = "storybook"
path = "src/lib.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
hl-gui = { path = "../../workspaces/hl-gui" }
hl-process = { path = "../../packages/hl-process" }
hl-gui-gtk = { path = "../../workspaces/hl-gui-gtk" }
hl-extension = { path = "../../workspaces/hl-extension" }
extension = { path = "../extension" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
