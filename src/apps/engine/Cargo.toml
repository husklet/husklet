[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autobins = false

[lints]
workspace = true

[dependencies]
# `string` lets the usage, version and suggestion lines carry the worker name the caller actually
# typed, which is resolved from argument zero and so cannot be a `&'static str`.
clap = { workspace = true, features = ["string"] }
hl-engine = { path = "../../containers/hl-engine" }
hl-native = { path = "../../runtime/hl-native" }
hl-log = { path = "../../packages/hl-log" }
sha2.workspace = true

[[bin]]
name = "hl-engine"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hl-aarch64"
path = "src/bin/aarch64.rs"

[[bin]]
name = "hl-x86_64"
path = "src/bin/x86.rs"

[dev-dependencies]
# The integration-test target writes its host skip notice straight to descriptor 2, because
# libtest prints captured output only for a failing test.
libc = "0.2"
serde_json.workspace = true
tempfile.workspace = true
