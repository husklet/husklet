[package]
name = "testing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The repository testing application owns the typed command surface that selects
# its independent runtime, scenario, and benchmark runners.
clap.workspace = true
hl-container = { path = "../../containers/hl-container" }
hl-images = { path = "../../containers/hl-images" }
hl-log = { path = "../../packages/hl-log" }
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "testing"
path = "src/main.rs"
