[package]
name = "testing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The repository testing application owns the typed command surface that selects
# its independent runtime, scenario, and benchmark runners.
clap.workspace = true
hl-container = { path = "../../containers/hl-container" }
hl-images = { path = "../../containers/hl-images" }
hl-log = { path = "../../packages/hl-log" }
hl-engine = { path = "../../containers/hl-engine" }
libc = "0.2"
ring = "0.17.14"
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
hl-checkpoint = { path = "../../runtime/hl-checkpoint" }
hl-descriptor = { path = "../../runtime/hl-descriptor" }
hl-network = { path = "../../runtime/hl-network" }
hl-provider = { path = "../../runtime/hl-provider" }
hl-runtime = { path = "../../runtime/hl-runtime" }

[[bin]]
name = "testing"
path = "src/main.rs"

[[bin]]
name = "hl-native-child-fixture"
path = "src/bin/child_fixture.rs"

[[bin]]
name = "hl-compat-worker"
path = "src/bin/compat_worker.rs"

[[bin]]
name = "hl-authority-child"
path = "src/bin/authority_child.rs"

[[bin]]
name = "hl-confinement-child"
path = "src/bin/confinement_child.rs"

[[bin]]
name = "hl-projection-worker"
path = "src/bin/projection_worker.rs"
