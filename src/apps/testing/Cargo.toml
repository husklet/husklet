[package]
name = "testing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["native-test-hooks"]
native-test-hooks = [
    "hl-container/native-test-hooks",
    "hl-engine/native-test-hooks",
    "hl-native/native-test-hooks",
]
# The runtime corpus measures the production engine surface. Spell this feature
# explicitly with `--no-default-features` so an accidental default build cannot
# silently put test hooks back into a measured artifact.
production-runtime = []

[dependencies]
# The repository testing application owns the typed command surface that selects
# its independent runtime, scenario, and benchmark runners.
clap.workspace = true
fs2.workspace = true
hl-container = { path = "../../containers/hl-container", default-features = false }
hl-design = { path = "../../packages/hl-design" }
hl-images = { path = "../../containers/hl-images" }
hl-log = { path = "../../packages/hl-log" }
hl-native = { path = "../../runtime/hl-native", default-features = false }
hl-process = { path = "../../packages/hl-process" }
hl-engine = { path = "../../containers/hl-engine", default-features = false }
reflink-copy.workspace = true
regex.workspace = true
ring = "0.17.14"
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
shlex = "2"
tempfile.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal"] }

[target.'cfg(unix)'.dependencies]
xattr = "1.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[[bin]]
name = "testing"
path = "src/main.rs"
