[package]
name = "testing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The repository testing application owns the typed command surface that selects
# its independent runtime, scenario, and benchmark runners.
clap.workspace = true
fs2.workspace = true
hl-container = { path = "../../containers/hl-container" }
hl-design = { path = "../../packages/hl-design" }
hl-images = { path = "../../containers/hl-images" }
hl-log = { path = "../../packages/hl-log" }
hl-native = { path = "../../runtime/hl-native", features = ["native-test-hooks"] }
hl-process = { path = "../../packages/hl-process" }
hl-engine = { path = "../../containers/hl-engine" }
reflink-copy.workspace = true
ring = "0.17.14"
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
tempfile.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal"] }

[target.'cfg(unix)'.dependencies]
xattr = "1.6.1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[[bin]]
name = "testing"
path = "src/main.rs"
