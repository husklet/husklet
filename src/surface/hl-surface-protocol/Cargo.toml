[package]
name = "hl-surface-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["bindings"]
bindings = ["dep:wayland-client", "dep:wayland-server", "dep:wayland-backend", "dep:wayland-scanner"]

[dependencies]
wayland-client = { version = "0.31", optional = true }
wayland-server = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", optional = true }
wayland-scanner = { version = "0.31", optional = true }

# This crate owns the audited raw libwayland descriptor boundary. Other workspace crates retain the
# workspace-wide unsafe-code prohibition.
