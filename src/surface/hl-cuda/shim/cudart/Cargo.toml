# hl-cuda shim: the guest CUDA Runtime API front-end, deployed as `libcudart.so.1`.
#
# A cdylib whose exported `cuda*`/`__cuda*` C-ABI surface is code-generated from `registry/cudart.manifest`
# (build.rs) so it can never drift from the golden (54 entry points). The memory + device basics have
# real bodies that call the `hl_cuda` lowering services through a process-global `hl_gpu::RemoteCommandSink`;
# the fatbin-registration launch tail are benign, correct-ABI stubs (that path needs the registration
# machinery, deferred).
#
# Carries an EMPTY `[workspace]` so it is its own workspace root — cross-compiled standalone by
# hl-cuda/build.rs.
[package]
name = "hl-cuda-shim-cudart"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "hl_cudart_guest"
crate-type = ["cdylib"]

[dependencies]
hl_cuda = { package = "hl-cuda", path = "../..", default-features = false }
hl_gpu = { package = "hl-gpu", path = "../../../../gpu/hl-gpu" }

[profile.release]
panic = "abort"
opt-level = "z"

[workspace]
