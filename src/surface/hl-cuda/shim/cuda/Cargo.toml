# hl-cuda shim: the guest CUDA Driver API front-end, deployed as `libcuda.so.1`.
#
# A cdylib whose exported `cu*` C-ABI surface is code-generated from `registry/cuda_driver.manifest`
# (build.rs) so it can never drift from the golden (141 entry points). The compute/bring-up core has
# real bodies that marshal C args and call the `hl_cuda` lowering services through a process-global
# `hl_gpu::RemoteCommandSink` ($HL_GPU_EXEC); the long tail are benign, correct-ABI stubs.
#
# Carries an EMPTY `[workspace]` so it is its own workspace root — excluded from the shared repo
# workspace AND from the hl-cuda workspace, and cross-compiled standalone by hl-cuda/build.rs.
[package]
name = "hl-cuda-shim-cuda"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# Output object is `libhl_cuda_guest.so`; build.rs bakes DT_SONAME=libcuda.so.1 and the stager installs
# it under that name. The name is deliberately hl-prefixed so it never collides on the host build.
name = "hl_cuda_guest"
crate-type = ["cdylib"]

[dependencies]
# The CUDA -> hl-GPU-IR lowering services (alloc/transfer/module/launch/sync) + the CUDA object model.
hl_cuda = { package = "hl-cuda", path = "../..", default-features = false }
# The neutral protocol + the guest-side RemoteCommandSink transport over $HL_GPU_EXEC.
hl_gpu = { package = "hl-gpu", path = "../../../../gpu/hl-gpu" }

[profile.release]
# Injected .so: keep it small; abort-on-panic so a Rust panic can never unwind across the C-ABI seam.
panic = "abort"
opt-level = "z"

# Empty table => own workspace root, excluded from every surrounding workspace.
[workspace]
