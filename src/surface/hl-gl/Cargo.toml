# hl-gl — the standalone OpenGL-ES/EGL guest-driver crate.
#
# Structurally IDENTICAL to `hl-cuda`: its ONLY dependency is the neutral protocol crate
# `hl-gpu` (package `hl_gpu`, lib `hl_gpu`). A GLES/EGL operation lowers to protocol `Cmd`s and
# is submitted through a `CommandSink`. Nothing GL-specific leaks into the protocol; nothing
# protocol-transport-specific leaks into the driver. GL is DEFERRED-lowering: `gl*` calls RECORD into
# per-context state and the IR is emitted at `eglSwapBuffers`.
#
[package]
name = "hl-gl"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# Downstream reads the driver through `hl_gl::…`.
name = "hl_gl"
path = "src/lib.rs"

[dependencies]
# The neutral hl-GPU protocol (Cmd/Enc, descriptors, kernel-IR, CommandSink). Package `hl_gpu`,
# lib target `hl_gpu` — so code here reads `hl_gpu::protocol::…`.
hl_gpu = { package = "hl-gpu", path = "../../gpu/hl-gpu" }

# Tag-based logging + counters + timing (std-only, zero-cost when off, its own workspace). Links from the
# lib AND the guest cdylibs (it is NOT `#[no_mangle]`, so the 402/44/358 exported-ABI split is unaffected).
hl-log = { path = "../../packages/hl-log" }

# The container-runtime driver-plugin seam (`hl_jit::Driver`). OPTIONAL + behind the `jit` feature so the
# HOST composition root gets the `Gl` driver plug, while the GUEST shim cdylibs (which depend on this
# crate for the lowering services) do NOT drag hl-jit / hl-jit-darwin / tokio into a guest .so — they set
# `default-features = false`. hl-jit builds on this Linux host.
hl-jit = { path = "../../engine/hl-jit", optional = true }

[features]
# On by default so `cargo test --manifest-path hl-gl/Cargo.toml` builds the `Gl` driver plug.
default = ["jit"]
# Gate the host-side `driver` module (the `hl_jit::Driver` impl) + its hl-jit dependency.
jit = ["dep:hl-jit"]

# The GLSL corpus battery (`tests/glsl_corpus.rs`) compiles each translated shader through the SAME host
# route the wgpu executor uses (naga `glsl-in` → validate → `wgsl-out`), so a translator gap surfaces as a
# real naga error rather than a structural guess. naga 24 is already vendored (wgpu depends on it), so this
# resolves offline. Test-only: it never links into the lib or the guest cdylibs.
[dev-dependencies]
naga = { version = "24.0.0", features = ["glsl-in", "wgsl-out"] }
