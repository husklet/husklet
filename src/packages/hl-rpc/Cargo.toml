[package]
name = "hl-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Framing, channels, capabilities, and routing for Husklet's socket protocols"

[lib]
name = "hl_rpc"
path = "src/lib.rs"

# Deliberately no domain dependency and no HTTP library. This crate is the
# plumbing every socket protocol shares; what a route means belongs to whoever
# declares the route, and how it is carried belongs to whoever binds the socket.
[dependencies]
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
