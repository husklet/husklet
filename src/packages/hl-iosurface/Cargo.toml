[package]
name = "hl-iosurface"
version = "0.1.0"
edition = "2021"
description = "Owned macOS IOSurface allocations and safe lifetime-bound native handles."
license = "MIT"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSDictionary", "NSObject", "NSString", "NSValue"] }
