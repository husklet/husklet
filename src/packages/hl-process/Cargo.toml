[package]
name = "hl-process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Bounded ownership of host subprocess lifecycles"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# A `Drop` cannot propagate, and `unix_descriptor` owns process-global standard descriptor slots: a
# failed restoration is invisible from wherever it later surfaces unless the guard names it there.
# hl-log is std-only with no external dependencies and its error level survives release.
hl-log = { path = "../hl-log" }

[dev-dependencies]
tempfile.workspace = true
