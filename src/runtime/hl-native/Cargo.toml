[package]
name = "hl-native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"
links = "hl_native"

[lints]
workspace = true

[features]
native-test-hooks = []

[dependencies]
libc = "0.2"

[build-dependencies]
hl-cc = { path = "../../packages/hl-cc" }

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true

[lib]
name = "hl_native"
path = "src/lib.rs"

[[test]]
name = "bound_vector_io"
required-features = ["native-test-hooks"]

[[test]]
name = "errno_namespace"
required-features = ["native-test-hooks"]

[[test]]
name = "identity_registry"

[[test]]
name = "x86_store_preflight"
required-features = ["native-test-hooks"]

[[test]]
name = "restore_collision"
required-features = ["native-test-hooks"]

[[test]]
name = "checkpoint_pipe_capture"
required-features = ["native-test-hooks"]

[[test]]
name = "unix_identity"
required-features = ["native-test-hooks"]

[[test]]
name = "arena_sidecar"

[[test]]
name = "macos_process_identity"
required-features = ["native-test-hooks"]
