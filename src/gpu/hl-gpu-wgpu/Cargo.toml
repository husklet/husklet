# hl-gpu-wgpu — the cross-platform GPU executor implementing `hl_gpu::runtime::port::GpuExecutor`
# on wgpu + naga. Stores native wgpu resources behind the protocol ids in `SessionResources` (exactly as
# the CPU reference executor does), lowers the neutral kernel-IR (`KernelProgram`) and SPIR-V/GLSL shader
# payloads to WGSL host-side via naga, and runs them on a real GPU/adapter (here: the software Vulkan
# device, lavapipe, headless). It is the "conformance on wgpu" DoD: the SAME frozen conformance suite the
# CPU oracle runs, but with real SPIR-V/WGSL shaders EXECUTING on the device.
#
[package]
name = "hl-gpu-wgpu"
version = "0.1.0"
edition = "2021"
description = "wgpu + naga host executor implementing hl_gpu::runtime::port::GpuExecutor — the cross-platform (Vulkan/lavapipe now, Metal/DX later) real-shader-executing backend + wgpu conformance."
license = "MIT"

[lib]
name = "hl_gpu_wgpu"
path = "src/lib.rs"

[dependencies]
# The protocol + runtime + GpuExecutor port this crate implements (pure-std, no platform deps).
hl_gpu = { package = "hl-gpu", path = "../hl-gpu" }
hl-design = { path = "../../packages/hl-design" }

# The real executor stack. wgpu 24 / naga 24 / pollster 0.4 — the versions the reference `hl-gpu-wgpu`
# proved. On Linux wgpu 24 auto-enables the Vulkan + GLES backends (they are target-gated, not cargo
# features) and WGSL is always compiled in, so default features suffice; the loader selects the lavapipe
# software Vulkan ICD headlessly at adapter-request time.
wgpu = "24"
# naga does all host-side shader translation: spv-in/wgsl-out lower SPIR-V graphics shaders to WGSL,
# glsl-in accepts the GLES path, wgsl-in/spv-out let the conformance test mint real SPIR-V from a WGSL
# seed (the round trip the SPIR-V ABI relies on).
naga = { version = "24", features = ["spv-in", "spv-out", "wgsl-in", "wgsl-out", "glsl-in"] }
pollster = "0.4"
bytemuck = "1"

# Tag-based logging + counters + timing. Zero-cost when off (verbose levels + counters/spans compile to
# `{}` in a default release build); instrumentation is gated at runtime by HL_LOG / HL_LOG_COUNTERS.
hl-log = { path = "../../packages/hl-log" }

# LINUX-ONLY, and the platform scope is the point. `hl-gl` is the guest GL surface crate; its build script
# CROSS-BUILDS the guest EGL/GLES shims as Linux shared objects, which needs a `*-linux-gnu` linker. On the
# macOS host that linker lives only inside the nix dev shell, so a single dev-dependency made EVERY test in
# this crate unbuildable on the host whenever that shell was unavailable — including tests with nothing to
# do with GL, such as the Metal-specific `nonfinite_predicates`. Scoping the dependency to Linux keeps the
# one test that uses it (`gl_fbo_orientation`, itself `#![cfg(target_os = "linux")]`) running exactly where
# it always ran, and lets every other test run on the host with no cross toolchain at all.
#
# Note the direction: this stays a DEV-dependency. `gpu` must not depend on `surface` in a shipped build,
# and the only reason the edge exists is that one integration test consumes the driver's lowering.
[target.'cfg(target_os = "linux")'.dev-dependencies]
hl-gl = { path = "../../surface/hl-gl" }

[target.'cfg(target_os = "macos")'.dependencies]
# The native presentation adapter imports an IOSurface-backed MTLTexture into wgpu. These are target-gated:
# the cross-platform executor and its SHM fallback do not carry Apple frameworks on other hosts.
hl-iosurface = { path = "../../packages/hl-iosurface" }
metal = "0.31"
