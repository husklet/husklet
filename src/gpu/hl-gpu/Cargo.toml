# hl-gpu — v2-layered rewrite of the hl-gpu GPU core. The `protocol` module ported here is
# wire-compatible with the shipping `hl-gpu` crate (same WIRE_VERSION, same tag numbers, same byte
# layout). It carries an EMPTY `[workspace]` table so it is a standalone workspace root, excluded from
# the shared repo workspace: codex's `cargo build` at the repo root never sees it. Build/test it with
#   cargo test --manifest-path hl-gpu/Cargo.toml
[package]
name = "hl-gpu"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# Downstream reads the stable protocol through `hl_gpu::protocol::…`.
name = "hl_gpu"
path = "src/lib.rs"

[dependencies]
# Unix-socket / SCM_RIGHTS fd transfer / ioctl / eventfd / futex for the `transport` adapter. The rest of
# the crate (protocol) stays dependency-free; libc is confined to `transport::adapter::unix`.
libc = "0.2"

# Tag-based logging + counters + timing spans. Provably zero-cost when off (gated by HL_LOG /
# HL_LOG_COUNTERS env), so instrumenting the hot path adds no runtime cost and no wire bytes.
hl-log = { path = "../../packages/hl-log" }
