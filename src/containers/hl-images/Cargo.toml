[package]
name = "hl-images"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "OCI content, registry, image, layer, snapshot, and rootfs primitives"
readme = "../../../README.md"

[dependencies]
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
flate2.workspace = true
futures-util.workspace = true
fs2.workspace = true
hl-fs = { path = "../../packages/hl-fs" }
hl-log = { path = "../../packages/hl-log" }
oci-spec.workspace = true
reflink-copy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync"] }
uuid = { workspace = true, features = ["v4"] }

# Unix-only for the same measured reason as `hl-container`'s copy: `nix` builds off Unix and
# resolves nothing there, so a plain entry states a portability the crate does not have. `fs` here
# is `fchmodat`/`fchownat`/`mknodat` and the layer-application mode and ownership bits.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["fs"] }

[target.'cfg(not(windows))'.dependencies]
oci-client = { workspace = true, features = ["rustls-tls"] }

# MinGW has no POSIX `sched.h`, which aws-lc's jitterentropy backend requires. Windows already
# supplies its native TLS and certificate store through Schannel, preserving registry TLS without
# compiling a Unix entropy source for the wrong host ABI.
[target.'cfg(windows)'.dependencies]
oci-client = { workspace = true, features = ["native-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
