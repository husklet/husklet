[package]
name = "hl-images"
version = "0.4.0"
edition = "2021"
description = "hl image handling: the OCI registry client (pull/push manifests + layers, auth, image refs). The home for image + rootfs building, kept separate from the runtime (hl-jit) and the daemon."
license = "MIT"

[lib]
name = "hl_images"
path = "src/lib.rs"

[dependencies]
# hl-images is runtime-agnostic: it produces a rootfs + arch/config; the CALLER hands the rootfs to a
# runtime (e.g. hl-jit). No dependency on any runtime crate.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-process sha256 (already in the workspace lock via hl-cli, so no new download offline). Replaces the
# former `sha256sum` subprocess for blob/config/cache digests — see src/image/digest.rs.
sha2 = "0.10"
# In-process gzip (pure-Rust miniz_oxide backend — no C zlib, offline-friendly). Replaces the former
# `gzip -dc` / `gzip -n` subprocesses in image/digest.rs (sha256_gz_file) + registry/layer.rs (tar_gzip).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
