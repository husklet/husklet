[package]
name = "hl-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
hl-log = { path = "../../packages/hl-log" }
hl-native = { path = "../../runtime/hl-native" }

[features]
native-test-hooks = ["hl-native/native-test-hooks"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
hl-native = { path = "../../runtime/hl-native", features = ["native-test-hooks"] }
hl-process = { path = "../../packages/hl-process" }
tempfile.workspace = true

[lib]
name = "hl_engine"
path = "src/lib.rs"
