hl-memory = { path = "../../runtime/hl-memory" }
hl-provider = { path = "../../runtime/hl-provider" }
hl-runtime = { path = "../../runtime/hl-runtime" }
hl-sync = { path = "../../runtime/hl-sync" }
hl-task = { path = "../../runtime/hl-task" }
hl-time = { path = "../../runtime/hl-time" }
