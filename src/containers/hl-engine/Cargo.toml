[package]
name = "hl-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[dependencies]
hl-checkpoint = { path = "../../runtime/hl-checkpoint" }
hl-descriptor = { path = "../../runtime/hl-descriptor" }
hl-network = { path = "../../runtime/hl-network" }
hl-execution = { path = "../../runtime/hl-execution" }
hl-fs = { path = "../../packages/hl-fs", default-features = false }
hl-event = { path = "../../runtime/hl-event" }
hl-isa = { path = "../../runtime/hl-isa" }
hl-ipc = { path = "../../runtime/hl-ipc" }
hl-loader = { path = "../../runtime/hl-loader" }
hl-log = { path = "../../packages/hl-log" }
hl-linux = { path = "../../runtime/hl-linux" }
hl-memory = { path = "../../runtime/hl-memory" }
hl-native = { path = "../../native" }
hl-provider = { path = "../../runtime/hl-provider" }
hl-runtime = { path = "../../runtime/hl-runtime" }
hl-sync = { path = "../../runtime/hl-sync" }
hl-task = { path = "../../runtime/hl-task" }
hl-time = { path = "../../runtime/hl-time" }
ring = "0.17.14"
zeroize = "1.9"
[dev-dependencies]
hl-fake-host = { path = "../../runtime/hl-fake-host" }
tempfile = "3"

[build-dependencies]
cc = "1.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"


[lib]
name = "hl_engine"
path = "src/lib.rs"

[features]
default = ["c-execution"]
# Counts host heap allocations per native crossing; see `native::allocations`.
alloc-count = []
# Production retained-C execution backend; build.rs admits only source-complete targets.
c-execution = ["hl-native/c-coexist"]
