[package]
name = "hl-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
hl-log = { path = "../../packages/hl-log" }
hl-native = { path = "../../runtime/hl-native" }
ring = "0.17.14"
zeroize = "1.9"
[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"


[lib]
name = "hl_engine"
path = "src/lib.rs"

[features]
default = []
# Counts host heap allocations per native crossing; see `native::allocations`.
alloc-count = []
# Kept as a source-compatible no-op while callers migrate to the unconditional native engine.
c-execution = []
