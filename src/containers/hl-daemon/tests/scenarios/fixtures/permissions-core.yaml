cases:
- id: permissions/mode-0644
  image: alpine:3.24.1
  run:
    shell: touch /f && chmod 0644 /f && ls -l /f | cut -c1-10
  expect:
    stdout_contains:
    - -rw-r--r--
- id: permissions/mode-0755
  image: alpine:3.24.1
  run:
    shell: touch /f && chmod 0755 /f && ls -l /f | cut -c1-10
  expect:
    stdout_contains:
    - -rwxr-xr-x
- id: permissions/mode-0600
  image: alpine:3.24.1
  run:
    shell: touch /f && chmod 0600 /f && ls -l /f | cut -c1-10
  expect:
    stdout_contains:
    - -rw-------
- id: permissions/mode-0777
  image: alpine:3.24.1
  run:
    shell: touch /f && chmod 0777 /f && ls -l /f | cut -c1-10
  expect:
    stdout_contains:
    - -rwxrwxrwx
- id: permissions/mode-0640
  image: alpine:3.24.1
  run:
    shell: touch /f && chmod 0640 /f && ls -l /f | cut -c1-10
  expect:
    stdout_contains:
    - -rw-r-----
- id: permissions/mode-0444
  image: alpine:3.24.1
  run:
    shell: touch /f && chmod 0444 /f && ls -l /f | cut -c1-10
  expect:
    stdout_contains:
    - -r--r--r--
- id: permissions/mode-suid-4755
  image: alpine:3.24.1
  run:
    shell: touch /f && chmod 4755 /f && ls -l /f | cut -c1-10
  expect:
    stdout_contains:
    - -rwsr-xr-x
- id: permissions/mode-suid-noexec-4644
  image: alpine:3.24.1
  run:
    shell: touch /f && chmod 4644 /f && ls -l /f | cut -c1-10
  expect:
    stdout_contains:
    - -rwSr--r--
- id: permissions/mode-sgid-2755
  image: alpine:3.24.1
  run:
    shell: touch /f && chmod 2755 /f && ls -l /f | cut -c1-10
  expect:
    stdout_contains:
    - -rwxr-sr-x
- id: permissions/mode-sgid-noexec-2644
  image: alpine:3.24.1
  run:
    shell: touch /f && chmod 2644 /f && ls -l /f | cut -c1-10
  expect:
    stdout_contains:
    - -rw-r-Sr--
- id: permissions/mode-sticky-1777
  image: alpine:3.24.1
  run:
    shell: mkdir /d && chmod 1777 /d && ls -ld /d | cut -c1-10
  expect:
    stdout_contains:
    - drwxrwxrwt
- id: permissions/mode-sticky-noother-1776
  image: alpine:3.24.1
  run:
    shell: mkdir /d && chmod 1776 /d && ls -ld /d | cut -c1-10
  expect:
    stdout_contains:
    - drwxrwxrwT
- id: permissions/stat-mode-A-0644
  image: alpine:3.24.1
  run:
    shell: touch /f && chmod 0644 /f && stat -c '%A' /f
  expect:
    stdout_contains:
    - -rw-r--r--
- id: permissions/chown-root
  image: alpine:3.24.1
  run:
    shell: touch /f && chown 0:0 /f && ls -l /f | awk '{print $3, $4}'
  expect:
    stdout_contains:
    - root root
- id: permissions/chown-named-daemon
  image: alpine:3.24.1
  run:
    shell: touch /f && chown daemon:daemon /f && ls -l /f | awk '{print $3, $4}'
  expect:
    stdout_contains:
    - daemon daemon
- id: permissions/chown-numeric-unknown
  image: alpine:3.24.1
  run:
    shell: touch /f && chown 12345:12345 /f && ls -l /f | awk '{print $3, $4}'
  expect:
    stdout_contains:
    - 12345 12345
- id: permissions/chown-stat-uid-gid
  image: alpine:3.24.1
  run:
    shell: touch /f && chown 1:1 /f && stat -c '%u:%g' /f
  expect:
    stdout_contains:
    - '1:1'
- id: permissions/type-dir
  image: alpine:3.24.1
  run:
    shell: mkdir /d && ls -ld /d | cut -c1
  expect:
    stdout_contains:
    - d
- id: permissions/type-symlink
  image: alpine:3.24.1
  run:
    shell: ln -s /etc/hostname /l && ls -l /l
  expect:
    stdout_contains:
    - lrwxrwxrwx
    - -> /etc/hostname
- id: permissions/type-fifo
  image: alpine:3.24.1
  run:
    shell: mkfifo /p && ls -l /p | cut -c1
  expect:
    stdout_contains:
    - p
- id: permissions/dev-null-majmin
  image: alpine:3.24.1
  run:
    shell: ls -l /dev/null | awk '{print $5, $6}'
  expect:
    stdout_contains:
    - 1, 3
- id: permissions/dev-zero-majmin
  image: alpine:3.24.1
  run:
    shell: ls -l /dev/zero | awk '{print $5, $6}'
  expect:
    stdout_contains:
    - 1, 5
- id: permissions/dev-full-majmin
  image: alpine:3.24.1
  run:
    shell: ls -l /dev/full | awk '{print $5, $6}'
  expect:
    stdout_contains:
    - 1, 7
- id: permissions/root-reads-0000
  image: alpine:3.24.1
  run:
    shell: touch /f && chmod 000 /f && cat /f >/dev/null 2>&1 && echo ROOT_READ_OK
  expect:
    stdout_contains:
    - ROOT_READ_OK
- id: permissions/nonexec-test-x
  image: alpine:3.24.1
  run:
    shell: touch /f && chmod 644 /f && { test -x /f && echo X || echo NOX; }
  expect:
    stdout_contains:
    - NOX
- id: permissions/copyup-chmod-lower
  image: alpine:3.24.1
  run:
    shell: chmod 600 /etc/hostname && stat -c '%a' /etc/hostname
  expect:
    stdout_contains:
    - '600'
- id: permissions/copyup-binary-perms
  image: alpine:3.24.1
  run:
    shell: cp /bin/busybox /b2 && ls -l /b2 | cut -c1-10
  expect:
    stdout_contains:
    - -rwxr-xr-x
