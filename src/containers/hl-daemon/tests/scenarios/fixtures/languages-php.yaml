cases:
  - id: languages/php-sum-82-cli
    image: php:8.2-cli
    run:
      argv: ["php", "-r", "echo array_sum(range(1,1000));"]
    expect:
      stdout_contains: ["500500"]

  - id: languages/php-fib-83-cli
    image: php:8.3-cli
    run:
      argv: ["php", "-r", "$a=0;$b=1;for($i=0;$i<50;$i++){$t=$a+$b;$a=$b;$b=$t;}echo $a;"]
    expect:
      stdout_contains: ["12586269025"]

  - id: languages/php-json-83-cli
    image: php:8.3-cli
    run:
      argv: ["php", "-r", "echo json_encode(['s'=>array_sum(range(1,1000))]);"]
    expect:
      stdout_contains: ['{"s":500500}']

  - id: languages/php-primes-82-cli
    image: php:8.2-cli
    run:
      argv: ["php", "-r", "$p=0;for($n=2;$n<10000;$n++){$q=1;for($d=2;$d*$d<=$n;$d++)if($n%$d==0){$q=0;break;}$p+=$q;}echo $p;"]
    expect:
      stdout_contains: ["1229"]

  - id: languages/php-strlen-repl-82-alpine
    image: php:8.2-cli-alpine
    run:
      shell: echo '<?php echo "LEN".strlen("hello");' | php
    expect:
      stdout_contains: ["LEN5"]
