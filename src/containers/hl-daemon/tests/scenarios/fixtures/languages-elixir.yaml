cases:
  - id: languages/elixir-sum-116-alpine
    image: elixir:1.16-alpine
    class: long
    run:
      argv: ["elixir", "-e", "IO.puts Enum.sum(1..1000)"]
    expect:
      stdout_contains: ["500500"]

  - id: languages/elixir-reduce-117
    image: elixir:1.17-otp-27
    class: long
    run:
      argv: ["elixir", "-e", "IO.puts(Enum.reduce(1..1000,0,&+/2))"]
    expect:
      stdout_contains: ["500500"]

  - id: languages/elixir-version-116
    image: elixir:1.16
    class: long
    run:
      shell: elixir --version | grep -o 'Elixir 1.16'
    expect:
      stdout_contains: ["Elixir 1.16"]
