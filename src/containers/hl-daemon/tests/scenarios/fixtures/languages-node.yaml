cases:
  - id: languages/node-sum-18-slim
    image: node:18-slim
    run:
      argv: ["node", "-e", "console.log([...Array(1000)].reduce((a,_,i)=>a+i+1,0))"]
    expect:
      stdout_contains: ["500500"]

  - id: languages/node-bigint-20-slim
    image: node:20-slim
    run:
      argv: ["node", "-e", "let a=0n,b=1n;for(let i=0;i<50;i++){[a,b]=[b,a+b]}console.log(a.toString())"]
    expect:
      stdout_contains: ["12586269025"]

  - id: languages/node-json-22-slim
    image: node:22-slim
    run:
      argv: ["node", "-e", "console.log(JSON.stringify({s:[...Array(1000)].reduce((a,_,i)=>a+i+1,0)}))"]
    expect:
      stdout_contains: ['{"s":500500}']

  - id: languages/node-add-18-alpine
    image: node:18-alpine
    run:
      argv: ["node", "-e", "console.log(1+2+3)"]
    expect:
      stdout_contains: ["6"]

  - id: languages/node-settimeout-22-alpine
    image: node:22-alpine
    run:
      argv: ["node", "-e", "setTimeout(()=>console.log('TICK'),50)"]
    expect:
      stdout_contains: ["TICK"]

  - id: languages/node-sync-22-alpine
    image: node:22-alpine
    run:
      argv: ["node", "-e", "console.log(1+1)"]
    expect:
      stdout_contains: ["2"]

  - id: languages/node-sort-20-alpine
    image: node:20-alpine
    run:
      argv: ["node", "-e", "console.log([3,1,2].sort().join(','))"]
    expect:
      stdout_contains: ["1,2,3"]

  - id: languages/node-version-repl-22-alpine
    image: node:22-alpine
    run:
      shell: echo "console.log('NODEMAJOR', process.version[0])" | node
    expect:
      stdout_contains: ["NODEMAJOR v"]

  - id: languages/node-primes-20-alpine
    image: node:20-alpine
    run:
      shell: node -e "let p=0;for(let n=2;n<10000;n++){let q=1;for(let d=2;d*d<=n;d++)if(n%d===0){q=0;break}p+=q}console.log('PRIMES',p)"
    expect:
      stdout_contains: ["PRIMES 1229"]

  - id: languages/node-fib-22-alpine
    image: node:22-alpine
    run:
      argv: ["node", "-e", "let a=0n,b=1n;for(let i=0;i<50;i++){[a,b]=[b,a+b]}console.log(a.toString())"]
    expect:
      stdout_contains: ["12586269025"]
  - id: languages/node-repl-eval-22-alpine
    image: node:22-alpine
    run:
      shell: 'printf ''console.log("R"+(6*7))

        .exit

        '' | node -i 2>&1 | grep -q ''R42'' && echo REPL_OK'
    expect:
      stdout_contains:
      - REPL_OK
  - id: languages/node-repl-perf-20-alpine
    image: node:20-alpine
    timeout: 25
    run:
      shell: 'printf ''1+1

        .exit

        '' | node -i >/dev/null 2>&1 && echo REPL_FAST'
    expect:
      stdout_contains:
      - REPL_FAST
