cases:
  - id: languages/dotnet-version-sdk8
    image: mcr.microsoft.com/dotnet/sdk:8.0
    class: long
    resources: [registry, disk_heavy]
    run:
      shell: |
        echo "SDK $(dotnet --version | cut -d. -f1)"
    expect:
      stdout_contains: ["SDK 8"]

  - id: languages/dotnet-sum-sdk8
    image: mcr.microsoft.com/dotnet/sdk:8.0
    class: long
    resources: [registry, disk_heavy]
    run:
      shell: |
        mkdir -p /app && cd /app
        dotnet new console -o . >/dev/null 2>&1
        cat > Program.cs <<'EOF'
        using System;
        using System.Linq;
        Console.WriteLine("NET " + Enumerable.Range(1, 1000).Sum());
        EOF
        dotnet run -c Release 2>/dev/null
    expect:
      stdout_contains: ["NET 500500"]

  - id: languages/dotnet-fib-sdk9
    image: mcr.microsoft.com/dotnet/sdk:9.0
    class: long
    resources: [registry, disk_heavy]
    run:
      shell: |
        mkdir -p /app && cd /app
        dotnet new console -o . >/dev/null 2>&1
        cat > Program.cs <<'EOF'
        using System;
        ulong a = 0;
        ulong b = 1;
        for (int i = 0; i < 50; i++)
        {
            ulong next = a + b;
            a = b;
            b = next;
        }
        Console.WriteLine("NETFIB " + a);
        EOF
        dotnet run -c Release 2>/dev/null
    expect:
      stdout_contains: ["NETFIB 12586269025"]

  - id: languages/dotnet-runtime-info-8
    image: mcr.microsoft.com/dotnet/runtime:8.0
    class: long
    resources: [registry]
    run:
      shell: |
        dotnet --info | grep -o 'Microsoft.NETCore.App 8'
    expect:
      stdout_contains: ["Microsoft.NETCore.App 8"]
