cases:
  - id: utilities/sha256-abc
    image: alpine:3.24.1
    run:
      shell: printf abc | sha256sum | cut -d' ' -f1
    expect:
      stdout_contains:
        - ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad

  - id: utilities/md5-abc
    image: alpine:3.24.1
    run:
      shell: printf abc | md5sum | cut -d' ' -f1
    expect:
      stdout_contains:
        - 900150983cd24fb0d6963f7d28e17f72

  - id: utilities/base64-encode
    image: alpine:3.24.1
    run:
      shell: printf dd | base64
    expect:
      stdout_contains:
        - ZGQ=

  - id: utilities/base64-roundtrip
    image: alpine:3.24.1
    run:
      shell: printf hello | base64 | base64 -d
    expect:
      stdout_contains:
        - hello

  - id: utilities/sort-numeric
    image: alpine:3.24.1
    run:
      shell: |-
        printf '3
        1
        2
        ' | sort -n | paste -sd, -
    expect:
      stdout_contains:
        - 1,2,3

  - id: utilities/tr-upper
    image: alpine:3.24.1
    run:
      shell: echo 'the quick brown' | tr a-z A-Z
    expect:
      stdout_contains:
        - THE QUICK BROWN

  - id: utilities/cut-field
    image: alpine:3.24.1
    run:
      shell: "echo a:b:c | cut -d: -f2"
    expect:
      stdout_contains:
        - b

  - id: utilities/grep-count
    image: alpine:3.24.1
    run:
      shell: |-
        printf 'foo
        bar
        foo
        ' | grep -c foo
    expect:
      stdout_contains:
        - '2'

  - id: utilities/sed-substitute
    image: alpine:3.24.1
    run:
      shell: echo abcabc | sed 's/a/X/g'
    expect:
      stdout_contains:
        - XbcXbc

  - id: utilities/head-tail
    image: alpine:3.24.1
    run:
      shell: seq 1 10 | head -3 | tail -1
    expect:
      stdout_contains:
        - '3'

  - id: utilities/wc-lines
    image: alpine:3.24.1
    run:
      shell: seq 1 100 | wc -l
    expect:
      stdout_contains:
        - '100'

  - id: utilities/wc-chars
    image: alpine:3.24.1
    run:
      shell: printf abc | wc -c
    expect:
      stdout_contains:
        - '3'

  - id: utilities/factor
    image: alpine:3.24.1
    run:
      shell: |-
        factor 500500 | tr ' ' '\n' | tail -n1
    expect:
      stdout_contains:
        - '13'

  - id: utilities/awk-squares
    image: alpine:3.24.1
    run:
      shell: |-
        awk 'BEGIN{for(i=1;i<=100;i++)s+=i*i;print s}'
    expect:
      stdout_contains:
        - '338350'

  - id: utilities/seq-awk-sum
    image: alpine:3.24.1
    run:
      shell: |-
        seq 1 1000 | awk '{s+=$1} END{print "SUM="s}'
    expect:
      stdout_contains:
        - SUM=500500

  - id: utilities/paste-bc
    image: alpine:3.24.1
    run:
      shell: seq 1 1000 | paste -sd+ - | bc
    expect:
      stdout_contains:
        - '500500'

  - id: utilities/sort-uniq-count
    image: alpine:3.24.1
    run:
      shell: |-
        printf 'b
        a
        c
        a
        b
        ' | sort | uniq -c | awk '{print $1$2}' | paste -sd, -
    expect:
      stdout_contains:
        - 2a,2b,1c

  - id: utilities/word-frequency
    image: alpine:3.24.1
    run:
      shell: |-
        printf 'apple
        banana
        apple
        cherry
        banana
        apple
        ' | sort | uniq -c | sort -rn | awk 'NR == 1 {print $2}'
    expect:
      stdout_contains:
        - apple

  - id: utilities/printf-hex
    image: alpine:3.24.1
    run:
      shell: printf '%x\n' 255
    expect:
      stdout_contains:
        - ff

  - id: utilities/printf-pad
    image: alpine:3.24.1
    run:
      shell: printf '%05d\n' 42
    expect:
      stdout_contains:
        - '00042'

  - id: utilities/arith-shift
    image: alpine:3.24.1
    run:
      shell: echo $((1 << 10))
    expect:
      stdout_contains:
        - '1024'

  - id: utilities/arith-mod
    image: alpine:3.24.1
    run:
      shell: echo $((17 % 5))
    expect:
      stdout_contains:
        - '2'

  - id: utilities/param-length
    image: alpine:3.24.1
    run:
      shell: s=hello; echo ${#s}
    expect:
      stdout_contains:
        - '5'

  - id: utilities/param-suffix-strip
    image: alpine:3.24.1
    run:
      shell: f=archive.tar.gz; echo ${f%.gz}
    expect:
      stdout_contains:
        - archive.tar

  - id: utilities/proc-version-linux
    image: alpine:3.24.1
    run:
      shell: head -c5 /proc/version
    expect:
      stdout_contains:
        - Linux

  - id: utilities/id-root
    image: alpine:3.24.1
    run:
      shell: id -u
    expect:
      stdout_contains:
        - '0'

  - id: utilities/uname-linux
    image: alpine:3.24.1
    run:
      shell: uname -s
    expect:
      stdout_contains:
        - Linux

  - id: utilities/seq-separator
    image: alpine:3.24.1
    run:
      shell: seq -s, 1 5
    expect:
      stdout_contains:
        - 1,2,3,4,5

  - id: utilities/tr-delete-digits
    image: alpine:3.24.1
    run:
      shell: echo a1b2c3 | tr -d 0-9
    expect:
      stdout_contains:
        - abc

  - id: utilities/rev-string
    image: alpine:3.24.1
    run:
      shell: echo abc | rev
    expect:
      stdout_contains:
        - cba

  - id: utilities/od-hex-byte
    image: alpine:3.24.1
    run:
      shell: printf A | od -An -tx1 | tr -d ' '
    expect:
      stdout_contains:
        - '41'

  - id: utilities/xargs-count
    image: alpine:3.24.1
    run:
      shell: echo 1 2 3 4 | xargs -n1 | wc -l
    expect:
      stdout_contains:
        - '4'

  - id: utilities/grep-only-count
    image: alpine:3.24.1
    run:
      shell: echo foobar | grep -o o | wc -l
    expect:
      stdout_contains:
        - '2'

  - id: utilities/sed-print-line
    image: alpine:3.24.1
    run:
      shell: |-
        printf 'a
        b
        c
        ' | sed -n 2p
    expect:
      stdout_contains:
        - b

  - id: utilities/awk-field-sep
    image: alpine:3.24.1
    run:
      shell: echo a,b,c | awk -F, '{print $2}'
    expect:
      stdout_contains:
        - b

  - id: utilities/trap-exit
    image: alpine:3.24.1
    run:
      shell: trap 'echo trapped' EXIT; true
    expect:
      stdout_contains:
        - trapped

  - id: utilities/exit-code-capture
    image: alpine:3.24.1
    run:
      shell: sh -c 'exit 3'; echo rc=$?
    expect:
      stdout_contains:
        - rc=3

  - id: utilities/expr-length
    image: alpine:3.24.1
    run:
      shell: expr length abcde
    expect:
      stdout_contains:
        - '5'

  - id: utilities/proc-self-comm
    image: alpine:3.24.1
    run:
      shell: cat /proc/self/comm
    expect:
      stdout_contains:
        - cat

  - id: utilities/proc-meminfo
    image: alpine:3.24.1
    run:
      shell: grep -q MemTotal /proc/meminfo && echo mem-ok
    expect:
      stdout_contains:
        - mem-ok

  - id: utilities/proc-mounts-root
    image: alpine:3.24.1
    run:
      shell: awk '$2=="/"{print "root-fs"; exit}' /proc/mounts
    expect:
      stdout_contains:
        - root-fs

  - id: utilities/proc-uptime
    image: alpine:3.24.1
    run:
      shell: awk '{print ($1>=0)?"up-ok":"bad"}' /proc/uptime
    expect:
      stdout_contains:
        - up-ok

  - id: utilities/proc-cpuinfo
    image: alpine:3.24.1
    run:
      shell: awk '/^processor/{c++}END{print (c>=1)?"cpu-ok":"none"}' /proc/cpuinfo
    expect:
      stdout_contains:
        - cpu-ok

  - id: utilities/proc-stat-cpu
    image: alpine:3.24.1
    run:
      shell: grep -q '^cpu ' /proc/stat && echo stat-ok
    expect:
      stdout_contains:
        - stat-ok

  - id: utilities/sys-kernel-ostype
    image: alpine:3.24.1
    run:
      shell: cat /proc/sys/kernel/ostype
    expect:
      stdout_contains:
        - Linux

  - id: utilities/tail-plus
    image: alpine:3.24.1
    run:
      shell: seq 1 5 | tail -n +3 | head -1
    expect:
      stdout_contains:
        - '3'

  - id: utilities/cut-chars
    image: alpine:3.24.1
    run:
      shell: echo abcdef | cut -c2-4
    expect:
      stdout_contains:
        - bcd

  - id: utilities/comm-common
    image: alpine:3.24.1
    run:
      shell: printf 'a\nb\nc\n' >/tmp/cx; printf 'b\nc\nd\n' >/tmp/cy; comm -12 /tmp/cx /tmp/cy | paste -sd, -
    expect:
      stdout_contains:
        - b,c

  - id: utilities/fold-width
    image: alpine:3.24.1
    run:
      shell: echo abcdef | fold -w2 | wc -l
    expect:
      stdout_contains:
        - '3'

  - id: utilities/nl-number
    image: alpine:3.24.1
    run:
      shell: printf 'x\ny\n' | nl | awk 'NR==2{print $1}'
    expect:
      stdout_contains:
        - '2'

  - id: utilities/tac-reverse
    image: alpine:3.24.1
    run:
      shell: printf '1\n2\n3\n' | tac | paste -sd, -
    expect:
      stdout_contains:
        - 3,2,1

  - id: utilities/wc-words
    image: alpine:3.24.1
    run:
      shell: echo 'one two three' | wc -w
    expect:
      stdout_contains:
        - '3'

  - id: utilities/sha1-abc
    image: alpine:3.24.1
    run:
      shell: printf abc | sha1sum | cut -d' ' -f1
    expect:
      stdout_contains:
        - a9993e364706816aba3e25717850c26c9cd0d89d

  - id: utilities/sha512-abc
    image: alpine:3.24.1
    run:
      shell: printf abc | sha512sum | cut -d' ' -f1
    expect:
      stdout_contains:
        - ddaf35a193617aba

  - id: utilities/cksum-abc
    image: alpine:3.24.1
    run:
      shell: printf abc | cksum
    expect:
      stdout_contains:
        - '1219131554'

  - id: utilities/sort-reverse
    image: alpine:3.24.1
    run:
      shell: printf '1\n2\n3\n' | sort -r | paste -sd, -
    expect:
      stdout_contains:
        - 3,2,1

  - id: utilities/umask-default
    image: alpine:3.24.1
    run:
      shell: umask
    expect:
      stdout_contains:
        - '0022'

  - id: utilities/printf-octal
    image: alpine:3.24.1
    run:
      shell: printf '%o\n' 8
    expect:
      stdout_contains:
        - '10'

  - id: utilities/printf-float
    image: alpine:3.24.1
    run:
      shell: printf '%.2f\n' 3.14159
    expect:
      stdout_contains:
        - '3.14'

  - id: utilities/getent-passwd-root
    image: alpine:3.24.1
    run:
      shell: "getent passwd root | cut -d: -f1"
    expect:
      stdout_contains:
        - root

  - id: utilities/dd-count-bs
    image: alpine:3.24.1
    run:
      shell: dd if=/dev/zero bs=1024 count=4 2>/dev/null | wc -c
    expect:
      stdout_contains:
        - '4096'

  - id: utilities/stat-size
    image: alpine:3.24.1
    run:
      shell: printf abc > /tmp/statz; stat -c %s /tmp/statz
    expect:
      stdout_contains:
        - '3'

  - id: utilities/stat-name
    image: alpine:3.24.1
    run:
      shell: stat -c %n /etc/passwd
    expect:
      stdout_contains:
        - /etc/passwd

  - id: utilities/find-type-name
    image: alpine:3.24.1
    run:
      shell: find /etc -maxdepth 1 -type f -name passwd
    expect:
      stdout_contains:
        - /etc/passwd

  - id: utilities/test-string-eq
    image: alpine:3.24.1
    run:
      shell: "[ abc = abc ] && echo eq"
    expect:
      stdout_contains:
        - eq

  - id: utilities/test-int-gt
    image: alpine:3.24.1
    run:
      shell: "[ 5 -gt 3 ] && echo yes"
    expect:
      stdout_contains:
        - yes

  - id: utilities/case-glob
    image: alpine:3.24.1
    run:
      shell: x=hello; case $x in hel*) echo match;; esac
    expect:
      stdout_contains:
        - match

  - id: utilities/while-read-loop
    image: alpine:3.24.1
    run:
      shell: printf 'a\nb\nc\n' | while read l; do echo L:$l; done | tail -1
    expect:
      stdout_contains:
        - L:c

  - id: utilities/getopts-flag
    image: alpine:3.24.1
    run:
      shell: "f(){ while getopts a: o; do echo $o=$OPTARG; done; }; f -a xyz"
    expect:
      stdout_contains:
        - a=xyz

  - id: utilities/env-clean
    image: alpine:3.24.1
    run:
      shell: env -i FOO=bar sh -c 'echo $FOO'
    expect:
      stdout_contains:
        - bar

  - id: utilities/readlink-canon
    image: alpine:3.24.1
    run:
      shell: readlink -f /etc/../etc/passwd
    expect:
      stdout_contains:
        - /etc/passwd

  - id: utilities/basename-suffix
    image: alpine:3.24.1
    run:
      shell: basename /usr/local/bin/foo.sh .sh
    expect:
      stdout_contains:
        - foo

  - id: utilities/dirname-path
    image: alpine:3.24.1
    run:
      shell: dirname /usr/local/bin/foo
    expect:
      stdout_contains:
        - /usr/local/bin

  - id: utilities/tr-class-lower
    image: alpine:3.24.1
    run:
      shell: echo 'Hello World' | tr '[:upper:]' '[:lower:]'
    expect:
      stdout_contains:
        - hello world

  - id: utilities/sort-field-numeric
    image: alpine:3.24.1
    run:
      shell: |-
        printf '3:a\n1:b\n2:c\n' | sort -t: -k1 -n | head -1
    expect:
      stdout_contains:
        - '1:b'

  - id: utilities/uniq-count
    image: alpine:3.24.1
    run:
      shell: printf 'a\na\nb\n' | uniq -c | awk 'NR==1{print $1}'
    expect:
      stdout_contains:
        - '2'

  - id: utilities/sed-range
    image: alpine:3.24.1
    run:
      shell: printf '1\n2\n3\n4\n' | sed -n '2,3p' | paste -sd, -
    expect:
      stdout_contains:
        - '2,3'

  - id: utilities/awk-nr-end
    image: alpine:3.24.1
    run:
      shell: printf 'a\nb\nc\n' | awk 'END{print NR}'
    expect:
      stdout_contains:
        - '3'

  - id: utilities/head-bytes
    image: alpine:3.24.1
    run:
      shell: printf abcdef | head -c3
    expect:
      stdout_contains:
        - abc

  - id: utilities/expr-multiply
    image: alpine:3.24.1
    run:
      shell: expr 6 '*' 7
    expect:
      stdout_contains:
        - '42'

  - id: utilities/expr-substr
    image: alpine:3.24.1
    run:
      shell: expr substr abcdef 2 3
    expect:
      stdout_contains:
        - bcd

  - id: utilities/test-file-exists
    image: alpine:3.24.1
    run:
      shell: "[ -e /etc/passwd ] && echo present"
    expect:
      stdout_contains:
        - present

  - id: utilities/sort-unique
    image: alpine:3.24.1
    run:
      shell: printf 'b\na\nb\n' | sort -u | paste -sd, -
    expect:
      stdout_contains:
        - 'a,b'

  - id: utilities/grep-extended
    image: alpine:3.24.1
    run:
      shell: echo abc123 | grep -oE '[0-9]+'
    expect:
      stdout_contains:
        - '123'

  - id: utilities/awk-gsub
    image: alpine:3.24.1
    run:
      shell: echo aaa | awk '{gsub(/a/,"b"); print}'
    expect:
      stdout_contains:
        - bbb

  - id: utilities/ubuntu-stat-format-size
    image: ubuntu:24.04
    run:
      shell: printf abcde > /tmp/sf; stat --format=%s /tmp/sf
    expect:
      stdout_contains:
        - '5'

  - id: utilities/ubuntu-stat-format-octal
    image: ubuntu:24.04
    run:
      shell: install -m 640 /dev/null /tmp/pf; stat --format=%a /tmp/pf
    expect:
      stdout_contains:
        - '640'

  - id: utilities/ubuntu-du-apparent-size
    image: ubuntu:24.04
    run:
      shell: printf 0123456789 > /tmp/du; du --apparent-size -b /tmp/du | cut -f1
    expect:
      stdout_contains:
        - '10'

  - id: utilities/ubuntu-numfmt-to-iec
    image: ubuntu:24.04
    run:
      shell: numfmt --to=iec 1048576
    expect:
      stdout_contains:
        - '1.0M'

  - id: utilities/ubuntu-numfmt-from-iec
    image: ubuntu:24.04
    run:
      shell: numfmt --from=iec 1K
    expect:
      stdout_contains:
        - '1024'

  - id: utilities/ubuntu-factor-semicolon
    image: ubuntu:24.04
    run:
      shell: factor 91
    expect:
      stdout_contains:
        - '91: 7 13'

  - id: utilities/ubuntu-seq-width
    image: ubuntu:24.04
    run:
      shell: seq -w 8 11 | paste -sd, -
    expect:
      stdout_contains:
        - '08,09,10,11'

  - id: utilities/ubuntu-sort-version
    image: ubuntu:24.04
    run:
      shell: printf '10\n9\n100\n' | sort --version-sort | paste -sd, -
    expect:
      stdout_contains:
        - '9,10,100'

  - id: utilities/ubuntu-nl-ba-blank
    image: ubuntu:24.04
    run:
      shell: printf 'x\n\ny\n' | nl -ba | awk 'NR==2{print $1}'
    expect:
      stdout_contains:
        - '2'

  - id: utilities/ubuntu-fmt-width
    image: ubuntu:24.04
    run:
      shell: printf 'aa bb cc dd ee ff\n' | fmt -w 8 | head -1
    expect:
      stdout_contains:
        - 'aa bb'

  - id: utilities/ubuntu-proc-maps-exec
    image: ubuntu:24.04
    run:
      shell: grep -q r-xp /proc/self/maps && echo maps-ok
    expect:
      stdout_contains:
        - 'maps-ok'

  - id: utilities/ubuntu-proc-status-vmrss
    image: ubuntu:24.04
    run:
      shell: grep -q VmRSS /proc/self/status && echo status-ok
    expect:
      stdout_contains:
        - 'status-ok'

  - id: utilities/ubuntu-proc-limits-nofile
    image: ubuntu:24.04
    run:
      shell: grep -q 'Max open files' /proc/self/limits && echo limits-ok
    expect:
      stdout_contains:
        - 'limits-ok'

  - id: utilities/ubuntu-proc-stat-comm
    image: ubuntu:24.04
    run:
      shell: cat /proc/self/stat | sed 's/.*(\(.*\)).*/\1/'
    expect:
      stdout_contains:
        - 'cat'

  - id: utilities/ubuntu-getconf-longbit
    image: ubuntu:24.04
    run:
      shell: getconf LONG_BIT
    expect:
      stdout_contains:
        - '64'

  - id: utilities/ubuntu-getconf-pagesize
    image: ubuntu:24.04
    run:
      shell: getconf PAGESIZE
    expect:
      stdout_contains:
        - '4096'

  - id: utilities/ubuntu-ldd-version-glibc
    image: ubuntu:24.04
    run:
      shell: ldd --version | head -1
    expect:
      stdout_contains:
        - 'GLIBC'

  - id: utilities/ubuntu-getent-group-root
    image: ubuntu:24.04
    run:
      shell: "getent group root | cut -d: -f1"
    expect:
      stdout_contains:
        - 'root'

  - id: utilities/ubuntu-date-epoch-zero
    image: ubuntu:24.04
    run:
      shell: date -u -d @0 +%Y-%m-%d
    expect:
      stdout_contains:
        - '1970-01-01'

  - id: utilities/ubuntu-date-parse-epoch
    image: ubuntu:24.04
    run:
      shell: date -u -d '2000-01-01 12:00:00' +%s
    expect:
      stdout_contains:
        - '946728000'

  - id: utilities/ubuntu-large-pipe-count
    image: ubuntu:24.04
    run:
      shell: seq 100000 | wc -l
    expect:
      stdout_contains:
        - '100000'

  - id: utilities/ubuntu-printf-many-args
    image: ubuntu:24.04
    run:
      shell: printf '%s+' 1 2 3 4 5; echo
    expect:
      stdout_contains:
        - '1+2+3+4+5+'

  - id: utilities/ubuntu-dd-copy-bytes
    image: ubuntu:24.04
    run:
      shell: dd if=/dev/zero bs=1000 count=5 2>/dev/null | wc -c
    expect:
      stdout_contains:
        - '5000'

  - id: utilities/ubuntu-iconv-roundtrip
    image: ubuntu:24.04
    run:
      shell: printf AAA | iconv -f ascii -t utf-16 | iconv -f utf-16 -t ascii
    expect:
      stdout_contains:
        - 'AAA'

  - id: utilities/ubuntu-truncate-size
    image: ubuntu:24.04
    run:
      shell: truncate -s 8192 /tmp/tr8; stat --format=%s /tmp/tr8
    expect:
      stdout_contains:
        - '8192'

  - id: utilities/deep-pipeline
    image: alpine:3.24.1
    run:
      shell: "seq 1 100 | cat | cat | cat | cat | cat | cat | cat | cat | wc -l"
    expect:
      stdout_contains:
        - "100"

  - id: utilities/xargs-parallel
    image: alpine:3.24.1
    run:
      shell: "seq 1 200 | xargs -P4 -n1 echo | wc -l"
    expect:
      stdout_contains:
        - "200"

  - id: utilities/subshell-fanout
    image: alpine:3.24.1
    run:
      shell: "(echo a & echo b & echo c & wait) | sort | paste -sd, -"
    expect:
      stdout_contains:
        - "a,b,c"

  - id: utilities/nested-subst
    image: alpine:3.24.1
    run:
      shell: "s=0; i=1; while [ $i -le 200 ]; do s=$(( $s + $(echo $i) )); i=$((i+1)); done; echo T=$s"
    expect:
      stdout_contains:
        - "T=20100"

  - id: utilities/trap-usr1
    image: alpine:3.24.1
    run:
