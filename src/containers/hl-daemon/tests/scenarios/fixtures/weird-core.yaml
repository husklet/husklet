cases:
- id: weird/auxval-hwcap
  image: gcc:latest
  class: long
  run:
    shell: |-
      cat > /m.c <<'CEOF'
      #include <stdio.h>
      #include <sys/auxv.h>
      int main(){
        unsigned long hw=getauxval(AT_HWCAP);   /* exercise AT_HWCAP read */
        unsigned long ps=getauxval(AT_PAGESZ);
        (void)hw;
        printf("AUXV=%lu\n", ps); return 0;
      }
      CEOF
      cc /m.c -O2 -o /m && /m
  expect:
    stdout_contains:
    - AUXV=4096
