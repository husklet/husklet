cases:
  - id: languages/python-sum-311-slim
    image: python:3.11-slim
    run:
      argv: ["python", "-c", "print(sum(range(1,1001)))"]
    expect:
      stdout_contains: ["500500"]

  - id: languages/python-fib-312-slim
    image: python:3.12-slim
    run:
      argv: ["python", "-c", "a,b=0,1\nfor _ in range(50):a,b=b,a+b\nprint(a)"]
    expect:
      stdout_contains: ["12586269025"]

  - id: languages/python-primes-313-slim
    image: python:3.13-slim
    run:
      argv: ["python", "-c", "print(sum(1 for n in range(2,10000) if all(n%d for d in range(2,int(n**.5)+1))))"]
    expect:
      stdout_contains: ["1229"]

  - id: languages/python-sum-312-alpine
    image: python:3.12-alpine
    run:
      argv: ["python", "-c", "print(sum(range(1,1001)))"]
    expect:
      stdout_contains: ["500500"]

  - id: languages/python-json-311-alpine
    image: python:3.11-alpine
    run:
      argv: ["python", "-c", "import json;print(json.dumps({'s':sum(range(1,1001))},sort_keys=True))"]
    expect:
      stdout_contains: ['{"s": 500500}']

  - id: languages/python-listcomp-313-alpine
    image: python:3.13-alpine
    run:
      argv: ["python", "-c", "print(len([x*x for x in range(1000)]))"]
    expect:
      stdout_contains: ["1000"]

  - id: languages/python-fib-313-alpine
    image: python:3.13-alpine
    run:
      argv: ["python", "-c", "a,b=0,1\nfor _ in range(50):a,b=b,a+b\nprint(a)"]
    expect:
      stdout_contains: ["12586269025"]

  - id: languages/python-sort-312-alpine
    image: python:3.12-alpine
    run:
      argv: ["python", "-c", "print(','.join(map(str,sorted([3,1,2]))))"]
    expect:
      stdout_contains: ["1,2,3"]

  - id: languages/python-bigint-repl-312-alpine
    image: python:3.12-alpine
    run:
      shell: echo 'print(2**100)' | python3
    expect:
      stdout_contains: ["1267650600228229401496703205376"]

  - id: languages/python-dictsum-312-slim
    image: python:3.12-slim
    run:
      argv: ["python", "-c", "d={i:i for i in range(1,1001)}\nprint('DICT', sum(d.values()))"]
    expect:
      stdout_contains: ["DICT 500500"]
