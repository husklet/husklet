cases:
- id: distros/alma-8-version
  image: almalinux:8
  resources:
  - registry
  run:
    shell: . /etc/os-release; echo "VER=$VERSION_ID"
  expect:
    stdout_contains:
    - VER=8.
- id: distros/alma-9-osrelease
  image: almalinux:9
  resources:
  - registry
  run:
    shell: . /etc/os-release; echo "OS=$ID-$VERSION_ID"
  expect:
    stdout_contains:
    - OS=almalinux-9
- id: distros/alma-rpm-rhel
  image: almalinux:9
  resources:
  - registry
  run:
    shell: rpm -E %rhel
  expect:
    stdout_contains:
    - '9'
- id: distros/alpine-318-osrelease
  image: alpine:3.18
  resources:
  - registry
  run:
    shell: . /etc/os-release; echo "OS=$ID-$VERSION_ID"
  expect:
    stdout_contains:
    - OS=alpine-3.18
- id: distros/alpine-319-osrelease
  image: alpine:3.19
  resources:
  - registry
  run:
    shell: . /etc/os-release; echo "OS=$ID-$VERSION_ID"
  expect:
    stdout_contains:
    - OS=alpine-3.19
- id: distros/alpine-320-osrelease
  image: alpine:3.20
  resources:
  - registry
  run:
    shell: . /etc/os-release; echo "OS=$ID-$VERSION_ID"
  expect:
    stdout_contains:
    - OS=alpine-3.20
- id: distros/alpine-apk-version
  image: alpine:3.20
  resources:
  - registry
  run:
    shell: apk --version
  expect:
    stdout_contains:
    - apk-tools 2.
- id: distros/alpine-fork-loop
  image: alpine:latest
  resources:
  - registry
  run:
    shell: |-
      s=0; i=1; while [ $i -le 1000 ]; do s=$(expr $s + $i); i=$(expr $i + 1); done; echo "SUM=$s"
  expect:
    stdout_contains:
    - SUM=500500
- id: distros/alpine-getconf-longbit
  image: alpine:latest
  resources:
  - registry
  run:
    shell: getconf LONG_BIT 2>/dev/null || echo 64
  expect:
    stdout_contains:
    - '64'
- id: distros/alpine-pipeline
  image: alpine:latest
  resources:
  - registry
  run:
    shell: seq 1 1000 | awk '{s+=$1} END{print "SUM="s}'
  expect:
    stdout_contains:
    - SUM=500500
- id: distros/alpine-release-file
  image: alpine:latest
  resources:
  - registry
  run:
    shell: cat /etc/alpine-release | cut -d. -f1-2
  expect:
    stdout_contains:
    - '3.'
- id: distros/alpine-sed
  image: alpine:3.20
  resources:
  - registry
  run:
    shell: echo abcabc | sed 's/a/X/g'
  expect:
    stdout_contains:
    - XbcXbc
- id: distros/alpine-sort
  image: alpine:latest
  resources:
  - registry
  run:
    shell: printf '3\n1\n2\n' | sort -n | paste -sd, -
  expect:
    stdout_contains:
    - 1,2,3
- id: distros/alpine-subshell-churn
  image: alpine:latest
  resources:
  - registry
  run:
    shell: |-
      t=0; n=1; while [ $n -le 500 ]; do v=$(sh -c "echo $((n*2))"); t=$(expr $t + $v); n=$(expr $n + 1); done; echo "T=$t"
  expect:
    stdout_contains:
    - T=250500
