- id: distros/busybox-pipe
  image: busybox:latest
  resources:
  - registry
  run:
    argv:
    - sh
    - -c
    - seq 1 1000 | awk '{s+=$1}END{print s}'
  expect:
    stdout_contains:
    - '500500'
- id: distros/debian-apt-update
  image: debian:bookworm-slim
  class: long
  resources:
  - disk_heavy
  - network
  - registry
  run:
    shell: |-
      apt-get -o Acquire::Retries=3 update
      find /var/lib/apt/lists -maxdepth 1 -type f -name '*Release' -print -quit | grep -q .
      echo APT_UPDATE_OK
  expect:
    stdout_contains:
    - APT_UPDATE_OK
- id: distros/debian-awk-squares
  image: debian:bookworm
  resources:
  - registry
  run:
    shell: awk 'BEGIN{for(i=1;i<=100;i++)s+=i*i; print s}'
  expect:
    stdout_contains:
    - '338350'
