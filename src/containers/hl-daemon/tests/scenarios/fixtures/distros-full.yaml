- id: distros/busybox-arith
  image: busybox:latest
  resources:
  - registry
  run:
    argv:
    - sh
    - -c
    - echo $((333*3))
  expect:
    stdout_contains:
    - '999'
- id: distros/busybox-banner
  image: busybox:latest
  resources:
  - registry
  run:
    shell: busybox | head -1
  expect:
    stdout_contains:
    - BusyBox v1.
- id: distros/busybox-fork-loop
  image: busybox:latest
