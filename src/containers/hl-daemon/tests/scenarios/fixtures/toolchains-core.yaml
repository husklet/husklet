- id: toolchains/go-121-alpine-sum
  image: golang:1.21-alpine
  timeout: 180
  class: long
  resources:
  - process_heavy
  run:
    shell: 'export GOCACHE=/tmp/gocache GOMAXPROCS=1 GOFLAGS=''-mod=mod -p=1''

      cat > /m.go <<''EOF''

      package main

      import "fmt"

      func main(){ s:=0; for i:=1;i<=1000;i++{ s+=i }; fmt.Printf("R=%d\n", s) }

      EOF

      go run /m.go'
  expect:
    stdout_contains:
    - R=500500
