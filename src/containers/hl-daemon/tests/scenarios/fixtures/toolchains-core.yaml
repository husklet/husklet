cases:
- id: toolchains/alpine-cc-fib
  image: gcc:14
  timeout: 180
  resources:
  - process_heavy
  run:
    shell: 'cat > /m.c <<''EOF''

      #include <stdio.h>

      int main(void){ unsigned long long a=0,b=1; for(int i=0;i<50;i++){unsigned long long t=a+b;a=b;b=t;} printf("R=%llu\n",a); return 0; }

      EOF

      cc -O2 /m.c -o /m && /m'
  expect:
    stdout_contains:
    - R=12586269025
- id: toolchains/alpine-cc-sum
  image: gcc:14
  timeout: 180
  resources:
  - process_heavy
  run:
    shell: 'cat > /m.c <<''EOF''

      #include <stdio.h>

      int main(void){ long s=0; for(long i=1;i<=1000;i++) s+=i; printf("R=%ld\n", s); return 0; }

      EOF

      cc -O2 /m.c -o /m && /m'
  expect:
    stdout_contains:
    - R=500500
- id: toolchains/alpine-cmake-c
  image: silkeh/clang:18
  timeout: 180
  resources:
  - process_heavy
  run:
    shell: 'mkdir -p /p && cd /p

      cat > m.c <<''EOF''

      #include <stdio.h>

      int main(void){ long s=0; for(long i=1;i<=1000;i++) s+=i; printf("R=%ld\n", s); return 0; }

      EOF

      cat > CMakeLists.txt <<''EOF''

      cmake_minimum_required(VERSION 3.10)

      project(dd C)

      add_executable(m m.c)

      EOF

      cmake -S . -B b && cmake --build b && ./b/m'
  expect:
    stdout_contains:
    - R=500500
- id: toolchains/alpine-gxx-stl
  image: gcc:14
  timeout: 180
  resources:
  - process_heavy
  run:
    shell: 'cat > /m.cpp <<''EOF''

      #include <iostream>

      #include <numeric>

      #include <vector>

      int main(){ std::vector<long> v(1000); std::iota(v.begin(),v.end(),1); std::cout << "R=" << std::accumulate(v.begin(),v.end(),0L) << "\n"; }

      EOF

      g++ -O2 /m.cpp -o /m && /m'
  expect:
    stdout_contains:
    - R=500500
- id: toolchains/alpine-no-cc
  image: alpine:latest
  timeout: 120
  run:
    shell: command -v gcc || echo NO-CC
  expect:
    stdout_contains:
    - NO-CC
