[package]
name = "hl-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Docker-compatible server over hl-container"
readme = "../../../README.md"

# Every integration test here drives `Daemon`, which the `runtime` feature gates,
# so every one of them needs that feature declared. Only `daemon-api` used to say
# so; the other seven simply failed to build, and
# `cargo check -p hl-daemon --no-default-features --all-targets` stopped at
# `error[E0432]: unresolved import hl_daemon::Daemon`.
#
# Narrowing a test target is normally the wrong repair, because it removes the
# target from runs that used to reach it. It removes nothing here: `runtime` is a
# DEFAULT feature, so every invocation that does not pass `--no-default-features`
# already has it on and runs all eight targets exactly as before. The only
# configuration these lines change is the one where the targets did not compile.
#
# `runtime` stays optional because it is genuinely load-bearing that it is:
# `hl-client`'s library depends on this crate with `default-features = false` and
# re-exports ~90 wire model types out of `hl_daemon::api`. Deleting the feature
# would pull axum, hyper, reqwest, tokio and hl-container into every client build
# for types that need none of them.
#
# THE HAZARD THIS CREATES, for whoever changes `default` next: Cargo skips a
# target whose required features are unmet WITHOUT PRINTING ANYTHING. Seven suites
# are now one manifest edit away from disappearing in silence. They are safe only
# while `runtime` remains in `default`. If you take it out, these seven need a
# `--features runtime` invocation somewhere or they stop being run at all.
[[test]]
name = "builtin_network"
path = "tests/builtin_network.rs"
required-features = ["runtime"]

[[test]]
name = "container_export"
path = "tests/container_export.rs"
required-features = ["runtime"]

[[test]]
name = "container_size"
path = "tests/container_size.rs"
required-features = ["runtime"]

[[test]]
name = "daemon-api"
path = "tests/daemon_api.rs"
required-features = ["runtime"]

[[test]]
name = "disk_query"
path = "tests/disk_query.rs"
required-features = ["runtime"]

[[test]]
name = "network_prune"
path = "tests/network_prune.rs"
required-features = ["runtime"]

[[test]]
name = "system_disk"
path = "tests/system_disk.rs"
required-features = ["runtime"]

[[test]]
name = "workflow_orchestration"
path = "tests/workflow_orchestration.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
runtime = [
    "dep:axum",
    "dep:base64",
    "dep:bytes",
    "dep:chrono",
    "dep:futures-util",
    "dep:flate2",
    "dep:hl-container",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:regex",
    "dep:reqwest",
    "dep:tempfile",
    "dep:sha2",
    "dep:tar",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tower",
]

[dependencies]
axum = { version = "0.7", features = ["json"], optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
hl-container = { version = "0.1.0", path = "../hl-container", optional = true }
hl-design = { path = "../../packages/hl-design" }
hl-images = { version = "0.1.0", path = "../hl-images" }
hl-log = { path = "../../packages/hl-log" }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, features = ["http1", "server"], optional = true }
hyper-util = { workspace = true, features = ["http1", "server", "tokio"], optional = true }
regex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync"], optional = true }
tokio-util = { workspace = true, features = ["io"], optional = true }
tower = { workspace = true, features = ["util"], optional = true }

[dev-dependencies]
flate2.workspace = true
hl-client = { path = "../hl-client" }
hl-container = { path = "../hl-container" }
hl-images = { path = "../hl-images" }
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
