[package]
name = "hl-container"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Headless Linux container lifecycle built on hl-engine"
readme = "../../../README.md"

[dependencies]
async-trait.workspace = true
hl-engine = { path = "../hl-engine", default-features = false }
hl-fs = { path = "../../packages/hl-fs" }
hl-images = { version = "0.1.0", path = "../hl-images" }
hl-log = { path = "../../packages/hl-log" }
hl-vfs = { path = "../../runtime/hl-vfs" }
nix = { version = "0.30", features = ["fs", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
flate2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[features]
default = ["c-execution"]
# The product container path owns the retained-C execution capability explicitly;
# Rust execution remains available only to differential tooling that requests it.
c-execution = ["hl-engine/c-execution"]

[lints]
workspace = true
