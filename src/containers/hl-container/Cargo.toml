[package]
name = "hl-container"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Headless Linux container lifecycle built on hl-engine"
readme = "../../../README.md"

[dependencies]
async-trait.workspace = true
fs2.workspace = true
hl-engine = { path = "../hl-engine", default-features = false }
hl-fs = { path = "../../packages/hl-fs" }
hl-images = { version = "0.1.0", path = "../hl-images" }
hl-log = { path = "../../packages/hl-log" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

# MEASURED, because this crate's own `checkpoint/directory.rs` used to record the opposite:
# `nix` 0.30.1 DOES build for `x86_64-pc-windows-gnu`. Every one of its modules is gated on
# `target_os`, so it builds to an empty crate there and `nix::sys` / `nix::unistd` simply do not
# resolve. A plain `[dependencies]` entry therefore costs a Windows dependency edge that can never
# carry an item, and hides the platform statement from anyone reading the manifest. Declared here
# instead: `dir`, `fs` and `signal` are `openat`/`fstatat`/`renameat`/`kill`, which is a POSIX
# surface and nothing else.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["dir", "fs", "signal"] }

[dev-dependencies]
flate2.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
