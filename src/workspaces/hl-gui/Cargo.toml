[package]
name = "hl-gui"
version = "0.4.0"
edition = "2021"
description = "Toolkit-neutral, configuration-driven GUI components and typed interaction events for Husklet applications."
license = "MIT"

[lib]
name = "hl_gui"
path = "src/lib.rs"

# The catalogue a playground reads. It writes its JSON by hand so that
# describing the library to another language costs the library no dependency.
[[bin]]
name = "catalogue"
path = "src/bin/catalogue.rs"

# Serialization is optional and off by default: the library stays dependency
# free for an embedding application that renders in-process, and gains a wire
# representation only when something actually needs to send an interface.
[features]
default = []
wire = ["dep:serde"]

[dependencies]
serde = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
