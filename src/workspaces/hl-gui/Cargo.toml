[package]
name = "hl-gui"
version = "0.4.0"
edition = "2021"
description = "Toolkit-neutral, configuration-driven GUI components and typed interaction events for Husklet applications."
license = "MIT"

[lib]
name = "hl_gui"
path = "src/lib.rs"

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_10"], optional = true }

[features]
gtk = ["dep:gtk"]
