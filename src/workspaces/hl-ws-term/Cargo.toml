[package]
name = "hl-ws-term"
version = "0.1.0"
edition = "2021"
description = "hl-ws-term: the terminal primitive — a self-contained VT grid, input encoding, pane layout, and a CPU renderer (embedded bitmap font + PNG) — zero GPU/window/network deps so it is fully headless-testable. This is the workspace-agnostic terminal core (was hl-term core minus the workspace model)."
license = "MIT"

[lib]
name = "hl_ws_term"
path = "src/lib.rs"

# Deliberately depends ONLY on crates already vendored in this workspace's cargo cache (libc, bitflags):
# this Linux dev/test host cannot fetch new crates.io tarballs (TLS MITM blocks cargo downloads), and
# keeping the core dependency-free makes it buildable + testable + screenshottable here with no network.
# The GPU shell crate (winit + wgpu) pulls its heavier deps on the macOS build host; it uploads this
# crate's same embedded font atlas so ship == what the CPU renderer verifies.
[dependencies]
# The shared foundation: the terminal-interface (`PtyBackend`) + `Launcher` traits + the `Workspace`
# model. The edge points UP to the std-only leaf `hl-ws` (this crate implements those traits).
hl-ws = { path = "../hl-ws" }
hl-fs = { path = "../../packages/hl-fs", default-features = false }
bitflags = "2"

# `libc` is here and not in plain `[dependencies]` because this crate's ONLY use of it is
# `pty/local.rs` -- `posix_openpt`/`grantpt`/`unlockpt`/`ptsname` plus `fork`/`execvp`/`waitpid`.
# `libc` itself builds for `x86_64-pc-windows-gnu`, so a plain entry does not FAIL there; it
# silently offers a Windows CRT surface that has none of those symbols, and the 102 errors that
# produces land in `pty/local.rs` rather than at the dependency. Declaring the edge Unix-only puts
# the platform statement in the manifest, where `pty/mod.rs`'s `#[cfg(unix)] pub mod local;` can be
# read against it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
