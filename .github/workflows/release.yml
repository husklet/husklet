name: Release Husklet

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, in X.Y.Z form"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Release real-image gate
    uses: ./.github/workflows/smoke.yml
    secrets:
      HL_REGISTRY_USERNAME: ${{ secrets.HL_REGISTRY_USERNAME }}
      HL_REGISTRY_PASSWORD: ${{ secrets.HL_REGISTRY_PASSWORD }}

  native-linux-reproducibility:
    name: Native engine / Linux AMD64 reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an AMD64 Linux host
        run: test "$(uname -s)-$(uname -m)" = Linux-x86_64

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
        with:
          diagnostic-endpoint: ""

      - name: Cache the Nix development environment
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # This job carries no Cargo cache, so `CARGO_HOME` is empty when it starts and the
      # `--offline` step below cannot resolve a single dependency without this. Measured on
      # x86_64 with an empty `CARGO_HOME`: `error: no matching package named sha2 found`.
      - name: Fetch locked dependencies
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo fetch --locked

      - name: Verify Linux native shared-library reproducibility
        timeout-minutes: 10
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo test --locked --offline -p hl-native --test build_reproducibility --
          --ignored --exact native_shared_library_is_reproducible_across_out_directories

  react-package:
    name: Publish @husklet/react and @husklet/mcp
    needs: [smoke, native-linux-reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: extensions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and validate package version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
          else
            version="$MANUAL_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must have exact X.Y.Z form, got: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure Node for npm trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: extensions/package-lock.json

      - name: Install the locked package graph
        run: npm ci

      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.6.2

      - name: Test React source and packed-package consumer
        run: npm test --workspace @husklet/react

      - name: Test MCP source and packed strict consumer
        run: npm test --workspace @husklet/mcp

      - name: Bind both packages independently to the release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm pkg set "version=$RELEASE_VERSION" --workspace @husklet/react
          npm pkg set "version=$RELEASE_VERSION" --workspace @husklet/mcp
          npm pkg set "dependencies.@husklet/react=$RELEASE_VERSION" --workspace @husklet/mcp
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify and pack-test the exact package pair
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import react from './react/package.json' with { type: 'json' };
          import mcp from './mcp/package.json' with { type: 'json' };
          const expected = process.env.RELEASE_VERSION;
          for (const [name, actual] of [
            ['@husklet/react', react.version],
            ['@husklet/mcp', mcp.version],
            ['@husklet/mcp dependency on @husklet/react', mcp.dependencies['@husklet/react']],
          ]) {
            if (actual !== expected) throw new Error(`${name} is ${actual}, expected ${expected}`);
          }
          NODE
          npm run pack:check --workspace @husklet/react
          npm test --workspace @husklet/mcp
          npm pack --dry-run --ignore-scripts --workspace @husklet/react
          npm pack --dry-run --ignore-scripts --workspace @husklet/mcp

      - name: Publish React with npm trusted publishing
        run: npm publish --workspace @husklet/react --access public --provenance

      - name: Publish MCP with npm trusted publishing
        run: npm publish --workspace @husklet/mcp --access public --provenance

  react-extension-base:
    name: Publish React extension base / multi-architecture
    needs: [smoke, native-linux-reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and validate image version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
          else
            version="$MANUAL_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must have exact X.Y.Z form, got: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure multi-architecture builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish one multi-architecture manifest
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: extensions/react
          file: extensions/react/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/extension-react-base:${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true

  dmg:
    name: Signed and notarized DMG
    needs: [smoke, native-linux-reproducibility]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an Apple Silicon host
        run: |
          architecture="$(uname -m)"
          test "$architecture" = arm64 || {
            echo "Husklet releases require an arm64 macOS host, got: $architecture" >&2
            exit 1
          }

      - name: Resolve and validate version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == v* ]] || {
              echo "release tag must start with v" >&2
              exit 1
            }
            version="${GITHUB_REF_NAME#v}"
          else
            version="$MANUAL_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must have X.Y.Z form, got: $version" >&2
            exit 1
          }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag and resolved version disagree" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Husklet $version"

      - name: Require release signing and notarization secrets
        env:
          P12_B64: ${{ secrets.HL_SIGN_P12_BASE64 }}
          P12_PW: ${{ secrets.HL_SIGN_P12_PW }}
          NOTARY_APPLE_ID: ${{ secrets.HL_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.HL_NOTARY_TEAM_ID }}
          NOTARY_PW: ${{ secrets.HL_NOTARY_PW }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$P12_B64" ]] || missing+=(HL_SIGN_P12_BASE64)
          [[ -n "$P12_PW" ]] || missing+=(HL_SIGN_P12_PW)
          [[ -n "$NOTARY_APPLE_ID" ]] || missing+=(HL_NOTARY_APPLE_ID)
          [[ -n "$NOTARY_TEAM_ID" ]] || missing+=(HL_NOTARY_TEAM_ID)
          [[ -n "$NOTARY_PW" ]] || missing+=(HL_NOTARY_PW)
          if (( ${#missing[@]} )); then
            printf 'release requires secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
        with:
          diagnostic-endpoint: ""

      - name: Cache the Nix development environment
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Cargo build products
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: husklet-release

      # `Swatinem/rust-cache` restores nothing on a cache miss -- a new `shared-key`, an
      # evicted entry, or the first release after a `Cargo.lock` change -- and the step below
      # is `--offline`. Without this fetch it fails at dependency resolution rather than at
      # the property it is meant to prove.
      - name: Fetch locked dependencies
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo fetch --locked

      # This expensive package gate intentionally stays out of the default test suite.
      # Releases must prove that two independent OUT_DIR trees produce the same dylib.
      - name: Verify native shared-library reproducibility
        timeout-minutes: 10
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo test --locked --offline -p hl-native --test build_reproducibility --
          --ignored --exact native_shared_library_is_reproducible_across_out_directories

      - name: Configure Developer ID signing and notarization
        env:
          P12_B64: ${{ secrets.HL_SIGN_P12_BASE64 }}
          P12_PW: ${{ secrets.HL_SIGN_P12_PW }}
          NOTARY_APPLE_ID: ${{ secrets.HL_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.HL_NOTARY_TEAM_ID }}
          NOTARY_PW: ${{ secrets.HL_NOTARY_PW }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/husklet-sign.keychain-db"
          keychain_password="$(uuidgen)"
          p12="$RUNNER_TEMP/husklet-signing.p12"
          printf '%s' "$P12_B64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/developer-id-g2.cer"
          security import "$RUNNER_TEMP/developer-id-g2.cer" -k "$keychain"
          identity="$(
            security find-identity -v -p codesigning "$keychain" |
              awk -F'"' '/Developer ID Application/{print $2; exit}'
          )"
          [[ -n "$identity" ]] || {
            echo "the signing archive contains no Developer ID Application identity" >&2
            exit 1
          }
          {
            echo "HL_SIGN_ID=$identity"
            echo "HL_SIGN_KEYCHAIN=$keychain"
            echo "HL_SIGN_KEYCHAIN_PW=$keychain_password"
            echo "HL_NOTARY_APPLE_ID=$NOTARY_APPLE_ID"
            echo "HL_NOTARY_TEAM_ID=$NOTARY_TEAM_ID"
            echo "HL_NOTARY_PW=$NOTARY_PW"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple Husklet
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # SC2016: the single quotes are the point. `$PWD` and `$RELEASE_VERSION` must be
          # expanded by the inner `bash` inside the dev shell, not by this runner shell --
          # `$PWD` because `nix develop` is what establishes the directory the bundle is
          # built in, and `$RELEASE_VERSION` because it reaches the inner shell through the
          # step's own `env:` block.
          # shellcheck disable=SC2016
          nix --extra-experimental-features 'nix-command flakes' develop . --command \
            bash -euo pipefail -c '
              export CARGO_TARGET_DIR="$PWD/target-macos"
              export HL_BUNDLE_TARGET="$PWD/target"
              export HL_VERSION="$RELEASE_VERSION"
              src/apps/husklet/package/bundle.sh "$RELEASE_VERSION" com.husklet.app
              src/apps/husklet/package/make-dmg.sh "$RELEASE_VERSION"
            '

      - name: Verify the distributable
        id: artifact
        run: |
          set -euo pipefail
          dmg="$PWD/target/dist/Husklet.dmg"
          checksum="$dmg.sha256"
          [[ -s "$dmg" ]] || {
            echo "missing Husklet DMG: $dmg" >&2
            exit 1
          }
          [[ -s "$checksum" ]] || {
            echo "missing Husklet checksum: $checksum" >&2
            exit 1
          }
          (cd "$(dirname "$dmg")" && shasum -a 256 -c "$(basename "$checksum")")
          /usr/bin/xcrun stapler validate "$dmg"

          mountpoint="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mountpoint" >/dev/null 2>&1 || true
            rmdir "$mountpoint" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "$dmg" >/dev/null
          app="$mountpoint/Husklet.app"
          [[ -d "$app" ]] || {
            echo "Husklet.app is absent from the DMG" >&2
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 |
            grep -q '^Authority=Developer ID Application:'
          spctl --assess --type execute --verbose=2 "$app"

          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload the verified distributable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Husklet-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.artifact.outputs.dmg }}
            ${{ steps.artifact.outputs.checksum }}
          if-no-files-found: error

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Husklet ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.artifact.outputs.dmg }}
            ${{ steps.artifact.outputs.checksum }}
          body: |
            ## Husklet ${{ steps.version.outputs.version }}

            Configurable Linux workspaces on Apple Silicon Macs.

            Download `Husklet.dmg`, open it, and drag `Husklet.app` to Applications.
            The application and disk image are Developer ID signed, notarized, and stapled.
