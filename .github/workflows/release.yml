name: Release Husklet

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, in X.Y.Z form"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Release real-image gate
    uses: ./.github/workflows/smoke.yml

  dmg:
    name: Signed and notarized DMG
    needs: smoke
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an Apple Silicon host
        run: |
          architecture="$(uname -m)"
          test "$architecture" = arm64 || {
            echo "Husklet releases require an arm64 macOS host, got: $architecture" >&2
            exit 1
          }

      - name: Resolve and validate version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == v* ]] || {
              echo "release tag must start with v" >&2
              exit 1
            }
            version="${GITHUB_REF_NAME#v}"
          else
            version="$MANUAL_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must have X.Y.Z form, got: $version" >&2
            exit 1
          }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag and resolved version disagree" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Husklet $version"

      - name: Require release signing and notarization secrets
        env:
          P12_B64: ${{ secrets.HL_SIGN_P12_BASE64 }}
          P12_PW: ${{ secrets.HL_SIGN_P12_PW }}
          NOTARY_APPLE_ID: ${{ secrets.HL_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.HL_NOTARY_TEAM_ID }}
          NOTARY_PW: ${{ secrets.HL_NOTARY_PW }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$P12_B64" ]] || missing+=(HL_SIGN_P12_BASE64)
          [[ -n "$P12_PW" ]] || missing+=(HL_SIGN_P12_PW)
          [[ -n "$NOTARY_APPLE_ID" ]] || missing+=(HL_NOTARY_APPLE_ID)
          [[ -n "$NOTARY_TEAM_ID" ]] || missing+=(HL_NOTARY_TEAM_ID)
          [[ -n "$NOTARY_PW" ]] || missing+=(HL_NOTARY_PW)
          if (( ${#missing[@]} )); then
            printf 'release requires secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
        with:
          diagnostic-endpoint: ""

      - name: Cache the Nix development environment
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nix/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Cargo build products
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: husklet-release

      - name: Configure Developer ID signing and notarization
        env:
          P12_B64: ${{ secrets.HL_SIGN_P12_BASE64 }}
          P12_PW: ${{ secrets.HL_SIGN_P12_PW }}
          NOTARY_APPLE_ID: ${{ secrets.HL_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.HL_NOTARY_TEAM_ID }}
          NOTARY_PW: ${{ secrets.HL_NOTARY_PW }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/husklet-sign.keychain-db"
          keychain_password="$(uuidgen)"
          p12="$RUNNER_TEMP/husklet-signing.p12"
          printf '%s' "$P12_B64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$RUNNER_TEMP/developer-id-g2.cer"
          security import "$RUNNER_TEMP/developer-id-g2.cer" -k "$keychain"
          identity="$(
            security find-identity -v -p codesigning "$keychain" |
              awk -F'"' '/Developer ID Application/{print $2; exit}'
          )"
          [[ -n "$identity" ]] || {
            echo "the signing archive contains no Developer ID Application identity" >&2
            exit 1
          }
          {
            echo "HL_SIGN_ID=$identity"
            echo "HL_SIGN_KEYCHAIN=$keychain"
            echo "HL_SIGN_KEYCHAIN_PW=$keychain_password"
            echo "HL_NOTARY_APPLE_ID=$NOTARY_APPLE_ID"
            echo "HL_NOTARY_TEAM_ID=$NOTARY_TEAM_ID"
            echo "HL_NOTARY_PW=$NOTARY_PW"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple Husklet
        run: make dmg VERSION="${{ steps.version.outputs.version }}"

      - name: Verify the distributable
        id: artifact
        run: |
          set -euo pipefail
          dmg="$PWD/target/dist/Husklet.dmg"
          checksum="$dmg.sha256"
          [[ -s "$dmg" ]] || {
            echo "missing Husklet DMG: $dmg" >&2
            exit 1
          }
          [[ -s "$checksum" ]] || {
            echo "missing Husklet checksum: $checksum" >&2
            exit 1
          }
          (cd "$(dirname "$dmg")" && shasum -a 256 -c "$(basename "$checksum")")
          /usr/bin/xcrun stapler validate "$dmg"

          mountpoint="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mountpoint" >/dev/null 2>&1 || true
            rmdir "$mountpoint" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "$dmg" >/dev/null
          app="$mountpoint/Husklet.app"
          [[ -d "$app" ]] || {
            echo "Husklet.app is absent from the DMG" >&2
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 |
            grep -q '^Authority=Developer ID Application:'
          spctl --assess --type execute --verbose=2 "$app"

          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload the verified distributable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Husklet-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.artifact.outputs.dmg }}
            ${{ steps.artifact.outputs.checksum }}
          if-no-files-found: error

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Husklet ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.artifact.outputs.dmg }}
            ${{ steps.artifact.outputs.checksum }}
          body: |
            ## Husklet ${{ steps.version.outputs.version }}

            Configurable Linux workspaces on Apple Silicon Macs.

            Download `Husklet.dmg`, open it, and drag `Husklet.app` to Applications.
            The application and disk image are Developer ID signed, notarized, and stapled.
