name: Real-image smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      HL_REGISTRY_USERNAME:
        required: false
      HL_REGISTRY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-image:
    name: ${{ matrix.target }} / ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HL_SCENARIO_IMAGE_CACHE: ${{ github.workspace }}/.cache/oci-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm64
            name: Ubuntu 24.04
            case: distros/ubuntu-2404-osrelease
          - target: arm64
            name: Debian 12
            case: distros/debian-bookworm-osrelease
          - target: amd64
            name: Ubuntu 24.04
            case: distros/ubuntu-2404-osrelease
          - target: amd64
            name: Debian 12
            case: distros/debian-bookworm-osrelease
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an Apple Silicon host
        run: |
          architecture="$(uname -m)"
          test "$architecture" = arm64 || {
            echo "Husklet smoke tests require an arm64 macOS host, got: $architecture" >&2
            exit 1
          }

      - name: Restore the exact OCI fixture cache
        id: images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.HL_SCENARIO_IMAGE_CACHE }}
          key: >-
            oci-smoke-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{
            hashFiles(
              'Cargo.lock',
              'src/containers/hl-daemon/tests/scenarios/fixtures/distros-full.yaml',
              'src/containers/hl-daemon/tests/scenarios/harness/fixture.rs',
              'src/containers/hl-images/src/**'
            ) }}-${{ matrix.case }}

      - name: Select authenticated or exact-cache image access
        env:
          CACHE_HIT: ${{ steps.images.outputs.cache-hit }}
          REGISTRY_USERNAME: ${{ secrets.HL_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.HL_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$REGISTRY_USERNAME" && -n "$REGISTRY_PASSWORD" ]]; then
            if [[ "$CACHE_HIT" == true ]]; then
              echo "restored the exact OCI fixture cache; authenticated registry access can repair incomplete entries"
            else
              echo "exact OCI fixture cache missed; using authenticated registry access"
            fi
          elif [[ -n "$REGISTRY_USERNAME" || -n "$REGISTRY_PASSWORD" ]]; then
            echo "both HL_REGISTRY_USERNAME and HL_REGISTRY_PASSWORD are required" >&2
            exit 1
          elif [[ "$CACHE_HIT" == true ]]; then
            echo "restored the exact OCI fixture cache; anonymous registry access can repair incomplete entries"
          else
            echo "exact OCI fixture cache missed; using anonymous public registry access"
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
        with:
          diagnostic-endpoint: ""

      - name: Cache the Nix development environment
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Run the real image through the container runtime
        env:
          HL_REGISTRY_USERNAME: ${{ secrets.HL_REGISTRY_USERNAME }}
          HL_REGISTRY_PASSWORD: ${{ secrets.HL_REGISTRY_PASSWORD }}
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          set +e
          nix develop . --command \
            cargo test -p hl-daemon --test scenarios -- \
            all --jobs 1 --category distros \
            --case "${{ matrix.case }}" \
            --target "${{ matrix.target }}" 2>&1 | tee "$log_file"
          status="${PIPESTATUS[0]}"
          set -e
          if (( status != 0 )); then
            diagnostic="$(tail -n 120 "$log_file" | awk '{ print substr($0, 1, 500) }')"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Real-image smoke failed (exit $status)::$diagnostic"
          fi
          exit "$status"
