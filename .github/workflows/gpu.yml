name: GPU and GUI conformance

# The evidence that needs a real GPU, a real workspace and real guest applications. It runs on the
# self-hosted host because the hosted runners have no Husklet workspace, no guest packages and no proven
# Metal device; `ci.yml`'s `mac-crates` job carries everything that is device-free.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One GPU run at a time on the host: the ladder refuses to start against a workspace that already has a
  # live runtime, so queueing is correct and cancelling a half-run would leave a workspace up.
  group: gpu-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  device:
    name: Metal device tests
    runs-on: [self-hosted, macOS, ARM64, husklet-census]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an Apple Silicon host
        run: |
          architecture="$(uname -m)"
          test "$architecture" = arm64 || {
            echo "Husklet GPU tests require an arm64 macOS host, got: $architecture" >&2
            exit 1
          }

      - name: Run the wgpu/Metal executor and the presenter readback
        run: make mac-gpu

  ladder:
    name: Application ladder and glmark2 ratchet
    needs: device
    runs-on: [self-hosted, macOS, ARM64, husklet-census]
    timeout-minutes: 90
    env:
      # The harness lives in the `e2e` repository. Until it has a remote this points at the host's clone;
      # set the `HL_E2E_PATH` repository variable to override. An absent harness fails preflight.
      HL_E2E: ${{ vars.HL_E2E_PATH || '/Users/x/dd/e2e' }}
      HL_GLMARK2_RESULTS: ${{ github.workspace }}/.gpu/glmark2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prove the harness and its gates are present
        run: |
          for required in \
            "$HL_E2E/husklet/apps/run" \
            "$HL_E2E/ci/rung.py" \
            "$HL_E2E/ci/rungs.json" \
            "$HL_E2E/ci/glmark2_ratchet.py" \
            "$HL_E2E/ci/glmark2-baseline.json"; do
            test -f "$required" || {
              echo "the GUI conformance harness is incomplete: $required is absent" >&2
              exit 1
            }
          done

      - name: Install the Husklet application under test
        run: make install

      - name: Gate the shm presentation rung
        run: python3 "$HL_E2E/ci/rung.py" weston-simple-shm

      - name: Run the per-scene glmark2 matrix
        # The matrix exits non-zero until every scene passes; the ratchet is the gate, so record its
        # results and let the next step judge them.
        run: |
          mkdir -p "$HL_GLMARK2_RESULTS"
          python3 "$HL_E2E/husklet/apps/glmark2/glmark2-matrix.py" \
            --output "$HL_GLMARK2_RESULTS" || true
          test -f "$HL_GLMARK2_RESULTS/results.json" || {
            echo "the glmark2 matrix produced no results.json; there is no evidence to ratchet" >&2
            exit 1
          }

      - name: Ratchet the per-scene grades and FPS
        run: python3 "$HL_E2E/ci/glmark2_ratchet.py" "$HL_GLMARK2_RESULTS/results.json"

      - name: Publish the conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-conformance
          path: |
            ${{ env.HL_GLMARK2_RESULTS }}
          if-no-files-found: error
