name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# WHY THIS JOB LIVES IN ITS OWN WORKFLOW, AND GROUPS PER COMMIT.
#
# `ci.yml` deliberately lets a run on `main` finish rather than be cancelled by the
# next push -- see the comment there, and the fifteen consecutive `cancelled` runs
# that prompted it. That fix is bounded by design: GitHub keeps at most one running
# plus one pending run per group, so when pushes arrive faster than runs finish, the
# pending one is superseded. Measured 2026-08-20: 3 of 6 consecutive CI runs on
# `main` reached a verdict and 2 were superseded while pending.
#
# Nothing is undetected by that -- the code is cumulative, so a defect at a skipped
# commit is still caught at the next commit that runs. What is lost is ATTRIBUTION:
# you learn `main` is red, not which commit reddened it. With nine lanes merging,
# that is the difference between a lane fixing its own break and someone bisecting.
#
# THAT PAID FOR ITSELF WITHIN AN HOUR OF LANDING, and the example is worth keeping.
# This workflow ran on 84d39c956 (pass), 71ca5e976 (FAIL at `Test every workspace
# library and binary`) and 7b18c96cd (pass). The diff between the passing 84d39c956
# and the failing 71ca5e976 is `.github/workflows/linux.yml` AND NOTHING ELSE -- a
# file `cargo test` never reads. Byte-identical code across a pass and a fail is
# PROOF of flakiness rather than suspicion of it.
# Under the collapsing scheme one of those two runs would not have existed, and this
# would have read as "Linux went red somewhere across a range of lane merges" -- a
# bisect through other people's work for a defect that does not exist.
#
# Grouping per commit fixes attribution but costs a concurrent runner per push, and
# the constraint is macOS: GitHub allows 5 concurrent macOS runners. Today the macOS
# jobs are short (8.4 and 5.7 minutes) and per-SHA grouping would fit -- but the 5.7
# is a FAST FAILURE at `nix flake check`, and becomes a real run the day design-lint
# is fixed. Making all of `ci.yml` per-SHA would therefore be affordable now and
# possibly not immediately after the fix we most want to land.
#
# So only the Linux jobs are split out. They run on `ubuntu-24.04` and
# `ubuntu-24.04-arm`, where concurrency is not the scarce resource, and they are the
# jobs most likely to catch a regression --
# it carries the workspace tests, both `hl-native` feature arms, every Clippy
# surface and the GUI binaries. macOS and Windows stay in `ci.yml` and keep
# collapsing.
#
# A JOB-LEVEL `concurrency:` KEY CANNOT DO THIS, and that is the whole reason this
# is a separate file rather than four added lines. Workflow-level concurrency
# cancels a PENDING run before any of its jobs start, so a per-SHA group on the job
# never gets the chance to apply. The next person to look at this will reach for the
# simpler thing first; it does not work.
concurrency:
  group: linux-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace-linux-amd64:
    name: Workspace quality and tests / AMD64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # `hl-native`'s build script bakes a fingerprint of `src/native` into every crate
      # above it, so a C edit already invalidates the Rust artifacts that matter.
      # Incremental objects buy nothing against that and only inflate the saved cache.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an AMD64 Linux host
        run: |
          set -euo pipefail
          architecture="$(uname -m)"
          test "$architecture" = x86_64 || {
            echo "Husklet's Linux lane requires an x86_64 host, got: $architecture" >&2
            exit 1
          }

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
        with:
          diagnostic-endpoint: ""

      # The x86_64-linux dev shell closure is 5.7 GiB -- two cross toolchains, the guest
      # libraries, the GTK4/VTE stack and Xvfb. Substituting it from cache.nixos.org on
      # every run is the single largest fixed cost in this job, so it is cached whole.
      # The store is capped before saving and week-old entries on this ref are purged, to
      # keep the Linux entry from crowding the macOS ones out of the repository's cache.
      - name: Cache the Nix development environment
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-primary-key: never
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 604800

      # A full `target` from a fresh registry is 6.7 GiB here and almost all of it is
      # workspace artifacts, which are stale on any commit after the one that filled the
      # cache. This action keeps the dependency half and drops the workspace half, which
      # is the part worth paying cache budget for. Only `main` writes, so pull requests
      # restore a predictable entry instead of each seeding its own.
      # RUSTUP_TOOLCHAIN is set for this step alone: the action shells out to the host's
      # `cargo`, and `rust-toolchain.toml` would otherwise send rustup off to download
      # 1.93.1 before the dev shell -- which already has it -- is ever entered.
      - name: Cache the Cargo registry and dependency build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          shared-key: husklet-linux-ci
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Size the build to the runner
        # The dev shell's hook pins CARGO_BUILD_JOBS to 1 unless the caller sets it, so a
        # lane on the shared development box cannot swamp a sibling's measurement. A CI
        # runner is nobody's shared box, and at one job this sequence takes hours.
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: Fetch locked application dependencies
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo fetch --locked

      - name: Check every workspace target
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo check --workspace --all-targets --locked --offline

      # THE CONFIGURATION `--all-targets` ABOVE CANNOT REACH. `hl-client`'s library
      # takes `hl-daemon` with `default-features = false`, so that build genuinely
      # happens -- but nothing had ever built `hl-daemon`'s TEST targets that way, and
      # Cargo skips a target whose required features are unmet WITHOUT PRINTING
      # ANYTHING. Seven of the nine integration tests here once simply failed to build;
      # `hl-daemon/Cargo.toml` carries that note and the `required-features` lines that
      # repaired it. A test added without one reintroduces the same silence, and the
      # step above cannot see it because it runs with `runtime` on by default.
      #
      # Measured 2026-08-21, not assumed: no `--no-default-features` invocation existed
      # anywhere in `.github/` or `flake.nix`, so the exact failure that comment
      # memorialises could recur today and no job would notice.
      #
      # SHOWN TO FAIL. Dropping the `required-features` line from `builtin_network`
      # takes this step to `error[E0432]: unresolved import`, "no `Daemon` in the root",
      # with a note naming `src/lib.rs:19` and the `runtime` gate; restoring it returns
      # the step to 0. Clean run 2m46s on a loaded box.
      #
      # `hl-daemon` is the only crate that needs this arm. The other two crates with
      # `required-features` targets already have an invocation that reaches them --
      # `-p hl-native --all-targets --features native-test-hooks` and the two
      # `-p husklet --all-targets --features gui|runtime` Clippy arms -- and the other
      # internal dependencies taken with `default-features = false` (`hl-engine`,
      # `hl-fs`, `hl-container`) have no feature-gated targets, so their unfeatured
      # configuration is already built transitively by their consumers.
      - name: Check the hl-daemon configuration hl-client builds against
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo check -p hl-daemon --no-default-features --all-targets --locked --offline

      - name: Verify formatting across every workspace crate
        # `--all` is not decoration: plain `cargo fmt --check` reaches only the seven
        # `default-members`. This is the spelling `flake.nix` uses for the same gate.
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo fmt --all --check --message-format short

      - name: Lint the native engine surface
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p hl-native --all-targets --locked --offline -- -D warnings

      - name: Lint the native engine surface with its test hooks
        # This is the invocation that would have caught 68d047599's parent. The reserved-
        # register hooks live behind `#if defined(HL_NATIVE_TEST_HOOKS)` and called
        # emitters that exist only under `HL_HOST_CPU_AARCH64`, so `hl-native`'s build
        # script failed outright on x86_64 -- but only with this feature enabled. The
        # feature also decides which targets Cargo will build at all and which symbols
        # have a writer, so the with/without pair is two different crates to Clippy.
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p hl-native --all-targets --features native-test-hooks
          --locked --offline -- -D warnings

      - name: Lint the engine composition root
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p hl-engine --lib --locked --offline -- -D warnings

      - name: Lint the container-runtime application surface
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p husklet --all-targets --features runtime
          --locked --offline -- -D warnings

      - name: Lint the GUI application surface
        # `[[bin]] husklet` is `required-features = ["gui"]` and Cargo skips an
        # unbuildable target in silence, so without this the ~10,800 lines the signed
        # application is built from are covered by nothing on this host. The Linux dev
        # shell carries gtk4/vte-gtk4/librsvg precisely so this invocation can run.
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p husklet --all-targets --features gui
          --locked --offline -- -D warnings

      # ---------------------------------------------------------------------------
      # WHAT THIS JOB DELIBERATELY DOES NOT RUN, AND WHY. All items below are measured
      # rather than guessed. Nothing here is `#[ignore]`d, disabled, or marked
      # `continue-on-error`, and this job carries NO `--skip` at all. A job that reports
      # success over a real failure is worth less than no job at all; when one of these
      # is fixed, delete its entry in the same commit.
      #
      #   1. `cargo test -p husklet --lib` FOR BOTH `runtime` AND `gui` HAS NO STEP.
      #      I added those steps, they failed on a runner, I reverted them, and then
      #      diagnosed it. The cause is ONE TEST and it is not what this block said all
      #      day:
      #      `runtime::resources::tests::daemon_crash_before_acknowledgement_is_
      #      degraded_and_reaps_the_process_group` fails the assertion at
      #      `src/apps/husklet/src/runtime/resources.rs:614` -- `preparation.warning()`
      #      does not contain "without committing a checkpoint acknowledgement".
      #      IT IS AN ORDERING DEPENDENCY, NOT A PRIVILEGE ONE. Measured on this host:
      #        isolated, as root ................ ok 3/3   (0.03s)
      #        isolated, as an unprivileged uid . ok 3/3   (0.04s)
      #        full suite, unprivileged, -j4 .... FAILED 2/2
      #        full suite, unprivileged, -j1 .... FAILED 1/1
      #      Failing at `--test-threads=1` rules out a concurrency race: something
      #      EARLIER IN THE SUITE leaves state this test then trips on. 6/6 alone,
      #      0/3 in the suite, at both privilege levels.
      #      THE OLD ENTRY BLAMED PRIVILEGE, AND THAT IS WHY MY VERIFICATION FAILED. I
      #      "confirmed" the step by running the suspected tests IN ISOLATION as an
      #      unprivileged uid and seeing them pass -- but isolation is the exact
      #      condition under which this test passes, so the check selected for the
      #      answer I expected. A green isolated run is no evidence here.
      #      RE-ADD BOTH STEPS THE DAY THAT TEST IS ORDER-INDEPENDENT. The second
      #      historical suspect, `..::stop_wait_failure_attempts_rollback_before_
      #      returning`, passes unprivileged -- it only fails as root, where
      #      `CAP_DAC_OVERRIDE` walks through its chmod sabotage.
      #      I FIRST WROTE "179 of 181 pass unprivileged" HERE FROM ONE SAMPLE. A second
      #      sample disagrees, so the honest figure is a range and a caveat:
      #        179/1  in  46.59s  (lock not requested)
      #        177/3  in 135.48s  (exclusive lock REQUESTED AND NOT GRANTED, 300s cap)
      #      The two extra failures in the second are
      #      `product_checkpoint_test::continue_later_*`, which are timing-sensitive --
      #      and that run took 2.91x as long for a suite whose load average barely moved
      #      (2.44 -> 3.41). Elapsed time is the contention signal here; the load number
      #      is not, which is why this job's sibling measurements now record both.
      #      SO: `daemon_crash_before_acknowledgement...` fails in EVERY unprivileged
      #      full-suite run and is the durable blocker. Whether the two checkpoint tests
      #      pass unprivileged on a QUIET box is NOT ESTABLISHED -- neither sample had
      #      the box, and this lane never obtained it.
      #   2. `hl-gui/tests/wire.rs` holds 8 tests behind `#![cfg(feature = "wire")]`,
      #      which is not a default feature: `cargo test -p hl-gui --test wire` reports
      #      `running 0 tests ... ok`. They are reachable only through workspace feature
      #      unification under `--workspace --all-targets`, which no step here runs, so
      #      they are covered by nothing. Not yet claimed by any lane.
      #   3. THE REVERSE GAP, and it belongs to the macOS job rather than this one:
      #      `hl-engine/tests/checkpoint_linux.rs` is `#![cfg(target_os = "linux")]` and
      #      ~4,400 lines. `nix flake check` on macos-26 is the only job that runs
      #      integration tests at all, and on that host this suite compiles to zero --
      #      as do `kevent_changelist_echo.rs` and the Linux-gated cases in
      #      `restore_collision.rs`, `unix_identity.rs` and `header_self_containment.rs`.
      #      So the one job that runs integration tests is the one host where the
      #      largest integration suite is gated out. Both halves look covered; neither
      #      is. Fixing it means running them HERE, which needs a Linux `flake check`
      #      path this job does not yet have.
      # ---------------------------------------------------------------------------

      # THIS STEP EXCLUDES NOTHING. All 88 tests run.
      #
      # It used to skip `screens::workspace::extensions::test::a_workspaces_extensions_
      # are_on_its_sidebar_and_hear_what_is_clicked`, which SIGSEGVd inside GTK 20/20 at
      # four CPUs. The cause was not thread affinity: GTK 4.22 sets `gtk_initialized`
      # before it opens a display, so on a display-less host the SECOND `gtk_init_check`
      # in a process answers true with no display behind it, and this binary had two
      # tests that each called `gtk::init()`. Fixed at `bin/test_support.rs`, which gives
      # the binary one GTK-owning thread. Measured on x86_64 Linux, gtk4 4.22.4:
      # `taskset -c 0-3` 20/20 SIGSEGV before, 20/20 green after; `--test-threads` 1, 2,
      # 4, 8 and 16 all green at four CPUs.
      #
      # THE COUNT WAS THE DISGUISE. This step reported `88 passed` with a display and
      # `88 passed` without one -- identical, so nothing in CI could tell which it had.
      # Without a display two tests print `skipped: no display connection` and return,
      # and between them they hold 19 scenarios (14 in the extensions shelf test, 5 in
      # the extension page test) that had never executed on Linux. "88 passed" reads as
      # coverage; it was 88 passed and 19 unrun.
      #
      # PROVED VACUOUS BY EXPERIMENT, not argued. Planting a false assertion in
      # `a_queued_frame_puts_widgets_on_the_page` and running the same suite both ways:
      # no display `88 passed` exit 0; under `xvfb-run` `87 passed; 1 failed` exit 101,
      # naming `an_extension_page_renders_what_is_queued_and_survives_the_extension`.
      # Restored, `xvfb-run` returns to `88 passed`. The differing outcomes are what
      # prove the display reached the test, so the wrapper did not eat it.
      # Confirmed against the test binary directly as well, which is the spelling
      # AGENTS.md requires when the thing being varied is the environment: run headless
      # it announces 2 skips, under `xvfb-run` it announces 0.
      #
      # The wrap is free -- all 88 pass under `xvfb-run` today, so this turns 19 dead
      # scenarios live and changes nothing else. `xvfb-run` and `Xvfb` come from the
      # devshell, so it must sit inside `nix develop`, after `--command`.
      #
      # The earlier note here said "this suite opens no display, do not wrap it in
      # xvfb-run to fix anything". That was right that wrapping repairs no defect, and
      # it is superseded: wrapping is not a repair, it is the difference between
      # running these assertions and only counting them.
      #
      # STILL UNCOVERED, and a bigger instance of the same shape: five files under
      # `src/workspaces/hl-gui-gtk/tests/` skip the same way, and no step in this
      # workflow RUNS them -- `cargo check --workspace --all-targets` compiles without
      # running, and `cargo test --workspace --lib --bins` excludes integration targets.
      # The only runner is `cargo test --workspace --all-targets` inside the macOS
      # `nix flake check`, which is a fast failure at design-lint. Not claimed here.
      - name: Test the GUI application binaries
        run: >-
          .github/scripts/cargo-test-named.sh "GUI application binaries"
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          xvfb-run -a -s '-screen 0 1600x1000x24'
          cargo test -p husklet --bins --features gui --locked --offline

      # The test suites above exercise widgets, but they do not start the product binary or cross its
      # scheduled screenshot hook. Preplanting a non-PNG makes this fail if the hook never runs: mere
      # file existence, a stale artifact, or a toolkit test cannot satisfy the receipt.
      - name: Launch and render the GUI application
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d "$RUNNER_TEMP/husklet-gui-smoke.XXXXXX")"
          trap 'rm -rf -- "$smoke_root"' EXIT
          shot="$smoke_root/manager.png"
          printf 'hook-did-not-run\n' >"$shot"
          mkdir -p "$smoke_root/home" "$smoke_root/cache"
          nix --extra-experimental-features 'nix-command flakes' develop . --command \
            bash -euo pipefail -c '
              cargo build -p husklet --bin husklet --features gui --locked --offline
              timeout 30s env -u HL_TERM_WS -u HL_TERM_SCRIPT -u HL_TERM_RESIZE -u HL_TERM_LIVE_ACTIONS \
                HOME="$1/home" XDG_CACHE_HOME="$1/cache" GTK_A11Y=none \
                HL_TERM_VIEW=manager HL_TERM_SHOT="$2" HL_TERM_SHOT_MS=500 \
                xvfb-run -a -s "-screen 0 1600x1000x24" -- ./target/debug/husklet
            ' bash "$smoke_root" "$shot"
          test -f "$shot" && test ! -L "$shot"
          test "$(stat -c %s "$shot")" -gt 24
          test "$(od -An -tx1 -N8 "$shot" | tr -d ' \n')" = 89504e470d0a1a0a
          width="$(od -An -tx1 -j16 -N4 "$shot" | tr -d ' \n')"
          height="$(od -An -tx1 -j20 -N4 "$shot" | tr -d ' \n')"
          [[ "$width" =~ ^[0-9a-f]{8}$ && "$width" != 00000000 ]]
          [[ "$height" =~ ^[0-9a-f]{8}$ && "$height" != 00000000 ]]

      # THE FIVE FILES THE STEP ABOVE COULD NOT REACH. `hl-gui-gtk/tests/` holds five
      # more suites that skip on `no display connection`, and until this step nothing
      # RAN them on any host: `cargo check --workspace --all-targets` compiles without
      # running, `cargo test --workspace --lib --bins` excludes integration targets, and
      # the only runner that would reach them -- `cargo test --workspace --all-targets`
      # inside the macOS `nix flake check` -- is a fast failure at design-lint.
      #
      # THIS ONE IS NOT MERELY VACUOUS HEADLESS, IT IS RED HEADLESS. Measured on the
      # merged tip: with no display `--tests` exits 101 because `--test geometry` reports
      # `0 passed; 1 failed` -- it does not skip, it fails. Under `xvfb-run` all seven
      # targets pass. So this suite has to be wrapped rather than simply added, which is
      # why it was not enough to append it to the list somewhere.
      #
      # SHOWN TO FAIL. Planting a false assertion in
      # `a_described_panel_materializes_as_widgets` takes the wrapped step to
      # `0 passed; 1 failed` on `declarative`; restoring it returns all seven to green.
      - name: Test the GUI toolkit adapter suites
        run: >-
          .github/scripts/cargo-test-named.sh "GUI toolkit adapter suites"
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          xvfb-run -a -s '-screen 0 1600x1000x24'
          cargo test -p hl-gui-gtk --tests --locked --offline

      - name: Test the engine composition root
        run: |
          set -o pipefail
          .github/scripts/cargo-test-named.sh "engine composition root" \
            nix --extra-experimental-features 'nix-command flakes' develop . --command \
            cargo test -p hl-engine --all-targets --locked --offline 2>&1 | \
            tee "$RUNNER_TEMP/engine-composition-root.log"
          verdict='test a_peer_that_exited_before_joining_does_not_stall_or_fail_the_capture_on_both_isas ... ok'
          count=$(grep -Fxc "$verdict" "$RUNNER_TEMP/engine-composition-root.log" || true)
          if [ "$count" -ne 1 ]; then
            echo "::error title=Linux checkpoint verdict missing::$verdict appeared $count times, expected exactly once."
            exit 1
          fi

      # `engine` is the worker application crate, not `hl-engine`. Its Linux direct-worker
      # regressions are integration tests, so neither the composition-root command above nor
      # `cargo test --workspace --lib --bins` below executes them. Require one guest-execution
      # verdict by name: a green target containing only the non-Linux SKIP arm proves nothing.
      - name: Test the engine worker application
        run: |
          set -o pipefail
          .github/scripts/cargo-test-named.sh "engine worker application" \
            nix --extra-experimental-features 'nix-command flakes' develop . --command \
            cargo test -p engine --tests --locked --offline --no-fail-fast 2>&1 | \
            tee "$RUNNER_TEMP/engine-worker.log"
          verdict=a_callers_controlling_terminal_survives_redirected_output
          grep -qE "^test linux_host::$verdict \.\.\. ok$" "$RUNNER_TEMP/engine-worker.log" || {
            echo "::error title=Engine worker verdict missing::$verdict did not report ok on Linux; this target may have compiled to no real tests."
            exit 1
          }

      # `--all-targets` reaches hl-native's integration tests, which no CI job on any
      # host has ever run. That is the exact gap that let a tree which did not compile
      # on x86_64 at all reach main: the two reserved-register hooks called emitters
      # existing only under HL_HOST_CPU_AARCH64, and only a real build on this host
      # notices. Both feature arms, because they are different suites -- re-measured on
      # this host at 622befa08, 108 tests without the hooks and 224 with them.
      #
      # The hooks arm is green HERE while proving nothing about the JIT: see the
      # `native-linux-arm64` job below, which exists because `reserved_register`'s two
      # assertions answer the not-applicable sentinel 4 on x86 and only reach a real
      # verdict on an aarch64 host.
      - name: Test the native engine package
        run: >-
          .github/scripts/cargo-test-named.sh "native engine package"
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo test -p hl-native --all-targets --locked --offline --no-fail-fast

      - name: Test the native engine package with its test hooks
        run: |
          set -o pipefail
          .github/scripts/cargo-test-named.sh "native engine package, test hooks" \
            nix --extra-experimental-features 'nix-command flakes' develop . --command \
            cargo test -p hl-native --all-targets --features native-test-hooks \
            --locked --offline --no-fail-fast 2>&1 | \
            tee "$RUNNER_TEMP/native-engine-hooks.log"
          verdict='test logical_checkpoint_descriptor_lookup_stays_subquadratic_for_both_targets ... ok'
          count=$(grep -Fxc "$verdict" "$RUNNER_TEMP/native-engine-hooks.log" || true)
          if [ "$count" -ne 1 ]; then
            echo "::error title=Native checkpoint verdict missing::$verdict appeared $count times, expected exactly once."
            exit 1
          fi

      # AGENTS.md names this the gate every lane must run, and until today no CI job on
      # any host had ever run it on Linux. It excludes nothing. `--no-fail-fast` so a
      # failure reports the whole picture rather than the first crate that reddened.
      # EVERY TEST STEP IN THIS FILE NAMES ITS FAILURES -- see
      # `.github/scripts/cargo-test-named.sh`. It began here, on 71ca5e976: a real
      # intermittent failure whose test could not be identified at all, which then did
      # not reproduce in 3 of 3 local rounds at `taskset -c 0-3`. It is on every step
      # rather than this one because the next time it was needed was on two steps that
      # did NOT have it, which cost a reproduction cycle and got the wrong answer.
      - name: Test every workspace library and binary
        run: >-
          .github/scripts/cargo-test-named.sh "workspace libraries and binaries"
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo test --workspace --lib --bins --locked --offline --no-fail-fast

      # The `husklet` runtime library now has its own Linux step below: the workspace
      # command above still builds the application with default features and therefore
      # omits that module, including the workspace checkpoint store. Require the
      # cross-process generation assertion by exact name so a green command after a
      # feature or module wiring regression cannot count as coverage.
      - name: Test the container-runtime application library
        run: |
          set -o pipefail
          .github/scripts/cargo-test-named.sh "container-runtime application library" \
            nix --extra-experimental-features 'nix-command flakes' develop . --command \
            cargo test -p husklet --features runtime --lib --locked --offline \
            --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/husklet-runtime-lib.log"
          verdict='test runtime::checkpoint::tests::reopening_refreshes_a_generation_published_through_another_storage_handle ... ok'
          count=$(grep -Fxc "$verdict" "$RUNNER_TEMP/husklet-runtime-lib.log" || true)
          if [ "$count" -ne 1 ]; then
            echo "::error title=Runtime checkpoint verdict missing::$verdict appeared $count times, expected exactly once."
            exit 1
          fi

      # THE EIGHT LINUX-ONLY FLAKE CHECKS HAD NO RUNNER ANYWHERE. They are
      # `lib.optionalAttrs pkgs.stdenv.isLinux` in `flake.nix`, so the macOS job's
      # `nix flake check` cannot see them, and this job runs cargo commands rather than
      # the flake. That is how two real C defects went unreported for months: an
      # always-true `-Werror=type-limits` bound in `fork_diagnostic.c` and an
      # `ENOATTR`/`ENODATA` tautology in `exec.c`, both of which a human had to find.
      #
      # Seven are green and run here. BOTH `scan-build` attributes joined that set on
      # 2026-08-20: their 14 `deadcode.DeadStores` were fixed, and the strict-GCC abort
      # that had been hiding those findings was cleared in the same day. Verified green
      # on this exact tip before being added, both arches, with the analyzer confirmed
      # to have completed a run rather than merely exited 0 -- see the assertion in
      # `flake.nix`, which exists because a misconfigured analyzer reported
      # `1 error generated. / 0 bugs found.` AND EXIT 0.
      #
      # NOTE WHAT THIS MEANS: until this line, `scan-build` ran in NO CI JOB ANYWHERE.
      # `ci.yml` never mentioned it and the macOS `nix flake check` cannot see a
      # Linux-only attribute. The gate that found two real C defects had no runner.
      #
      # `host-windows-x86_64-gnu-smoke` JOINED THEM TOO, on 2026-08-20, and it is the
      # one that had been red longest. A netns/identity lane made
      # `sock_identity_directory()` refuse structurally on Windows rather than stubbing
      # `geteuid`, then cleared two further layers behind it -- nine Rust errors in
      # `hl-native/src/lib.rs`, and 73 in `hl-engine/src/runtime/terminal.rs` where
      # `api.rs` carried `#[cfg(unix)]` on the module's USE and on every consumer but
      # not on `mod terminal;` itself. Verified green here on this exact tip before
      # being added.
      #
      # ONE HONEST RED REMAINS, named rather than silenced -- delete it the day it
      # passes:
      #   alpine-compatibility          -- I RECORDED THIS AS THE SAME DEFECT AS THE
      #                                    missing `--features runtime` step below, and
      #                                    THAT WAS WRONG. They shared a test NAME, not
      #                                    a cause, and the checkpoint fix settled it:
      #                                    on this host that test went from failing to
      #                                    5 cycles in 12.4s, `ok` -- while this check
      #                                    failed IDENTICALLY before and after, at
      #                                    `total_failed_ms=60`, "domain worker exited
      #                                    before publication (exit status: 101)". A
      #                                    fix that demonstrably changes host behaviour
      #                                    and does not move this number at all is not
      #                                    the thing this check is red for.
      #                                    60ms is worker STARTUP, not the checkpoint
      #                                    cycles, and it happens only inside the nix
      #                                    build sandbox -- so the cause is very likely
      #                                    what that sandbox denies the domain worker,
      #                                    and this check may not be runnable where it
      #                                    is currently defined.
      #                                    DIAGNOSED 2026-08-21, and the guess above was
      #                                    right about WHERE and wrong about WHAT. The
      #                                    sandbox sets SSL_CERT_FILE=/no-cert-file.crt;
      #                                    the worker builds a reqwest client
      #                                    unconditionally in `hl_daemon::Daemon::new`
      #                                    and `Client::new()` panics with no CA store.
      #                                    `nix build --keep-failed` preserves the
      #                                    builder's `$TMPDIR` -- use it, the artefacts
      #                                    do survive that way. Fixed in `flake.nix`.
      #                                    STILL RED UNDERNEATH, and now visible: the
      #                                    guest runs, then loses all three background
      #                                    `sleep` children (`SLEEP_CHILD_LOST`, guest
      #                                    exit 91 ~100ms in) and the step reports 124
      #                                    with NO `test result:` line. Ruled out so far:
      #                                    it is NOT ISA-specific -- outside the sandbox
      #                                    both amd64 and arm64 pass, 5 cycles, ~12.2s --
      #                                    and NOT the private PID namespace, which fails
      #                                    differently (`old domain host processes
      #                                    survived handover`) with the guest healthy.
      #
      # COST, MEASURED IN CI RATHER THAN ESTIMATED. Adding both scan-build attributes
      # was predicted to take this job from 20.0 to ~27 minutes, from a 7 minute cold
      # local run. Actual: 24.1 minutes on the first CI run, which paid a one-off
      # `clang-analyzer` substitution, then 20.1 and 20.4 -- indistinguishable from the
      # 20.0 before they were added. Once that closure is cached the two attributes are
      # effectively free, because `host-linux-aarch64` had already substituted the
      # aarch64 cross toolchain. There is no timeout pressure here.
      #
      # RE-MEASURED WITH `host-windows-x86_64-gnu-smoke` INCLUDED, on run 32409564110:
      # the whole seven-attribute step is 3.9 minutes and the job is 24.5, against 20.4
      # without it. So mingw costs about four minutes -- it is the most expensive
      # attribute here, a full cross-compile of `hl-native`, `hl-engine` and `engine`
      # plus the objdump import/ABI contracts, with a closure shared with nothing else
      # this job builds. 24.5 against a 60 minute timeout is comfortable, and this line
      # is the measurement rather than the estimate it replaces.
      # Built one attribute at a time by `flake-checks-named.sh` so a failure SAYS
      # WHICH ONE. `nix build .#a .#b .#c` reports a single exit status for the set,
      # and when this step failed on eb556a32b the entire diagnosis available without
      # repository admin was `Process completed with exit code 1` -- seven attributes,
      # one bit, and a local sweep to find out which. Nix caches per derivation, so
      # building them separately costs nothing.
      - name: Verify the Linux-only flake checks that are green
        run: >-
          .github/scripts/flake-checks-named.sh x86_64-linux
          host-linux-aarch64
          host-linux-x86_64
          installed-product
          host-darwin-cross-contract
          scan-build-linux-aarch64
          scan-build-linux-x86_64
          host-windows-x86_64-gnu-smoke

  native-linux-arm64:
    name: Native engine / ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    # WHY A SECOND ARCHITECTURE FOR ONE COMMAND.
    #
    # `cargo test -p hl-native --all-targets --features native-test-hooks` already runs
    # in the AMD64 job above, and it is GREEN THERE WITHOUT TESTING ANYTHING that this
    # job exists to test. `tests/reserved_register.rs` says so in its own source: both
    # hooks emit real code and scan it, so they are answerable only where the emitters
    # are compiled -- an AArch64 host. Off it they return `4`, "not applicable", and the
    # fixture asserts `4` rather than compiling itself out, so the exports still have to
    # resolve. `0` is the verdict that means the emitters were compiled in AND scanned.
    #
    # A GREEN FIXTURE ON x86 IS A SENTINEL, NOT A RESULT. Only an aarch64 host can turn
    # that assertion into evidence, and until this job existed no runner anywhere was
    # one: this workflow and `ci.yml`'s Windows job are x86, and the `macos-26` job
    # builds `checks.aarch64-darwin.host-darwin-aarch64-native` and runs a single ABI
    # test. So the ~120 `e_*` emitters, W^X publication, block chaining, IBTC and the
    # provenance map had no CI coverage on any host, and the two reserved-register
    # defects fixed on 2026-08-20 would have regressed silently.
    #
    # Measured here rather than inherited, on x86_64 at 622befa08: `reserved_register`'s
    # two tests RUN and PASS, and they pass BY ASSERTING 4 -- which is the whole problem
    # this job exists to fix, stated as a number. The suite is 224 tests with the hooks
    # against 108 without.
    #
    # The aarch64 VM lane measured 217 against 107 on a real ARM64 kernel, at 6fde34d36.
    # DO NOT SUBTRACT THOSE FROM THESE: they are different commits, and the x86 pair has
    # a 116-test delta of its own, so the two arms each gate tests the other does not.
    # The claim this job rests on is not a count difference, it is that two specific
    # assertions can only reach their meaningful verdict on an aarch64 host.
    #
    # The lane corroborated that the JIT is genuinely live there three independent ways --
    # the 18 lowering translation units compile 0 times on x86 and 18 on aarch64 (read
    # out of DWARF by source path), the shared object carries 80 `e_*` emitter bodies
    # there and 0 here, and a live guest holds two 64 MiB `/memfd:hl-code` W^X mappings
    # that disassemble as ARM64 translated-block prologues, against zero such mappings
    # on x86.
    #
    # `ubuntu-24.04-arm` is a NATIVE arm64 runner, not emulation, so this should cost
    # roughly what the equivalent x86 work costs. If it ever reddens, the fixture is
    # reporting something real about the JIT -- read it, do not paper over it.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an ARM64 Linux host
        # Not ceremony: if this ever runs on x86 the hooks answer `4`, the fixture passes,
        # and the job reports success while covering exactly nothing -- which is the state
        # this job was added to end. Fail loudly instead.
        run: |
          set -euo pipefail
          architecture="$(uname -m)"
          test "$architecture" = aarch64 || {
            echo "Husklet's ARM64 lane requires an aarch64 host, got: $architecture" >&2
            echo "On any other architecture the reserved-register hooks return the" >&2
            echo "not-applicable sentinel 4 and this job would prove nothing." >&2
            exit 1
          }

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
        with:
          diagnostic-endpoint: ""

      # `runner.arch` is part of both keys, so this entry cannot collide with the AMD64
      # job's despite the identical shape.
      - name: Cache the Nix development environment
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-primary-key: never
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 604800

      # A DISTINCT `shared-key` from the AMD64 job. Its entry holds x86_64 object files
      # and restoring those here would at best waste the download and at worst hand this
      # build artifacts it cannot link.
      - name: Cache the Cargo registry and dependency build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          shared-key: husklet-linux-arm64-ci
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Size the build to the runner
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: Fetch locked application dependencies
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo fetch --locked

      # The `--features native-test-hooks` arm is the whole point; the arm without them
      # is already covered on AMD64 and adds nothing here.
      #
      # A GREEN EXIT CODE IS NOT SUFFICIENT EVIDENCE FOR THIS STEP, and this job exists
      # because of exactly that: on x86 the identical command is green while the two
      # assertions answer the not-applicable sentinel. A future `#[cfg]`, a renamed
      # feature, a dropped `required-features` target or a rename of either test would
      # make them vanish silently and leave THIS job green for the same empty reason --
      # `cargo test` reports `ok` for a target that ran nothing. So the run is captured
      # and both verdicts are required BY NAME.
      #
      # Checked both ways against real captured runs on x86_64 before landing: both
      # lines are present in a `--features native-test-hooks` run and absent from a run
      # without it, so the grep discriminates rather than always matching.
      - name: Test the native engine package with its test hooks
        run: |
          set -o pipefail
          .github/scripts/cargo-test-named.sh "ARM64 native engine, test hooks" \
            nix --extra-experimental-features 'nix-command flakes' develop . --command \
            cargo test -p hl-native --all-targets --features native-test-hooks \
            --locked --offline --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/hooks.log"
          for verdict in \
            emitted_code_never_holds_a_live_value_in_the_reserved_register \
            emitted_x86_flag_lowerings_never_name_the_reserved_register; do
            grep -qE "^test $verdict \.\.\. ok$" "$RUNNER_TEMP/hooks.log" || {
              echo "::error title=Reserved-register verdict missing::$verdict did not report ok on this aarch64 host. This job's only purpose is to run that assertion where it answers 0 rather than the not-applicable sentinel 4, so a run without it proves nothing and is failed deliberately."
              exit 1
            }
          done

      - name: Test ARM64 checkpoint backend policy
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo test --locked --offline -p hl-engine --lib
          runtime::execution::native_eligibility_tests::arm_and_non_linux_hosts_refuse_native_checkpoint_composition
          -- --exact

      # The hook suite above validates checkpoint record machinery, but it never launches a guest
      # through hl-engine's capture/restore lifecycle. Run the Linux end-to-end suite on this real
      # AArch64 host as the other half of the translated matrix: checkpoint-capable launches refuse the
      # native-supervised path, so its AArch64 fixture takes same-ISA translation and its x86_64 fixture
      # takes cross-ISA translation. The AMD64 job covers AArch64 cross-ISA translation and also forces
      # same-ISA x86 translation explicitly. This is runtime evidence for translation only; native
      # checkpoint execution remains unsupported rather than being inferred from the host ISA.
      #
      # Require one broad journey from each backend by exact name. Cargo exits successfully when a
      # target is cfg'd to zero tests or a filter drifts, which would turn this expensive step into no
      # evidence at all without these receipts.
      - name: Test checkpoint and restore end to end on ARM64
        run: |
          set -o pipefail
          .github/scripts/cargo-test-named.sh "ARM64 translated checkpoint matrix" \
            nix --extra-experimental-features 'nix-command flakes' develop . --command \
            cargo test -p hl-engine --test checkpoint_linux --locked --offline \
            --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/checkpoint-backend-matrix.log"
          for verdict in \
            aarch64_daily_development_workload_survives_two_checkpoint_cycles \
            amd64_daily_development_workload_survives_two_checkpoint_cycles \
            amd64_transliterated_jcc_links_are_rebuilt_across_two_checkpoint_cycles \
            x86_translator_round_trips_complete_tree_terminal_and_failure_contract; do
            grep -qE "^test $verdict \.\.\. ok$" "$RUNNER_TEMP/checkpoint-backend-matrix.log" || {
              echo "::error title=Translated checkpoint verdict missing::$verdict did not report ok on this AArch64 host."
              exit 1
            }
          done
