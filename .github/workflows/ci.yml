name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-macos-arm64:
    name: Native engine / macOS ARM64
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an Apple Silicon host
        run: test "$(uname -m)" = arm64

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
        with:
          diagnostic-endpoint: ""

      - name: Compile, link, and exercise the native engine ABI
        run: >-
          nix --extra-experimental-features 'nix-command flakes'
          build -L .#checks.aarch64-darwin.host-darwin-aarch64-native

      - name: Exercise the dylib ABI boundary explicitly
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo test --locked -p hl-native --lib tests::shared_engine_exports_matching_abi
          -- --exact

      - name: Compile, link, and run the public C and C++ ABI contracts
        run: |
          set -euo pipefail
          library="$(find target/debug/build -path '*/out/libhl_native_engine.dylib' -type f -print -quit)"
          test -n "$library"
          native_directory="$(dirname "$library")"
          xcrun clang -std=c11 -Wall -Wextra -Werror \
            -Isrc/runtime/hl-native/src/native/include \
            tests/native/host-abi/unix.c -L"$native_directory" \
            -lhl_native_engine -o "$RUNNER_TEMP/hl-public-abi-c"
          xcrun clang++ -std=c++20 -Wall -Wextra -Werror \
            -Isrc/runtime/hl-native/src/native/include \
            tests/native/host-abi/unix.cpp -L"$native_directory" \
            -lhl_native_engine -o "$RUNNER_TEMP/hl-public-abi-cxx"
          DYLD_LIBRARY_PATH="$native_directory" "$RUNNER_TEMP/hl-public-abi-c"
          DYLD_LIBRARY_PATH="$native_directory" "$RUNNER_TEMP/hl-public-abi-cxx"

  native-windows-amd64:
    name: Native surface / Windows AMD64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an AMD64 host
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Husklet Windows smoke requires AMD64, got $env:PROCESSOR_ARCHITECTURE"
          }

      - name: Select the repository Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
          rustup target add x86_64-pc-windows-msvc

      - name: Enter the native MSVC AMD64 environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installation) { throw "MSVC AMD64 tools are unavailable" }
          $developer = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          $variables = cmd.exe /d /s /c "`"$developer`" -no_logo -arch=amd64 >nul && set"
          $variables | Where-Object { $_ -match '^[A-Za-z_][A-Za-z0-9_]*=' } |
            Add-Content -Path $env:GITHUB_ENV

      - name: Check the Rust Windows provider surface
        shell: pwsh
        run: cargo check --locked -p hl-native --target x86_64-pc-windows-msvc

      - name: Compile the Windows host adapter
        shell: pwsh
        run: >-
          cl.exe /nologo /std:c11 /c /DHL_SHARED /DHL_BUILDING_ENGINE
          /Isrc/runtime/hl-native/src/native
          /Isrc/runtime/hl-native/src/native/include
          src/runtime/hl-native/src/native/bridge/host.c
          /Fo:$env:RUNNER_TEMP\hl-host-windows.obj

      - name: Compile the public C and C++ ABI contracts
        shell: pwsh
        run: |
          cl.exe /nologo /std:c11 /W4 /WX /c /DHL_SHARED /DHL_ABI_COMPILE_CONTRACT `
            /Isrc/runtime/hl-native/src/native/include `
            tests/native/host-abi/windows.c `
            /Fo:$env:RUNNER_TEMP\hl-public-abi-c.obj
          cl.exe /nologo /std:c++20 /EHsc /W4 /WX /c /DHL_SHARED `
            /Isrc/runtime/hl-native/src/native/include `
            tests/native/host-abi/windows.cpp `
            /Fo:$env:RUNNER_TEMP\hl-public-abi-cxx.obj

      - name: Link and execute the public ABI fixture
        shell: pwsh
        run: |
          cl.exe /nologo /std:c11 /LD /DHL_ABI_FIXTURE_EXPORT `
            /Isrc/runtime/hl-native/src/native/include `
            tests/native/host-abi/windows.c `
            /Fe:$env:RUNNER_TEMP\hl-abi-fixture.dll `
            /link /IMPLIB:$env:RUNNER_TEMP\hl-abi-fixture.lib
          cl.exe /nologo /std:c11 `
            /Isrc/runtime/hl-native/src/native/include `
            tests/native/host-abi/windows.c `
            $env:RUNNER_TEMP\hl-abi-fixture.lib `
            /Fe:$env:RUNNER_TEMP\hl-abi-smoke.exe
          & "$env:RUNNER_TEMP\hl-abi-smoke.exe"

  workspace-linux-amd64:
    name: Workspace quality and tests / Linux AMD64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # `hl-native`'s build script bakes a fingerprint of `src/native` into every crate
      # above it, so a C edit already invalidates the Rust artifacts that matter.
      # Incremental objects buy nothing against that and only inflate the saved cache.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an AMD64 Linux host
        run: |
          set -euo pipefail
          architecture="$(uname -m)"
          test "$architecture" = x86_64 || {
            echo "Husklet's Linux lane requires an x86_64 host, got: $architecture" >&2
            exit 1
          }

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
        with:
          diagnostic-endpoint: ""

      # The x86_64-linux dev shell closure is 5.7 GiB -- two cross toolchains, the guest
      # libraries, the GTK4/VTE stack and Xvfb. Substituting it from cache.nixos.org on
      # every run is the single largest fixed cost in this job, so it is cached whole.
      # The store is capped before saving and week-old entries on this ref are purged, to
      # keep the Linux entry from crowding the macOS ones out of the repository's cache.
      - name: Cache the Nix development environment
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-primary-key: never
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 604800

      # A full `target` from a fresh registry is 6.7 GiB here and almost all of it is
      # workspace artifacts, which are stale on any commit after the one that filled the
      # cache. This action keeps the dependency half and drops the workspace half, which
      # is the part worth paying cache budget for. Only `main` writes, so pull requests
      # restore a predictable entry instead of each seeding its own.
      # RUSTUP_TOOLCHAIN is set for this step alone: the action shells out to the host's
      # `cargo`, and `rust-toolchain.toml` would otherwise send rustup off to download
      # 1.93.1 before the dev shell -- which already has it -- is ever entered.
      - name: Cache the Cargo registry and dependency build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          shared-key: husklet-linux-ci
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Size the build to the runner
        # The dev shell's hook pins CARGO_BUILD_JOBS to 1 unless the caller sets it, so a
        # lane on the shared development box cannot swamp a sibling's measurement. A CI
        # runner is nobody's shared box, and at one job this sequence takes hours.
        run: echo "CARGO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: Fetch locked application dependencies
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo fetch --locked

      - name: Check every workspace target
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo check --workspace --all-targets --locked --offline

      - name: Verify formatting across every workspace crate
        # `--all` is not decoration: plain `cargo fmt --check` reaches only the seven
        # `default-members`. This is the spelling `flake.nix` uses for the same gate.
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo fmt --all --check --message-format short

      - name: Lint the native engine surface
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p hl-native --all-targets --locked --offline -- -D warnings

      - name: Lint the native engine surface with its test hooks
        # This is the invocation that would have caught 68d047599's parent. The reserved-
        # register hooks live behind `#if defined(HL_NATIVE_TEST_HOOKS)` and called
        # emitters that exist only under `HL_HOST_CPU_AARCH64`, so `hl-native`'s build
        # script failed outright on x86_64 -- but only with this feature enabled. The
        # feature also decides which targets Cargo will build at all and which symbols
        # have a writer, so the with/without pair is two different crates to Clippy.
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p hl-native --all-targets --features native-test-hooks
          --locked --offline -- -D warnings

      - name: Lint the engine composition root
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p hl-engine --lib --locked --offline -- -D warnings

      - name: Lint the container-runtime application surface
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p husklet --all-targets --features runtime
          --locked --offline -- -D warnings

      - name: Lint the GUI application surface
        # `[[bin]] husklet` is `required-features = ["gui"]` and Cargo skips an
        # unbuildable target in silence, so without this the ~10,800 lines the signed
        # application is built from are covered by nothing on this host. The Linux dev
        # shell carries gtk4/vte-gtk4/librsvg precisely so this invocation can run.
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p husklet --all-targets --features gui
          --locked --offline -- -D warnings

      # ---------------------------------------------------------------------------
      # WHAT THIS JOB DELIBERATELY DOES NOT RUN, AND WHY. Both items are known reds on
      # x86_64 Linux, measured rather than guessed. Neither is `#[ignore]`d, disabled, or
      # marked `continue-on-error` anywhere in the tree, and the single `--skip` below is
      # the job's entire set of exclusions. A job that reports success over a real
      # failure is worth less than no job at all; when one of these is fixed, delete its
      # entry here in the same commit.
      #
      #   1. `cargo test -p husklet --lib --features runtime` HAS NO STEP AT ALL, so the
      #      `runtime`-only surface of the application has no Linux test gate.
      #      `runtime::domain::product_checkpoint_test::continue_later_restores_the_
      #      primary_sleep_tree_across_repeated_cycles` and `..::continue_later_keeps_a_
      #      terminal_backed_pane_execution_across_repeated_cycles` fail 3/3
      #      deterministically here: the domain worker exits 101 before publication and
      #      the restore slot reports `stage=failed(12) error=17` (EEXIST). That is a
      #      REAL ENGINE DEFECT ON THIS ARCHITECTURE and a lane is fixing it. ADD THE STEP
      #      THE DAY THAT LANDS. Two more of that module's tests are red for their own
      #      reasons and want the same commit: `runtime::resources::tests::daemon_crash_
      #      before_acknowledgement_is_degraded_and_reaps_the_process_group` fails as root
      #      and unprivileged alike and is undiagnosed, and
      #      `..::stop_wait_failure_attempts_rollback_before_returning` sabotages a
      #      directory with chmod, which `CAP_DAC_OVERRIDE` walks straight through, so it
      #      passes only because a GitHub runner is not root.
      #   2. `husklet screens::workspace::extensions::test::a_workspaces_extensions_are_
      #      on_its_sidebar_and_hear_what_is_clicked` is skipped by name in the GUI bins
      #      step below. It SIGSEGVs inside GTK -- `gtk4::Box::new` -> `gtk_widget_init`
      #      -> `gtk_css_static_style_get_default` -> `gtk_style_provider_get_settings`
      #      -- from `bin/screens/workspace/extensions/test.rs:72`. It passes 8/8 run
      #      alone and crashes 15 of 20 runs on a 4-CPU host against 0 of 10 on a 32-CPU
      #      one, because libtest sizes its worker pool from the CPU count and the widget
      #      ends up constructed on a thread that never initialised GTK. A GitHub
      #      standard runner has 4 vCPUs, so without this exclusion the step is red three
      #      runs in four. Fix the thread affinity of the fixture, not this line.
      # ---------------------------------------------------------------------------

      # THIS STEP CARRIES ONE NAMED EXCLUSION -- see item 2 above. 87 of the 88 tests run.
      # This suite opens no display. Do not wrap it in `xvfb-run` to "fix" anything.
      - name: Test the GUI application binaries
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo test -p husklet --bins --features gui --locked --offline
          -- --skip
          screens::workspace::extensions::test::a_workspaces_extensions_are_on_its_sidebar_and_hear_what_is_clicked

      - name: Test the engine composition root
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo test -p hl-engine --lib --locked --offline

      # AGENTS.md names this the gate every lane must run, and until today no CI job on
      # any host had ever run it on Linux. It excludes nothing. `--no-fail-fast` so a
      # failure reports the whole picture rather than the first crate that reddened.
      - name: Test every workspace library and binary
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo test --workspace --lib --bins --locked --offline --no-fail-fast

  workspace:
    name: Workspace quality and tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an Apple Silicon host
        run: |
          architecture="$(uname -m)"
          test "$architecture" = arm64 || {
            echo "Husklet CI requires an arm64 macOS host, got: $architecture" >&2
            exit 1
          }

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
        with:
          diagnostic-endpoint: ""

      - name: Cache the Nix development environment
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify the pinned workspace
        run: >-
          nix --extra-experimental-features 'nix-command flakes'
          flake check -L --option cores 0 --max-jobs auto

      - name: Fetch locked application dependencies
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo fetch --locked

      - name: Lint the container-runtime application surface
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p husklet --all-targets --features runtime
          --locked --offline -- -D warnings

      - name: Lint the macOS application surface
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p husklet --all-targets --features gui
          --locked --offline -- -D warnings
