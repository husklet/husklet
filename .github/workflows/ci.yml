name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# WHY `main` DOES NOT CANCEL ITSELF. Measured 2026-08-20: the fifteen most recent
# runs on this branch had all ended `cancelled` -- not one `success`, not one
# `failure`. Lanes merge into `main` every ~10 minutes and this workflow needs ~45,
# so `cancel-in-progress: true` meant every run was killed by the next push and no
# commit on `main` had ever reached a verdict. That is the most expensive shape of
# green there is: a CI signal that cannot report anything at all.
# Pull requests keep the cancelling behaviour, where a new head commit genuinely
# supersedes the one being tested. On `main` GitHub queues instead, and the queue is
# bounded at one by its own rule -- a newly queued run cancels the previously
# PENDING run in the same group -- so pushes arriving during a run collapse to a
# single follow-up rather than piling up runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-macos-arm64:
    name: Native engine / macOS ARM64
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an Apple Silicon host
        run: test "$(uname -m)" = arm64

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
        with:
          diagnostic-endpoint: ""

      - name: Compile, link, and exercise the native engine ABI
        run: >-
          nix --extra-experimental-features 'nix-command flakes'
          build -L .#checks.aarch64-darwin.host-darwin-aarch64-native

      - name: Exercise the dylib ABI boundary explicitly
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo test --locked -p hl-native --lib tests::shared_engine_exports_matching_abi
          -- --exact

      - name: Compile, link, and run the public C and C++ ABI contracts
        run: |
          set -euo pipefail
          library="$(find target/debug/build -path '*/out/libhl_native_engine.dylib' -type f -print -quit)"
          test -n "$library"
          native_directory="$(dirname "$library")"
          xcrun clang -std=c11 -Wall -Wextra -Werror \
            -Isrc/runtime/hl-native/src/native/include \
            src/runtime/hl-native/tests/host-abi/unix.c -L"$native_directory" \
            -lhl_native_engine -o "$RUNNER_TEMP/hl-public-abi-c"
          xcrun clang++ -std=c++20 -Wall -Wextra -Werror \
            -Isrc/runtime/hl-native/src/native/include \
            src/runtime/hl-native/tests/host-abi/unix.cpp -L"$native_directory" \
            -lhl_native_engine -o "$RUNNER_TEMP/hl-public-abi-cxx"
          DYLD_LIBRARY_PATH="$native_directory" "$RUNNER_TEMP/hl-public-abi-c"
          DYLD_LIBRARY_PATH="$native_directory" "$RUNNER_TEMP/hl-public-abi-cxx"

  native-windows-amd64:
    name: Native surface / Windows AMD64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an AMD64 host
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Husklet Windows smoke requires AMD64, got $env:PROCESSOR_ARCHITECTURE"
          }

      - name: Select the repository Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
          rustup target add x86_64-pc-windows-msvc

      - name: Enter the native MSVC AMD64 environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installation) { throw "MSVC AMD64 tools are unavailable" }
          $developer = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          $variables = cmd.exe /d /s /c "`"$developer`" -no_logo -arch=amd64 >nul && set"
          $variables | Where-Object { $_ -match '^[A-Za-z_][A-Za-z0-9_]*=' } |
            Add-Content -Path $env:GITHUB_ENV

      - name: Check the Rust Windows provider surface
        shell: pwsh
        run: cargo check --locked -p hl-native --target x86_64-pc-windows-msvc

      - name: Compile the Windows host adapter
        shell: pwsh
        run: >-
          cl.exe /nologo /std:c11 /c /DHL_SHARED /DHL_BUILDING_ENGINE
          /Isrc/runtime/hl-native/src/native
          /Isrc/runtime/hl-native/src/native/include
          src/runtime/hl-native/src/native/bridge/host.c
          /Fo:$env:RUNNER_TEMP\hl-host-windows.obj

      - name: Compile the public C and C++ ABI contracts
        shell: pwsh
        run: |
          cl.exe /nologo /std:c11 /W4 /WX /c /DHL_SHARED /DHL_ABI_COMPILE_CONTRACT `
            /Isrc/runtime/hl-native/src/native/include `
            src/runtime/hl-native/tests/host-abi/windows.c `
            /Fo:$env:RUNNER_TEMP\hl-public-abi-c.obj
          cl.exe /nologo /std:c++20 /EHsc /W4 /WX /c /DHL_SHARED `
            /Isrc/runtime/hl-native/src/native/include `
            src/runtime/hl-native/tests/host-abi/windows.cpp `
            /Fo:$env:RUNNER_TEMP\hl-public-abi-cxx.obj

      - name: Link and execute the public ABI fixture
        shell: pwsh
        run: |
          cl.exe /nologo /std:c11 /LD /DHL_ABI_FIXTURE_EXPORT `
            /Isrc/runtime/hl-native/src/native/include `
            src/runtime/hl-native/tests/host-abi/windows.c `
            /Fe:$env:RUNNER_TEMP\hl-abi-fixture.dll `
            /link /IMPLIB:$env:RUNNER_TEMP\hl-abi-fixture.lib
          cl.exe /nologo /std:c11 `
            /Isrc/runtime/hl-native/src/native/include `
            src/runtime/hl-native/tests/host-abi/windows.c `
            $env:RUNNER_TEMP\hl-abi-fixture.lib `
            /Fe:$env:RUNNER_TEMP\hl-abi-smoke.exe
          & "$env:RUNNER_TEMP\hl-abi-smoke.exe"

  workspace:
    name: Workspace quality and tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require an Apple Silicon host
        run: |
          architecture="$(uname -m)"
          test "$architecture" = arm64 || {
            echo "Husklet CI requires an arm64 macOS host, got: $architecture" >&2
            exit 1
          }

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
        with:
          diagnostic-endpoint: ""

      - name: Cache the Nix development environment
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # THIS STEP IS A FAST FAILURE TODAY, and what it is failing at is not what it
      # will fail at next. The verification derivation stops at `hl-design-lint`
      # (38 findings at this tip), so everything after that line in `flake.nix` has
      # NEVER RUN ON ANY MACOS RUNNER: `cargo check`/`clippy --workspace -D warnings`,
      # `cargo test --workspace --all-targets`, the `-p husklet --features runtime`
      # tests, and the doc tests. Nor have the two Clippy steps below this one, which
      # never get reached. When the design-lint count reaches 0 this job does not go
      # green -- it starts, for the first time, and reports whatever is behind it.
      #
      # ONE OF THOSE IS ALREADY KNOWN AND MEASURED, so nobody has to rediscover it:
      # `cargo test --workspace --all-targets` runs
      # `builder::tests::remote::remote_add_fetches_validates_and_keeps_archives_opaque`,
      # which builds a `reqwest` client to fetch a Dockerfile `ADD <url>` over plain
      # HTTP from a localhost server. Building the client loads the host CA store even
      # though the fetch is not TLS, and every Nix sandbox sets
      # `SSL_CERT_FILE=/no-cert-file.crt`. Measured on x86_64 Linux at 9941b08fb, test
      # binary invoked directly with that variable: `0 passed; 1 failed`, panicking on
      # the `unwrap` at `builder/tests/remote.rs:50`. It is pre-existing and belongs to
      # the crate, not here -- do NOT fix it by exporting a CA bundle into the
      # derivation, which is the workaround just removed from `alpine-compatibility`.
      - name: Verify the pinned workspace
        run: >-
          nix --extra-experimental-features 'nix-command flakes'
          flake check -L --option cores 0 --max-jobs auto

      - name: Fetch locked application dependencies
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo fetch --locked

      - name: Lint the container-runtime application surface
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p husklet --all-targets --features runtime
          --locked --offline -- -D warnings

      - name: Lint the macOS application surface
        run: >-
          nix --extra-experimental-features 'nix-command flakes' develop . --command
          cargo clippy -p husklet --all-targets --features gui
          --locked --offline -- -D warnings
