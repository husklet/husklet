# drives real in-process wayland-client(s) against the live adapter and asserts EXACT event data / bytes /
# pixels. Own binaries — each mutates process-global `$XDG_RUNTIME_DIR` / `$WAYLAND_DISPLAY`.
[[test]]
name = "demo_multi_window_keyboard_focus"
path = "tests/demo_multi_window_keyboard_focus.rs"
required-features = ["smithay-adapter"]

[[test]]
name = "demo_damage_partial_update"
path = "tests/demo_damage_partial_update.rs"
required-features = ["smithay-adapter"]

[[test]]
name = "demo_clipboard_selection_roundtrip"
