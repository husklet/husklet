[package]
name = "hl_wip_compositor"
version = "0.0.0"
edition = "2021"
publish = false
description = "Platform-neutral compositor policy (the `scene` brain) for the hl host renderer."

[lib]
name = "hl_compositor"
path = "src/lib.rs"

# STANDALONE crate: an empty [workspace] table excludes this directory from the shared repo workspace
# (it is not a member of the root Cargo.toml). The neutral `scene` core is pure std — zero dependencies.
# The Smithay Wayland adapter is behind the `smithay-adapter` feature so the neutral policy still builds
# and tests with no Smithay/GPU. Build + test with:
#   cargo test --manifest-path hl_wip-compositor/Cargo.toml --features smithay-adapter
[workspace]

[features]
# The real Wayland protocol server (adapter/smithay) — pulls in Smithay + the calloop serve loop. Off by
# default so the pure-std scene core keeps building with zero deps.
default = []
smithay-adapter = ["dep:smithay"]
# The macOS surface presenter (`surface/macos`) — a concrete `scene::port::Presenter` that draws a
# composed frame to a REAL `NSWindow` + `CAMetalLayer` via Metal (or, headless, into an offscreen
# `MTLTexture`/`IOSurface` it can read back). Off by default so the pure-std scene core keeps building
# with zero deps, and the objc2 stack is only pulled on macOS (the deps are target-gated below). Build:
#   cargo build --manifest-path hl_wip-compositor/Cargo.toml --features macos-surface   (on macOS)
macos-surface = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
]

[dependencies]
# The neutral policy is pure std. The Smithay adapter (adapter/smithay) is optional: it translates
# Wayland `wl_*`/`xdg_*` callbacks into `scene::service` calls. Headless — wayland_frontend only, NO
# drm/gbm/libinput/session/egl backend.
smithay = { path = "../vendor/smithay-0.7.0", default-features = false, features = ["wayland_frontend"], optional = true }

# The macOS surface presenter's Cocoa/Metal/IOSurface stack — the SAME objc2 crates the old
# `hl-display` present path used. Target-gated to macOS (so a Linux build never sees them) AND optional
# (activated only by the `macos-surface` feature via the `dep:` entries above). No new fetch on the mac:
# objc2* are already locked across the tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5", optional = true }
objc2-foundation = { version = "0.2", optional = true, features = ["NSString", "NSGeometry", "NSData", "NSThread", "NSRunLoop", "NSDate", "NSDictionary"] }
objc2-app-kit = { version = "0.2", optional = true, features = [
    "NSApplication", "NSWindow", "NSResponder", "NSView", "NSControl", "NSScreen", "NSColor",
    "NSGraphics", "NSRunningApplication", "objc2-quartz-core",
] }
objc2-metal = { version = "0.2", optional = true, features = [
    "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLBlitCommandEncoder",
    "MTLTexture", "MTLPixelFormat", "MTLResource", "MTLTypes", "MTLDrawable", "MTLBuffer",
    "MTLLibrary", "MTLRenderPipeline", "MTLRenderPass", "MTLRenderCommandEncoder",
] }
objc2-quartz-core = { version = "0.2", optional = true, features = ["CALayer", "CAMetalLayer", "CATransaction", "objc2-metal"] }

[dev-dependencies]
# The headless end-to-end test spawns the compositor and drives a real Wayland CLIENT against it.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[[test]]
name = "wayland_e2e"
path = "tests/wayland_e2e.rs"
required-features = ["smithay-adapter"]

# Live-socket discovery proof: the compositor binds the STANDARD `$XDG_RUNTIME_DIR/wayland-N` (+ lock)
# discovery socket via Smithay's `ListeningSocketSource` (`run_auto`), and a real `wayland-client` finds it
# through `$WAYLAND_DISPLAY` with `Connection::connect_to_env()` — the exact path a real GUI toolkit takes —
# then composites a colored buffer to the `PngPresenter`. Its own binary because it mutates process-global
# `$XDG_RUNTIME_DIR` / `$WAYLAND_DISPLAY`.
[[test]]
name = "wayland_live_socket"
path = "tests/wayland_live_socket.rs"
required-features = ["smithay-adapter"]

# Adversarial serve-loop coverage: drives real wayland-clients through the calloop serve loop with the
# hostile sequences a scene-only test can't reach — a throttled commit then client idle (must still ship +
# release the frame callback one refresh later), coalesced bursts, no-buffer / damage-only commits,
# disconnect mid-frame, and multi-surface interleaving.
[[test]]
name = "wayland_serve_adversarial"
path = "tests/wayland_serve_adversarial.rs"
required-features = ["smithay-adapter"]

# xdg-shell configure (size + states + bounds) and zxdg_decoration_manager_v1 (CSD-vs-SSD) negotiation
# proof: a real wayland-client binds the decoration manager, sets title/app_id, requests a decoration
# mode, and asserts it receives an `xdg_toplevel.configure` (non-zero size + Activated + configure_bounds)
# and a `zxdg_toplevel_decoration_v1.configure(mode)`, then maps + composites. Own binary — it mutates
# process-global `$XDG_RUNTIME_DIR` / `$WAYLAND_DISPLAY`.
[[test]]
name = "wayland_xdg_decoration_socket"
path = "tests/wayland_xdg_decoration_socket.rs"
required-features = ["smithay-adapter"]

# Input delivery proof: a real client maps a toplevel + creates wl_pointer/wl_keyboard, the test injects
# pointer motion/button + a key over the live socket (via the host input channel), and the client asserts
# it received wl_pointer.enter/motion/button (correct surface + surface-local coords) and
# wl_keyboard.enter/key (correct surface + keycode). Its own binary — it mutates process-global env.
[[test]]
name = "wayland_input_socket"
path = "tests/wayland_input_socket.rs"
required-features = ["smithay-adapter"]

# xdg_popup + wl_subsurface placement proof: a real wayland-client maps a toplevel, creates an xdg_popup
# via get_popup with an xdg_positioner (anchor/gravity/offset) + takes a grab, and a wl_subsurface at a
# set_position offset — each in a distinct color — then asserts both composited to the PngPresenter at
# their EXACT resolved positions, and that a pointer press outside the popup dismisses the grab
# (xdg_popup.popup_done). Own binary — it mutates process-global `$XDG_RUNTIME_DIR` / `$WAYLAND_DISPLAY`.
[[test]]
name = "wayland_live_popup_subsurface"
path = "tests/wayland_live_popup_subsurface.rs"
required-features = ["smithay-adapter"]

# The macOS present smoke: build the Cocoa/Metal presenter, present one known-color frame, and read it
# back (offscreen MTLTexture readback — GUI-session-free) to verify the pixels round-tripped on a real
# Metal device. A second (ignored-by-default) test opens a real NSWindow + CAMetalLayer.
[[test]]
name = "macos_present_smoke"
path = "tests/macos_present_smoke.rs"
required-features = ["macos-surface"]

# Opens a REAL NSWindow + CAMetalLayer and presents a color frame (main-thread + GUI session required).
[[example]]
name = "present_window"
path = "examples/present_window.rs"
required-features = ["macos-surface"]

[[example]]
name = "serve_auto_probe"
path = "examples/serve_auto_probe.rs"
required-features = ["smithay-adapter"]
