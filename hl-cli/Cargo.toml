[package]
name = "hl-cli"
version = "0.4.0"
edition = "2021"
description = "The `ddcli` command — run dd containers with easy-access defaults and manage the daemon, without root."
license = "MIT"

[[bin]]
name = "ddcli"
path = "src/main.rs"

[dependencies]
hl-client = { path = "../hl-client" }
hl-term = { path = "../hl-term" }
hl-ws-term = { path = "../hl-ws-term" }
# In-process container launch for `ddcli workspace launch` — NO daemon, NO docker, NO socket. dd-jit
# runs the workspace's image via the linked engine; dd-images resolves/pulls its rootfs. (Both build on
# Linux too — the engine simply reports NoBackend there, so launch falls back to a local shell.)
hl-jit = { path = "../hl-jit" }
hl-images = { path = "../hl-images" }
# GPU/CUDA/display integration as a generic dd-jit DeviceProvider (see hl-gpu/src/integration.rs). The
# launcher constructs a dd-gpu provider from the workspace's gui/cuda config + resolved host paths and
# hands it to the dd-jit builder — dd-jit itself stays device-agnostic. `runtime` pulls the seam in.
hl-gpu = { path = "../hl-gpu", features = ["runtime"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
sha2 = "0.10"
