[package]
name = "hl-daemon"
version = "0.4.0"
edition = "2021"
description = "Docker-Engine-API daemon backed by the dd VM-less JIT runtime."
license = "MIT"

# The daemon is the server binary. Its Docker-Engine-API *client* library now lives in the separate
# `dd-client` crate (which the CLI + GUI depend on), so the daemon no longer pulls in bollard.
[lib]
name = "hl_daemon"
path = "src/lib.rs"

[[bin]]
name = "dd-daemon"
path = "src/main.rs"

# Real-software scenario runner (migrated from dd-tests, ownership-matrix Step 3): boots dd-daemon's OWN
# binary on a private socket and drives popular images through the Docker API. `harness = false` gives it a
# custom `main`, so it is BOTH the `cargo test` CI authority and a developer runner:
#   cargo test -p hl-daemon --test scenarios -- --count
#   cargo test -p hl-daemon --test scenarios -- --backend dd -c databases -t arm
[[test]]
name = "scenarios"
path = "tests/scenarios_runner.rs"
harness = false

[dependencies]
hl_jit = { path = "../hl-jit", package = "hl-jit" }
hl-images = { path = "../hl-images" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "fs", "time"] }
axum = "0.7"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
tower = { version = "0.5", features = ["util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"

# The migrated scenario runner turns a failed container run into an actionable JIT bug report via its
# own `scenario::diag` module (was the product-neutral `dd_tests::diag` helper, folded in when the
# `dd-tests` crate was dissolved). It needs no extra dev-dependency.
