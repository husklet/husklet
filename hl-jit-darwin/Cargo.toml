[package]
name = "hl-jit-darwin"
version = "0.4.0"
edition = "2021"
description = "dd macOS-host backend: the VM-less DBT engine (C, aarch64 + x86-64 Linux guests) + the darwinjail for native macOS containers. Implements the dd-jit backend API. build.rs compiles + codesigns the per-guest engine binaries."
license = "MIT"
build = "build.rs"

[lib]
name = "hl_jit_darwin"
path = "src/lib.rs"

[dependencies]

# dev-only. The engine × case matrix (ownership-matrix Step 2) plus the product-neutral engine-test
# harness (formerly the `dd-tests` crate, now dissolved into `tests/support/**`) live in this crate's
# tests/examples. `dd-jit` (imported as `ddjit`) is this crate's DOWNSTREAM host-neutral API — it
# normally-depends on dd-jit-darwin. Depending back on it is legal ONLY because Cargo permits a
# dependency cycle through dev-dependencies: the cycle dd-jit ↔ dd-jit-darwin is dev-only and never
# enters a shipped build. The harness's `ddjit::{Guest,available,SpawnConfig}` coupling resolves through
# this same dev-dep.
[dev-dependencies]
hl_jit = { path = "../hl-jit", package = "hl-jit" }

# The developer runner for the engine × case matrix (grouped/colored/filterable output). It shares the
# one Rust case registry in tests/engine_matrix via #[path]; `cargo test -p hl-jit-darwin` (tests/suite.rs)
# stays the CI authority. Kept as an example, not a [[bin]], so the dd-jit dev-dep cycle never leaks
# into a normal (non-dev) build.
[[example]]
name = "matrix"
path = "examples/matrix.rs"
