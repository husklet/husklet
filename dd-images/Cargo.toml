[package]
name = "dd-images"
version = "0.4.0"
edition = "2021"
description = "dd image handling: the OCI registry client (pull/push manifests + layers, auth, image refs). The home for image + rootfs building, kept separate from the runtime (dd-jit) and the daemon."
license = "MIT"

[lib]
name = "dd_images"
path = "src/lib.rs"

[dependencies]
# dd-images is runtime-agnostic: it produces a rootfs + arch/config; the CALLER hands the rootfs to a
# runtime (e.g. dd-jit). No dependency on any runtime crate.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
