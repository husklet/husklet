[package]
name = "dd-images"
version = "0.4.0"
edition = "2021"
description = "dd image handling: the OCI registry client (pull/push manifests + layers, auth, image refs). The home for image + rootfs building, kept separate from the runtime (dd-jit) and the daemon."
license = "MIT"

[lib]
name = "dd_images"
path = "src/lib.rs"

[dependencies]
# the container runtime — dd-images builds a rootfs and hands it to dd-jit to run.
dd-jit = { path = "../dd-jit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
