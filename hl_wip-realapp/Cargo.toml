# hl_wip-realapp — proves ONE REAL APP runs end-to-end through the ACTUAL staged shim.
#
# A native aarch64 test dlopen()s the real `~/.hl/cuda/aarch64/libcuda.so.1` (built + staged by
# hl_wip-cuda's build.rs), calls the CUDA Driver API for a vecadd, and a host thread serves the
# GPU-executor socket with a runtime-backed `CpuExecutor`. This exercises the full product data path:
#   guest C-ABI → libcuda shim → RemoteCommandSink → unix socket → host transport server → runtime
#   → CpuExecutor → readback.
#
# EMPTY `[workspace]` table => own workspace root, EXCLUDED from the shared repo-root workspace (never
# drags the heavy engine build in, never seen by the concurrent codex agent's repo-root build). Run with:
#   cargo test --offline --manifest-path hl_wip-realapp/Cargo.toml
[package]
name = "hl_wip_realapp"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The neutral hl-GPU protocol + transport server + reference CpuExecutor (host side of the socket).
hl_gpu = { package = "hl_wip_gpu", path = "../hl_wip-gpu" }
# The CUDA driver crate — used ONLY host-side for the PTX front-end (`adapter::ptx::compile` + the
# canonical `VECADD_PTX` source). `default-features = false` drops the host-only `jit`/hl-jit plug so
# this test crate stays light.
hl_cuda = { package = "hl_wip_cuda", path = "../hl_wip-cuda", default-features = false }
# dlopen/dlsym the staged libcuda.so.1.
libc = "0.2"

# Empty table => own workspace root, excluded from the repo-root workspace.
[workspace]
