name = "top"
display_name = "Top"
version = "0.1.0"
protocol = 1
activation = "tab"

# Process inspection and execution are container authorities in the host. Image
# pulls are separate from image reads. Resource mutation is likewise distinct
# from inventory. Pane inventory, live terminal output, semantic UI text, and
# revision-bound input are separate authorities, so consent describes every
# operation this compact control surface exercises.
capabilities = ["workspaces:read", "workspaces:configure", "workspaces:control", "workspaces:events", "workspace-environment:read", "workspace-environment:write", "extensions:read", "extensions:control", "extensions:install", "extensions:remove", "containers:read", "containers:create", "containers:execute", "containers:lifecycle", "containers:remove", "containers:attach", "images:read", "images:pull", "images:remove", "images:prune", "volumes:read", "volumes:write", "networks:read", "networks:create", "networks:remove", "networks:connect", "networks:disconnect", "networks:publish", "terminals:read", "terminals:input", "terminals:focus", "terminals:layout-control", "terminals:process-control", "terminals:output", "panes:observe", "panes:semantic-read", "panes:semantic-control", "preferences:read", "preferences:write", "interface:render"]

[workspace_environment]
read = [{ all = true }]
write = [{ all = true }]

# Top is the explicit workspace administrator. Ordinary extensions omit this
# section and consequently receive authority over no containers.
[containers]
selectors = [{ all = true }]
create = true

[images]
read = [{ all = true }]
use = [{ all = true }]
pull = [{ all = true }]
remove = [{ all = true }]
prune_all_unused = true

# Top is also the network administrator. Other extensions name only the exact
# networks they require, and omission grants no network resources.
[networks]
selectors = [{ all = true }]
create = true

[volumes]
selectors = [{ all = true }]
create = true

[interface]
tab_title = "Top"
icon = "utilities-system-monitor-symbolic"

[[pane_providers]]
id = "workspace"
title = "Workspace"
icon = "utilities-system-monitor-symbolic"

