# What this extension is and what it may do.
#
# The image label `husklet.extension.manifest` names this file's path inside
# the image, so the contract lives beside the source and is reviewed with it.

name = "storybook"
display_name = "Component playground"
version = "0.1.0"
protocol = 1

# Draw, and nothing else. A playground renders components; it has no business
# reading a container or a file.
capabilities = ["interface:render"]

[interface]
tab_title = "Components"

[[pane_providers]]
id = "playground"
title = "Component playground"
icon = "applications-development-symbolic"
