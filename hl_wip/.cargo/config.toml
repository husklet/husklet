# This host's cargo libcurl fails TLS verification against the sparse crates.io index, but the system git
# (which uses the OS curl/openssl) verifies fine — so pull the index over the git protocol with the git
# CLI. Scoped to this standalone crate only (it has its own [workspace]); does not affect the shared root
# tree. Mirrors hl_wip-gpu-wgpu/.cargo/config.toml.
[registries.crates-io]
protocol = "git"

[net]
git-fetch-with-cli = true

# Smithay's mandatory `xkbcommon` dep links `-lxkbcommon`, which needs the *unversioned* .so. This host
# ships only libxkbcommon.so.0, so point the linker at the local `.linklibs/` dir holding a
# `libxkbcommon.so -> .so.0` symlink. Runtime resolves .so.0 from the standard path. Mirrors
# hl_wip-compositor/.cargo/config.toml's approach.
[build]
rustflags = ["-L", "native=/Users/x/dd/dd/hl_wip/.linklibs"]
