# hl — VM-less Linux container runtime on macOS. Cargo workspace.
[workspace]
resolver = "2"
members = [
    "src/runtime/*",
    "src/containers/hl-engine",
    "src/containers/hl-client",
    "src/containers/hl-container",
    "src/containers/hl-daemon",
    "src/containers/hl-images",
    "src/workspaces/hl-gui",
    "src/workspaces/hl-ws-term",
    "src/workspaces/hl-ws",
    "src/packages/hl-log",
    "src/packages/hl-fs",
    "src/packages/hl-softfloat",
    "src/packages/hl-design",
    "src/packages/hl-design-lint",
    "src/apps/husklet",
    "src/apps/testing",
]
default-members = [
    "src/workspaces/hl-ws-term",
    "src/workspaces/hl-ws",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/husklet/husklet"
homepage = "https://github.com/husklet/husklet"
rust-version = "1.93"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
fs2 = "0.4"
http = "1"
http-body-util = "0.1"
hl-engine = { path = "src/containers/hl-engine" }
hl-design = { path = "src/packages/hl-design" }
hyper = "1"
hyper-util = "0.1"
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
oci-spec = "0.9"
percent-encoding = "2"
reflink-copy = "0.1.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
socket2 = "0.6"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
tower = "0.5"
uuid = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
# hl-gui pulls in GTK4/libadwaita (pkg-config), which isn't present on the Linux dev host.
# Keep it out of the default set so a bare `cargo build` works everywhere; build it
# explicitly with `cargo build -p hl-gui` (or `make app`) on the macOS host.
[profile.release]
opt-level = 2
panic = "abort"

[profile.dev]
panic = "abort"
incremental = false

[profile.dev.package.hl-execution]
opt-level = 2

[profile.test]
incremental = false
