# dd-gpu-wgpu — a `wgpu` + `naga` implementation of the `dd_gpu::GpuBackend` executor trait.
#
# THIN GUEST, FAT HOST: the same backend lowers the host-GPU-agnostic dd-GPU IR to Metal today and
# (via wgpu's other backends) Vulkan/D3D12/GL later. All shader translation (SPIR-V/GLSL/WGSL -> the
# module wgpu consumes) runs host-side in `naga`, so the guest shim only forwards shader bytes — a
# strictly thinner guest than the in-guest MSL packing the bespoke `dd-display` Metal replay uses.
#
# BUILD GATING: wgpu/naga/pollster are heavy, macOS/Metal-only deps here. They are declared ONLY under
# the `cfg(target_os = "macos")` target block, and the crate is a workspace MEMBER but NOT a
# default-member, so a bare `cargo build` on the Linux dev host never resolves-and-builds them and the
# headless dd-gpu / dd-display core keep building with zero new compiled deps. The Linux build of THIS
# crate compiles to an empty lib (all code is `#[cfg(target_os = "macos")]`).
[package]
name = "dd-gpu-wgpu"
version = "0.1.0"
edition = "2021"
description = "wgpu + naga host executor implementing dd_gpu::GpuBackend — lowers the dd-GPU command IR to Metal now (Vulkan/D3D12/GL later), with all shader translation host-side in naga."
license = "MIT"

[lib]
name = "dd_gpu_wgpu"
path = "src/lib.rs"

[dependencies]
# The IR + GpuBackend trait this crate implements. Pure-std, no transitive deps — safe on every host.
dd-gpu = { path = "../dd-gpu" }

# The real executor stack — macOS/Metal only (see header). Versions pinned to what the feasibility spike
# proved (wgpu 24.0.5 / naga 24 / pollster 0.4); wgpu's API churns across majors, so pin the major.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "24", default-features = false, features = ["metal", "wgsl"] }
naga = { version = "24", features = ["glsl-in", "spv-in", "wgsl-in", "wgsl-out", "msl-out", "spv-out"] }
pollster = "0.4"

[[example]]
name = "verify_ir"
path = "examples/verify_ir.rs"
