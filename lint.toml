[dependency]
ignored_packages = ["hl-design-lint"]

[[dependency.layers]]
name = "package"
directory = "packages"
may_depend_on = ["package"]

[[dependency.layers]]
name = "runtime"
directory = "runtime"
may_depend_on = ["package", "runtime"]

[[dependency.layers]]
name = "container"
directory = "containers"
may_depend_on = ["package", "runtime", "container"]

[[dependency.layers]]
name = "workspace"
directory = "workspaces"
may_depend_on = ["package", "runtime", "workspace"]

[[dependency.layers]]
name = "application"
directory = "apps"
may_depend_on = ["package", "runtime", "container", "workspace", "application"]

[[dependency.package_budgets]]
package = "hl-native"
maximum = 1

[documentation]
allowed = [
    "AGENTS.md",
    "README.md",
    "lint/examples/negative.md",
    "lint/examples/positive.md",
    "todo.md",
    # An extension package is published on its own; its readme is how anyone
    # depending on it learns the interface.
    "extensions/react/README.md",
    "extensions/storybook/README.md",
]
examples = ["lint/examples/negative.md", "lint/examples/positive.md"]

[unsafe_boundary]
module_names = ["ffi"]
[[unsafe_boundary.module_owners]]
domain = "apps"
[[unsafe_boundary.module_owners]]
package = "hl-engine"
[[unsafe_boundary.allow]]
path_contains = "/src/native/"
[[unsafe_boundary.allow]]
package = "hl-engine"
path_contains = "/src/ffi"
[[unsafe_boundary.allow]]
domain = "apps"
path_contains = "/src/ffi"

[environment_boundary]
[[environment_boundary.allow]]
domain = "apps"
[[environment_boundary.allow]]
package = "hl-engine"
[command_boundary]
[[command_boundary.allow]]
package = "hl-engine"
module_prefix = ["native"]
[[command_boundary.allow]]
package = "hl-engine"
module_prefix = ["platform"]
[[command_boundary.allow]]
package = "hl-engine"
file = "main.rs"

[ownership]
protected_domains = ["runtime"]
tool_names = ["testing"]
tool_contains = ["audit"]
tool_suffixes = ["-test", "-tests", "-tool", "-tools"]
destination_domain = "src/apps"

[source]
ignored_directories = [".codegraph", ".git", "target", "vendor", "lint", "node_modules"]
ignored_markers = [".hl-external-corpus", ".hl-generated-artifacts"]
self_packages = ["hl-design-lint"]
foreign_source_directories = ["native", "schema"]

[c_interface]
maximum_functions = 24

[c_result]
must_use_functions = ["fdopen", "fopen", "realloc", "tmpfile"]

[c_safety]
operations = ["gets", "vsprintf"]

[c_allocation]
functions = ["calloc", "malloc", "realloc"]
