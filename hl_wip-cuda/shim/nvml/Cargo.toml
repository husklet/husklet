# hl_wip-cuda shim: the guest NVML front-end, deployed as `libnvidia-ml.so.1`.
#
# A cdylib whose exported `nvml*` C-ABI surface is code-generated from `registry/nvml.manifest` (build.rs)
# so it can never drift from the golden surface (62 entry points) extracted from the clean-room oracle
# `hl-gpu/nvml/nvml_shim.c`. NVML is device-info, not a compute path, so most entry points are benign
# truthful stubs; the init/shutdown/error/count/handle/name/version basics have real bodies so a probe
# (`nvidia-smi`-style enumeration) accepts the simulated single device.
#
# Carries an EMPTY `[workspace]` so it is its own workspace root — cross-compiled standalone by
# hl_wip-cuda/build.rs.
[package]
name = "hl_wip_cuda_shim_nvml"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "hl_nvml_guest"
crate-type = ["cdylib"]

[dependencies]
# NVML reports the same simulated device the driver advertises; reuse its descriptor for name/uuid/cc.
hl_cuda = { package = "hl_wip_cuda", path = "../..", default-features = false }

[profile.release]
panic = "abort"
opt-level = "z"

[workspace]
