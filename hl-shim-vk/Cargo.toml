# hl-shim-vk — the guest Vulkan driver (a Vulkan ICD), as a first-class PRODUCT crate (FOUNDATION).
#
# Cross-compiles to the guest ELF targets and links as the shared object a standard Vulkan **loader**
# (libvulkan) discovers through an `icd.json` manifest (`VK_ICD_FILENAMES`/`VK_DRIVER_FILES`). An
# unmodified Vulkan app opens `libvulkan`, the loader loads this driver, negotiates the loader<->ICD
# interface (`vk_icdNegotiateLoaderICDInterfaceVersion`), and resolves every `vk*` entry point through
# our `vk_icdGetInstanceProcAddr`. The device we report is "hl Metal (Vulkan)"; the compute/render
# path lowers into a hl-gpu IR stream through `hl-shim-common`'s transport — the SAME IR the host
# decodes with the SAME Rust code (no hand-rolled second encoder). Mirrors hl-shim-gl / hl-shim-cuda.
#
# The ICD interface is ported from the AUTHORITATIVE Khronos sources (Vulkan-Loader
# docs/LoaderDriverInterface.md + include/vulkan/vk_icd.h; MoltenVK vulkan.mm for the negotiation +
# dispatch shape); the exported `vk*` SURFACE is code-generated from the Khronos `vk.xml` registry
# (see build.rs + registry/). Bring-up entry points have real bodies (instance/physical-device/device/
# queue/command-pool); the long tail are spec-faithful correct-ABI HL_SHIM_DEBUG-traced stubs, ported
# incrementally in later increments. See docs/rendering/SHIM_RUST_ARCHITECTURE.md.
[package]
name = "hl-shim-vk"
version = "0.1.0"
edition = "2021"
description = "Guest Vulkan ICD producing libvk_hl.so: vk.xml-generated vk* entry-point surface + loader-ICD interface (vk_icdGetInstanceProcAddr / negotiation) over hl-shim-common's shared hl-gpu IR transport."
license = "MIT"

[lib]
name = "vk_hl"
# cdylib = the deployed ICD (libvk_hl.so, named by icd.json's library_path); rlib so the smoke/anti-drift
# tests and other Rust can link it. The rlib is build-time-only; the deployed .so is unaffected.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Transport + shared IR re-export (the anti-drift contract): the shim encodes with the SAME
# `hl_gpu::ir::Cmd` the host decodes with `Cmd::decode`.
hl-shim = { path = "../hl-shim" }
# The shared hl-gpu IR (buffers/textures/shaders/pipelines/passes/fences) the Vulkan object model maps
# onto. Same `hl-gpu` path hl-shim-common depends on, so the IR types are identical (no drift).
hl-gpu = { path = "../hl-gpu" }
# `ash` (the Khronos-blessed Rust Vulkan bindings) is used ONLY for its `vk` module's spec-exact,
# `#[repr(C)]` type layouts (VkPhysicalDeviceProperties/Limits, VkInstanceCreateInfo, the enums, the
# handle newtypes, VkResult, ...) so the real bring-up entry points fill the ABI-correct structs a
# real loader/app reads back — rather than hand-transcribing ~100-field structs. `default-features =
# false` pulls in the types only (no libvulkan link, no loader). This is the "reference ash for the
# exact Rust type surface" the plan calls for.
ash = { version = "0.38", default-features = false }
# NB: an injected ICD must never unwind a Rust panic across the C-ABI boundary into the loader.
# `extern "C"` functions abort-on-unwind by default (Rust >= 1.81), so a panic aborts rather than
# corrupting the loader; no per-crate `panic = "abort"` is needed.
#
# The end-to-end Vulkan-on-real-Metal validations live in `hl-gpu-wgpu/tests/vk_compute.rs` +
# `vk_triangle.rs` (next to the `spirv_*` host seam they replay on), NOT here — so this crate keeps a
# tiny, always-cached dependency set (hl-shim-common + hl-gpu + ash) and `cargo build -p hl-shim-vk`
# stays offline-buildable on the Linux guest host. hl-gpu-wgpu dev-depends on this crate to drive them.
